<div class="content-header pb-0">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-12">
        <h5 class="m-0 font-weight-bold">
          <i class="fas fa-paper-plane text-maroon mr-2"></i>Status Pengiriman SK
        </h5>
        <hr class="style-sultan-solid">
      </div>
    </div>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12">

        <div class="card-sultan mb-3">
          <div class="card-body py-2 px-3 border-left-dark">
            <div class="d-flex align-items-center justify-content-between cursor-pointer" 
                 data-toggle="collapse" data-target="#infoCollapse" aria-expanded="false">
              <div class="d-flex align-items-center text-maroon font-weight-bold">
                <i class="fas fa-info-circle mr-2"></i> Informasi
              </div>
              <i class="fas fa-chevron-down text-muted icon-sm"></i>
            </div>
            <div id="infoCollapse" class="collapse">
              <div class="mt-2 pt-2 border-top small text-muted">
                <ul class="mb-0 pl-3 text-dark mt-2" style="font-size: 14px; line-height: 1.6;">
                    <li>Halaman ini menampilkan progres pengiriman SK Pembagian Tugas.</li>
                    <li>Gunakan fitur Cari atau Filter Sekolah untuk menemukan data spesifik.</li>
                </ul>
              </div>
            </div>
          </div>
        </div>

        <div class="card-sultan p-3 mb-3">
            <div class="d-flex-gap align-items-center">
                <button type="button" class="btn border-tegas shadow-sm bg-white" onclick="initDataStatus(true)" title="Refresh Data">
                   <i class="fas fa-sync-alt text-maroon"></i>
                </button>

                <select id="filterSekolah" class="form-control form-control-sultan input-auto-width min-w-250">
                    <option value="">- Semua Sekolah -</option>
                </select>

                <div class="divider-vertical"></div>

                <button type="button" id="btnCari" class="btn btn-maroon shadow-sm" onclick="filterLocalData()" title="Cari Data">
                    <i class="fas fa-search text-white"></i>
                </button>
            </div>
        </div>

        <div class="card-sultan">
            <div class="card-body p-3">
              
              <table id="tabelStatus" class="table table-bordered table-hover table-premium table-sultan-compact mb-0 w-100">
                <thead id="headTabelStatus" class="text-center" style="display:none;"></thead>
                <tbody id="bodyTabelStatus">
                    <tr>
                        <td class="text-center p-5" colspan="100%">
                            <div class="sultan-loading-container">
                                <i class="fas fa-spinner fa-spin fa-3x text-maroon mb-3"></i>
                                <h6 class="text-muted font-weight-bold">Mengambil Data Status...</h6>
                            </div>
                        </td>
                    </tr>
                </tbody>
              </table>

            </div>
        </div>

      </div>
    </div>
  </div>
</section>

<script>
    var GLOBAL_DATA = []; 
    var GLOBAL_HEADERS = [];

    $(document).ready(function() {
        initDataStatus();
    });

    function initDataStatus(isRefresh = false) {
        if(isRefresh) {
             if ($.fn.DataTable.isDataTable('#tabelStatus')) { $('#tabelStatus').DataTable().destroy(); }
             $('#headTabelStatus').hide();
             $('#bodyTabelStatus').html('<tr><td class="text-center p-5" colspan="100%"><div class="sultan-loading-container"><i class="fas fa-spinner fa-spin fa-3x text-maroon mb-3"></i><h6 class="text-muted font-weight-bold">Memuat ulang...</h6></div></td></tr>');
             $('#btnCari').prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i>');
        }

        google.script.run
            .withSuccessHandler(function(res) {
                $('#btnCari').prop('disabled', false).html('<i class="fas fa-search text-white"></i>');
                
                if (res.error) {
                    $('#bodyTabelStatus').html(`<tr><td class="text-center text-danger p-5 font-weight-bold">${res.error}</td></tr>`);
                    return;
                }

                GLOBAL_HEADERS = res.headers;
                GLOBAL_DATA = res.rows;
                
                populateDropdown(res.schools);
                renderTabel(GLOBAL_DATA);
            })
            .withFailureHandler(function(err) {
                $('#btnCari').prop('disabled', false).html('<i class="fas fa-search text-white"></i>');
                $('#bodyTabelStatus').html(`<tr><td class="text-center text-danger p-5">Error: ${err.message}</td></tr>`);
            })
            .getSiabaStatusData();
    }

    function populateDropdown(schools) {
        var el = $('#filterSekolah');
        var currentVal = el.val();
        el.empty().append('<option value="">- Semua Sekolah -</option>');
        schools.forEach(s => el.append(`<option value="${s}">${s}</option>`));
        if(currentVal) el.val(currentVal);
    }

    function filterLocalData() {
        var filterVal = $('#filterSekolah').val();
        var rowsToShow = GLOBAL_DATA;
        if (filterVal && filterVal !== "") {
            rowsToShow = GLOBAL_DATA.filter(r => r[0] === filterVal);
        }
        renderTabel(rowsToShow);
    }

    function renderTabel(rows) {
        if ($.fn.DataTable.isDataTable('#tabelStatus')) {
            $('#tabelStatus').DataTable().clear().destroy();
        }
        $('#bodyTabelStatus').empty();

        if (!rows || rows.length === 0) {
            $('#headTabelStatus').show();
            initDataTableStandard('#tabelStatus', true);
            return;
        }

        // 1. BANGUN HEADER (Dinamis dari Baris 1 Spreadsheet)
        // PERBAIKAN: Kembalikan class col-sticky-left untuk kolom pertama (Index 0)
        var htmlHead = '<tr>';
        GLOBAL_HEADERS.forEach(function(h, idx) {
            var label = (h && h !== "") ? h : "Kolom " + (idx+1);
            
            // LOGIKA FREEZE COLUMN (KEMBALI KE ASALNYA)
            var stickyClass = (idx === 0) ? 'col-sticky-left' : '';
            var styleAttr = (idx === 0) ? 'style="min-width: 250px;"' : ''; // Menjaga lebar kolom nama sekolah
            
            htmlHead += `<th class="text-center align-middle text-nowrap ${stickyClass}" ${styleAttr}>${label}</th>`;
        });
        htmlHead += '</tr>';
        $('#headTabelStatus').html(htmlHead);

        // 2. BANGUN BODY
        var htmlBody = '';
        rows.forEach(function(row) {
            // PERBAIKAN: ANIMASI TETAP ADA
            htmlBody += '<tr class="tr-animasi">';
            
            // Kolom Nama Sekolah (Sticky, Bold & Background Putih agar tidak transparan)
            htmlBody += `<td class="col-sticky-left font-weight-bold align-middle text-nowrap bg-white text-dark">${row[0]}</td>`;
            
            // Kolom Status (Badge Sultan dengan Ikon)
            for (var i = 1; i < row.length; i++) {
                htmlBody += `<td class="text-center align-middle">${getBadgeSultan(row[i])}</td>`;
            }
            htmlBody += '</tr>';
        });
        
        $('#bodyTabelStatus').html(htmlBody);
        $('#headTabelStatus').show();
        
        setTimeout(function() { initDataTableStandard('#tabelStatus'); }, 10);
    }

    // --- HELPER STANDARD (COPY DARI PAGE_SK_DATA) ---
    function initDataTableStandard(id, empty){ 
        if ($.fn.DataTable.isDataTable(id)) $(id).DataTable().clear().destroy(); 
        $(id).DataTable({ 
            ordering:false, 
            pageLength:10, 
            autoWidth:false, 
            language:{url:"//cdn.datatables.net/plug-ins/1.10.25/i18n/Indonesian.json", emptyTable: empty?"Silakan cari data":"Data kosong"}, 
            initComplete: function(){ 
                if(!$(id).parent().hasClass('table-scroll-wrapper')) $(id).wrap('<div class="table-scroll-wrapper" style="overflow-x: auto; width:100%"></div>'); 
                setTimeout(()=>$(id).DataTable().columns.adjust(), 300); 
            },
            dom: "<'row mb-2'<'col-sm-12 col-md-6'l><'col-sm-12 col-md-6'f>>" +
                 "<'row'<'col-sm-12'tr>>" +
                 "<'row mt-2'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>"
        }); 
    }

    // --- BADGE SULTAN (ICON BULAT - STANDARD BARU) ---
    function getBadgeSultan(status) {
        if (!status || status === "-" || status === "") {
            return '<i class="fas fa-minus text-black-50 small" style="opacity:0.2"></i>';
        }
        
        var s = String(status).trim();
        var stLower = s.toLowerCase();

        // Base Class untuk bentuk bulat
        var baseClass = "btn-icon-sultan shadow-sm"; 
        var iconHtml = "";

        // 1. REVISI -> Kuning (Sync)
        if (stLower.includes('revisi') || stLower.includes('perbaiki')) {
             iconHtml = `<div class="${baseClass} btn-icon-sultan-warning" data-toggle="tooltip" title="${s}" style="cursor:help;">
                            <i class="fas fa-sync-alt"></i>
                         </div>`;
        }
        // 2. DITOLAK -> Merah (Times)
        else if (stLower.includes('tolak') || stLower.includes('x') || stLower.includes('salah')) {
             iconHtml = `<div class="${baseClass} btn-icon-sultan-danger" data-toggle="tooltip" title="${s}" style="cursor:help;">
                            <i class="fas fa-times"></i>
                         </div>`;
        }
        // 3. DISETUJUI -> Hijau (Check)
        else if (stLower.includes('verif') || stLower.includes('setuju') || stLower.includes('ok') || stLower.includes('valid')) {
             iconHtml = `<div class="${baseClass} btn-icon-sultan-success" data-toggle="tooltip" title="${s}" style="cursor:help;">
                            <i class="fas fa-check"></i>
                         </div>`;
        }
        // 4. DIPROSES (Biasanya Tanggal) -> Biru (Spinner)
        else if (s.length > 5) {
             iconHtml = `<div class="${baseClass} btn-icon-sultan-info" data-toggle="tooltip" title="${s}" style="cursor:help;">
                            <i class="fas fa-spinner fa-spin"></i>
                         </div>`;
        }
        // 5. TEXT PENDEK (Misal: "Belum") -> Teks Biasa
        else {
             return `<span class="text-muted small font-weight-bold" style="font-size:11px;">${s}</span>`;
        }

        return iconHtml;
    }
</script>
