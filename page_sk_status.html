<div class="content-header pb-0">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-12">
        <h5 class="m-0 font-weight-bold">
          <i class="fas fa-chart-line text-maroon mr-2"></i>Status Pengiriman SK
        </h5>
        <hr class="mt-2 mb-3" style="border-top: 2px solid #800000;">
      </div>
    </div>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12">
        
        <div class="control-bar mb-3 d-flex flex-wrap justify-content-between align-items-center bg-white p-3 shadow-sm rounded">
          
          <div class="d-flex align-items-center flex-wrap" style="gap: 8px;">
            <button type="button" class="btn border-tegas btn-square-sultan shadow-sm" onclick="refreshStatus()" title="Refresh Data">
              <i class="fas fa-sync-alt text-maroon"></i>
            </button>
            <div style="height: 25px; width: 1px; background: #dee2e6; margin: 0 5px;"></div>
            <select id="filterSD" class="form-control filter-select border-tegas shadow-sm" style="min-width: 250px;">
              <option value="">- Semua Sekolah -</option>
            </select>
          </div>

          <div class="mt-2 mt-xl-0 position-relative" style="flex-grow: 1; max-width: 300px;">
            <input type="text" id="customSearch" class="form-control border-tegas shadow-sm" placeholder="Cari Sekolah..." style="padding-right: 35px;">
            <i class="fas fa-search position-absolute text-muted" style="right: 12px; top: 11px;"></i>
          </div>
        </div>

        <div class="card shadow-sm border-0">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table id="tabelStatusSK" class="table table-hover table-premium table-sticky-first mb-0 nowrap" style="width:100%;">
                <thead id="headTabelStatus">
                  </thead>
                <tbody id="bodyTabelStatus">
                  </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>

<script>
$(document).ready(function() {
  muatDataStatus();
  
  $('#filterSD').on('change', function() { 
      $('#tabelStatusSK').DataTable().column(0).search(this.value).draw(); 
  });

  $('#customSearch').on('keyup', function() { 
      $('#tabelStatusSK').DataTable().search(this.value).draw(); 
  });
});

function refreshStatus() {
  if ($.fn.DataTable.isDataTable('#tabelStatusSK')) { 
      $('#tabelStatusSK').DataTable().destroy(); 
      $('#headTabelStatus').empty(); 
      $('#bodyTabelStatus').empty();
  }
  muatDataStatus();
}

function muatDataStatus() {
  NotifSultan.loading("Memuat Status...");
  google.script.run
    .withSuccessHandler(function(data) {
      Swal.close();
      if (!data || !data.rows || data.rows.length === 0) {
         NotifSultan.alert('error', 'DATA KOSONG', 'Belum ada data status.');
         return;
      }
      renderTabelStatus(data);
    })
    .withFailureHandler(function(err) {
      NotifSultan.alert('error', 'ERROR', err.message);
    })
    .getStatusPengiriman();
}

function renderTabelStatus(data) {
  var headers = data.headers;
  var rows = data.rows;

  // 1. BANGUN HEADER (MENGGUNAKAN STYLE STANDARD TEMPLATE)
  // Tidak ada inline style font/width lagi. Lebar diatur otomatis oleh 'nowrap'.
  var trHead = '<tr>';
  headers.forEach(function(colName, idx) {
     var classAlign = idx === 0 ? 'text-left' : 'text-center';
     trHead += `<th class="${classAlign}">${colName}</th>`;
  });
  trHead += '</tr>';
  $('#headTabelStatus').html(trHead);

  // 2. BANGUN BODY
  var tbody = $('#bodyTabelStatus');
  tbody.empty();
  var setSD = new Set();

  rows.forEach(function(row) {
    var tr = '<tr>';
    if(row[0]) setSD.add(row[0]);

    row.forEach(function(cell, idx) {
       // -- KOLOM 1: NAMA SEKOLAH --
       if (idx === 0) {
         tr += `<td class="font-weight-bold text-dark">${cell}</td>`;
       } 
       // -- KOLOM SELANJUTNYA: STATUS --
       else {
         var txt = String(cell || '').trim(); // Bersihkan teks
         var lowerTxt = txt.toLowerCase();
         var badgeClass = ''; // Default Kosong (Tanpa Badge)
         
         // Logika Pewarnaan (Sesuai Template)
         // Jika kosong atau "-", biarkan badgeClass kosong
         if (txt !== '' && txt !== '-' && txt !== '0') {
             if (lowerTxt === 'sudah' || lowerTxt === 'ok' || lowerTxt === 'lengkap' || lowerTxt === 'v' || lowerTxt === 'valid') {
                 badgeClass = 'badge-success'; // Hijau
             } 
             else if (lowerTxt === 'belum' || lowerTxt === 'x' || lowerTxt === 'kosong' || lowerTxt === 'ditolak') {
                 badgeClass = 'badge-danger';  // Merah
             } 
             else if (lowerTxt === 'kurang' || lowerTxt === 'revisi' || lowerTxt === 'perbaikan') {
                 badgeClass = 'badge-warning'; // Kuning
             }
             else if (lowerTxt === 'diproses' || lowerTxt === 'proses') {
                 badgeClass = 'badge-primary'; // Biru
             } else {
                 // Jika ada isi tapi tidak dikenali, kasih warna abu (opsional)
                 badgeClass = 'badge-secondary';
             }
         }

         // Render Sel
         if (badgeClass) {
             // Jika punya status warna
             tr += `<td class="text-center"><span class="badge ${badgeClass}" style="padding: 6px 12px; min-width: 80px;">${cell}</span></td>`;
         } else {
             // Jika kosong atau "-" (Teks Polos)
             tr += `<td class="text-center text-muted">${cell || '-'}</td>`;
         }
       }
    });
    tr += '</tr>';
    tbody.append(tr);
  });

  isiOpsi('filterSD', setSD);

  // 3. DATATABLES CONFIG (AUTO WIDTH)
  $('#tabelStatusSK').DataTable({
    "scrollX": true,
    "responsive": false,
    "ordering": false, 
    "autoWidth": true, // Aktifkan Auto Width
    "pageLength": 15,
    "language": { "url": "//cdn.datatables.net/plug-ins/1.10.25/i18n/Indonesian.json" },
    "dom": 't<"d-flex justify-content-between align-items-center mt-3 px-2 bg-white border-top py-2"ip>',
    
    "initComplete": function() { 
        setTimeout(function() { 
            $('#tabelStatusSK').DataTable().columns.adjust(); 
            $(window).trigger('resize'); 

            // --- AKTIFKAN DISINI ---
            if (typeof enableDragScroll === "function") {
               enableDragScroll('tabelStatusSK');
            }
        }, 500); 
    },
    "drawCallback": function() { 
        $('.dataTables_scrollHead').css('border-bottom', 'none'); 
        // Style Freeze Column
        $('.table-sticky-first td:first-child, .table-sticky-first th:first-child').css({
            'position': 'sticky', 'left': 0, 'background-color': '#fff', 'z-index': 2,
            'border-right': '2px solid #dee2e6'
        });
        $('.table-sticky-first thead th:first-child').css({
            'z-index': 5, 'background-color': '#dfe6e9' 
        });
    }
  });
}

function isiOpsi(id, set) {
    const el = document.getElementById(id);
    const first = el.options[0];
    el.innerHTML = ''; el.appendChild(first);
    Array.from(set).sort().forEach(item => {
        const opt = document.createElement('option'); opt.value = item; opt.text = item; el.appendChild(opt);
    });
}
</script>

<style>
  /* CSS PENTING: AUTO WIDTH KONTEN */
  /* nowrap membuat sel melebar mengikuti teks terpanjang (misal nama sekolah panjang) */
  table.nowrap th, table.nowrap td {
      white-space: nowrap;
      padding-left: 15px !important;
      padding-right: 15px !important;
  }
  
  /* Fix Header Style agar sama dengan template master */
  #tabelStatusSK thead th {
      vertical-align: middle !important;
      height: 35px !important; /* Samakan tinggi header */
  }

  /* Style Freeze Column */
  .table-sticky-first th:first-child,
  .table-sticky-first td:first-child {
      position: sticky; left: 0; background-color: #fff; z-index: 1;
      box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1);
  }
</style>
