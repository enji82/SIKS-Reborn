<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="content-header">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-6">
        <h1 class="m-0 text-maroon font-weight-bold"><i class="fas fa-chart-line mr-2"></i>Monitoring Aktivitas</h1>
      </div>
    </div>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    
    <div class="row">
      <div class="col-md-4">
        <div class="info-box shadow-sm">
          <span class="info-box-icon bg-maroon"><i class="fas fa-eye"></i></span>
          <div class="info-box-content">
            <span class="info-box-text">Total Akses</span>
            <span class="info-box-number" id="lbl-total">Loading...</span>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="info-box shadow-sm">
          <span class="info-box-icon bg-success"><i class="fas fa-briefcase"></i></span>
          <div class="info-box-content">
            <span class="info-box-text">Akses Hari Efektif</span>
            <span class="info-box-number" id="lbl-kerja">...</span>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="info-box shadow-sm">
          <span class="info-box-icon bg-warning"><i class="fas fa-umbrella-beach"></i></span>
          <div class="info-box-content">
            <span class="info-box-text">Akses Hari Libur</span>
            <span class="info-box-number" id="lbl-libur">...</span>
          </div>
        </div>
      </div>
    </div>

    <div class="row mt-2">
      <div class="col-12">
        <div class="card card-maroon card-outline">
          <div class="card-header border-0">
            <div class="d-flex justify-content-between">
              <h3 class="card-title font-weight-bold">Tren Kunjungan Harian</h3>
            </div>
          </div>
          <div class="card-body">
            <canvas id="chartDaily" style="min-height: 250px; height: 250px; max-height: 250px; max-width: 100%;"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6">
        <div class="card card-info card-outline">
          <div class="card-header"><h3 class="card-title">Statistik Mingguan</h3></div>
          <div class="card-body">
            <canvas id="chartWeekly" style="min-height: 250px; height: 250px; max-height: 250px; max-width: 100%;"></canvas>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card card-success card-outline">
          <div class="card-header"><h3 class="card-title">Statistik Bulanan</h3></div>
          <div class="card-body">
            <canvas id="chartMonthly" style="min-height: 250px; height: 250px; max-height: 250px; max-width: 100%;"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div class="row mt-2">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header bg-maroon text-white">
            <h3 class="card-title"><i class="fas fa-medal mr-2"></i>Top 10 User Rajin</h3>
          </div>
          <div class="card-body p-0 table-responsive">
            <table class="table table-striped table-sm">
              <thead><tr><th>#</th><th>Nama User</th><th class="text-center">Total</th></tr></thead>
              <tbody id="table-top-users"><tr><td colspan="3" class="text-center p-3">Memuat...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card">
          <div class="card-header bg-secondary text-white">
            <h3 class="card-title"><i class="fas fa-user-clock mr-2"></i>User Belum Aktif</h3>
          </div>
          <div class="card-body p-0 table-responsive" style="max-height: 300px;">
            <table class="table table-head-fixed table-hover text-nowrap table-sm">
              <thead><tr><th>#</th><th>Nama User</th><th>Status</th></tr></thead>
              <tbody id="table-passive-users"><tr><td colspan="3" class="text-center p-3">Memuat...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>

<script>
  $(document).ready(function(){
    loadMonitoringData();
  });

  function loadMonitoringData() {
    google.script.run.withSuccessHandler(function(data){
       if(data) {
         // 1. ISI LABEL ANGKA
         $('#lbl-total').text(data.summary.total);
         $('#lbl-kerja').text(data.summary.kerja);
         $('#lbl-libur').text(data.summary.libur);

         // --- HELPER FUNCTION UNTUK CHART ---
         function renderChart(canvasId, type, labels, values, color, labelName) {
            new Chart(document.getElementById(canvasId), {
                type: type,
                data: {
                  labels: labels,
                  datasets: [{
                    label: labelName,
                    backgroundColor: color,
                    borderColor: color,
                    borderWidth: 1,
                    data: values,
                    fill: false
                  }]
                },
                options: { 
                    maintainAspectRatio: false, 
                    responsive: true,
                    scales: { y: { beginAtZero: true } }
                }
            });
         }

         // 2. RENDER CHART HARIAN
         var dayKeys = Object.keys(data.chartData.daily).sort();
         var dayVals = dayKeys.map(k => data.chartData.daily[k]);
         renderChart('chartDaily', 'line', dayKeys, dayVals, '#800000', 'Pengunjung Harian');

         // 3. RENDER CHART MINGGUAN (BARU)
         var weekKeys = Object.keys(data.chartData.weekly).sort();
         var weekVals = weekKeys.map(k => data.chartData.weekly[k]);
         renderChart('chartWeekly', 'bar', weekKeys, weekVals, '#17a2b8', 'Pengunjung Mingguan');

         // 4. RENDER CHART BULANAN (BARU)
         var monthKeys = Object.keys(data.chartData.monthly).sort();
         var monthVals = monthKeys.map(k => data.chartData.monthly[k]);
         renderChart('chartMonthly', 'bar', monthKeys, monthVals, '#28a745', 'Pengunjung Bulanan');


         // 5. ISI TABEL
         var htmlTop = '';
         if (data.topUsers.length > 0) {
           data.topUsers.forEach((u, i) => {
             htmlTop += `<tr><td>${i+1}</td><td>${u.name}</td><td class="text-center font-weight-bold">${u.count}</td></tr>`;
           });
         } else { htmlTop = '<tr><td colspan="3" class="text-center">Belum ada data.</td></tr>'; }
         $('#table-top-users').html(htmlTop);

         var htmlPasif = '';
         if (data.passiveUsers.length > 0) {
           data.passiveUsers.forEach((name, i) => {
             htmlPasif += `<tr><td>${i+1}</td><td>${name}</td><td><span class="badge badge-danger">Belum Login</span></td></tr>`;
           });
         } else { htmlPasif = '<tr><td colspan="3" class="text-center text-success">Semua Aktif!</td></tr>'; }
         $('#table-passive-users').html(htmlPasif);
       }
    }).getMonitoringStats();
  }
</script>
