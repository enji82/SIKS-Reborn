<div class="main-wrapper" style="animation: fadeIn 0.4s ease-in-out;">
  <div style="max-width: 900px; margin: 0 auto;">
    
    <div class="page-title-container">
      <h2 class="page-title" style="border-left: 5px solid var(--page-accent); padding-left: 15px;">
        Unggah SK Pembagian Tugas
      </h2>
    </div>

    <div class="glass-panel" style="padding: 15px 20px; margin-bottom: 25px; display: flex; align-items: flex-start; gap: 15px; border-left: 4px solid var(--page-accent); background: rgba(0, 195, 255, 0.05);">
        <i class="fas fa-info-circle" style="font-size: 1.3em; color: var(--page-accent); margin-top: 2px;"></i>
        <div>
            <h4 style="margin: 0 0 5px 0; color: #fff; font-size: 14px; font-weight: 600;">Petunjuk Pengisian</h4>
            <p style="margin: 0; color: #ccc; font-size: 13px; line-height: 1.4;">
                Silakan lengkapi data SK Pembagian Tugas di bawah ini. Pastikan file yang diunggah berformat <b>PDF</b> dengan ukuran maksimal <b>1 MB</b>. Seluruh kolom wajib diisi.
            </p>
        </div>
    </div>

    <div id="skeleton-loader" class="skeleton-container">
      <div class="skeleton" style="width: 100%; height: 50px; margin-bottom: 20px; border-radius: 8px;"></div>
      <div class="skeleton" style="width: 100%; height: 120px; border-radius: 8px;"></div>
    </div>

    <div id="form-content" style="display: none;">
      <div class="glass-panel" style="padding: 30px;">
        <form id="manualUploadForm" onsubmit="handleFormSubmit(event)">
          
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 25px;">
            <div class="form-group">
              <label style="display: block; margin-bottom: 10px; font-size: 14px; color: #eee; font-weight: 500;">Nama Sekolah</label>
              <select id="namaSD" class="form-control" style="height: 45px;" required></select>
            </div>
            <div class="form-group">
              <label style="display: block; margin-bottom: 10px; font-size: 14px; color: #eee; font-weight: 500;">Tahun Ajaran</label>
              <select id="tahunAjaran" class="form-control" style="height: 45px;" required></select>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 25px;">
            <div class="form-group">
              <label style="display: block; margin-bottom: 10px; font-size: 14px; color: #eee; font-weight: 500;">Semester</label>
              <select id="semester" class="form-control" style="height: 45px;" required></select>
            </div>
            <div class="form-group">
              <label style="display: block; margin-bottom: 10px; font-size: 14px; color: #eee; font-weight: 500;">Jenis SK</label>
              <select id="kriteriaSK" class="form-control" style="height: 45px;" required></select>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 25px;">
            <div class="form-group">
              <label style="display: block; margin-bottom: 10px; font-size: 14px; color: #eee; font-weight: 500;">Nomor SK</label>
              <input type="text" id="nomorSK" class="form-control" style="height: 45px;" placeholder="Contoh: 800/001/2026" required>
            </div>
            <div class="form-group">
              <label style="display: block; margin-bottom: 10px; font-size: 14px; color: #eee; font-weight: 500;">Tanggal SK</label>
              <input type="date" id="tanggalSK" class="form-control" style="height: 45px;" required>
            </div>
          </div>

          <div style="border: 2px dashed rgba(255,255,255,0.1); padding: 35px; text-align: center; border-radius: 12px; background: rgba(0,0,0,0.15); margin-bottom: 30px;">
            <input type="file" id="fileUpload" accept="application/pdf" required style="font-size: 13px; color: #aaa; cursor: pointer;">
            <p style="font-size: 11px; color: #666; margin-top: 12px; margin-bottom: 0;">Klik untuk pilih file PDF (Maks. 1 MB)</p>
          </div>

          <div style="text-align: center; margin-top: 15px;">
            <button type="submit" id="submitBtn" class="btn-lihat-premium">
              <i class="fas fa-paper-plane" style="margin-right: 8px;"></i> Kirim Dokumen
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
