<div class="content-header pb-0">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-12">
        <h5 class="m-0 font-weight-bold">
          <i class="fas fa-file-signature text-maroon mr-2"></i>Unggah SK Pembagian Tugas
        </h5>
        <hr class="mt-2 mb-3" style="border-top: 2px solid #800000;">
      </div>
    </div>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-md-10" style="max-width: 900px;">
        
        <div class="glass-panel shadow-sm" style="padding: 15px 20px; margin-bottom: 20px; display: flex; align-items: flex-start; gap: 15px; border-left: 4px solid #800000; background: rgba(128, 0, 0, 0.05); border-radius: 8px;">
            <i class="fas fa-info-circle" style="font-size: 1.3em; color: #800000; margin-top: 2px;"></i>
            <div>
                <h4 style="margin: 0 0 5px 0; color: #333; font-size: 14px; font-weight: 600;">Petunjuk Pengisian</h4>
                <p style="margin: 0; color: #555; font-size: 13px; line-height: 1.4;">
                    Silakan lengkapi data SK Pembagian Tugas di bawah ini. Pastikan file yang diunggah adalah scan dokumen asli yang sudah ditandatangani berformat <b>PDF</b> dengan ukuran maksimal <b>1 MB</b>. Seluruh kolom wajib diisi.
                </p>
            </div>
        </div>

        <div class="card shadow">
          <div class="card-header" style="background-color: #c82333; color: white;">
            <h3 class="card-title font-weight-bold">Formulir Pengajuan Dokumen</h3>
          </div>
          
          <form id="formUnggahSk">
            <div class="card-body">
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Nama Sekolah</label>
                    <select class="form-control select2" id="namaSd" name="namaSd" required></select>
                  </div>
                  
                  <div class="row">
                    <div class="col-md-6">
                      <div class="form-group">
                        <label>Tahun Ajaran</label>
                        <select class="form-control" id="tahunAjaran" name="tahunAjaran" required></select>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-group">
                        <label>Semester</label>
                        <select class="form-control" id="semester" name="semester" required></select>
                      </div>
                    </div>
                  </div>

                  <div class="form-group">
                    <label>Kriteria SK</label>
                    <select class="form-control" id="kriteriaSk" name="kriteriaSk" required></select>
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-group">
                    <label>Nomor SK</label>
                    <input type="text" class="form-control" id="nomorSk" placeholder="800/..." required>
                  </div>

                  <div class="form-group">
                    <label>Tanggal SK</label>
                    <input type="date" class="form-control" id="tanggalSk" required>
                  </div>

                  <div class="form-group">
                    <label>Unggah Dokumen</label>
                    <div class="custom-file">
                      <input type="file" class="custom-file-input" id="fileSk" accept="application/pdf" required>
                      <label class="custom-file-label" for="fileSk">Pilih berkas PDF...</label>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="card-footer bg-white border-top-0">
              <button type="submit" class="btn px-4 font-weight-bold shadow bg-gradient-danger float-right" 
                      style="border: none; color: white; height: 38px;" id="btnKirim">
                <i class="fas fa-paper-plane mr-2"></i> KIRIM DOKUMEN
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
  $(document).ready(function () {
    // Inisialisasi
    renderDropdown("namaSd", "NamaSD");
    renderDropdown("tahunAjaran", "TahunAjaran");
    renderDropdown("semester", "Semester");
    renderDropdown("kriteriaSk", "KriteriaSK");

    if (typeof bsCustomFileInput !== 'undefined') {
      bsCustomFileInput.init();
    }

    $('#formUnggahSk').on('submit', function (e) {
      e.preventDefault();
      cekValiditasDanUpload();
    });
  });

  // --- FUNGSI UTAMA: CEK SESI & DUPLIKAT (UI SULTAN) ---
  function cekValiditasDanUpload() {
    // 1. CEK SESI
    var myUsername = localStorage.getItem('username');
    var sessionData = localStorage.getItem("siksUser");

    if (!myUsername && sessionData) {
        try {
            var userObj = JSON.parse(sessionData);
            myUsername = userObj.username || userObj.nama;
            if (myUsername) localStorage.setItem("username", myUsername);
        } catch(e) {}
    }

    if (!myUsername) {
        NotifSultan.alert('error', 'SESI HABIS', 'Silakan Logout lalu Login kembali.');
        return;
    }

    // 2. AMBIL NO SK
    const noSk = $('#nomorSk').val();
    if (!noSk) {
        NotifSultan.alert('warning', 'DATA TIDAK LENGKAP', 'Nomor SK wajib diisi!');
        return;
    }

    // 3. UI LOADING SULTAN
    const btn = $('#btnKirim');
    const btnTextAsli = btn.html();
    btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> Mengecek...');
    
    // 4. CEK DUPLIKAT KE SERVER
    google.script.run
      .withSuccessHandler(function(hasil) {
          
          if (hasil.exists) {
              // >>> KASUS 1: DUPLIKAT (UI SULTAN) <<<
              btn.prop('disabled', false).html(btnTextAsli);
              
              Swal.fire({
                  // Judul dengan Warna Maroon
                  title: '<span style="color: #800000; font-weight: bold;">DATA GANDA DITEMUKAN</span>', 
                  
                  // HTML Body yang Rapi
                  html: `
                    <div style="text-align: left; font-size: 14px; color: #555;">
                        <p>Mohon maaf, Nomor SK: <b>${noSk}</b> tidak dapat diproses karena sudah terdaftar di sistem.</p>
                        <div style="background: #f8d7da; border-left: 5px solid #800000; padding: 10px; border-radius: 4px;">
                            <small style="color: #800000; font-weight: bold;">PEMILIK DATA:</small><br>
                            <span style="font-size: 15px; font-weight: 600; color: #333;">${hasil.sekolah}</span>
                        </div>
                        <p style="margin-top: 10px;">Silakan cek di menu Data SK untuk memastikan.</p>
                    </div>
                  `,
                  
                  // Ikon Kustom (Maroon)
                  iconHtml: '<i class="fas fa-exclamation-triangle" style="color: #800000; font-size: 0.8em;"></i>',
                  customClass: {
                      icon: 'border-0' // Hilangkan border lingkaran default alert
                  },
                  
                  // Tombol SULTAN
                  showCancelButton: true,
                  confirmButtonText: '<i class="fas fa-search mr-1"></i> LIHAT DATA',
                  cancelButtonText: '<i class="fas fa-times mr-1"></i> BATAL',
                  confirmButtonColor: '#800000', // MAROON SULTAN
                  cancelButtonColor: '#6c757d',  // Abu-abu
                  reverseButtons: true, // Tombol batal di kiri
                  focusConfirm: false
              }).then((result) => {
                  if (result.isConfirmed) {
                      loadPage('page_sk_data');
                  }
              });

          } else {
              // >>> KASUS 2: DATA BARU (AMAN) <<<
              btn.prop('disabled', false).html(btnTextAsli);
              eksekusiUploadAsli(myUsername); 
          }
      })
      .withFailureHandler(function(err) {
          btn.prop('disabled', false).html(btnTextAsli);
          NotifSultan.alert('error', 'KONEKSI', 'Gagal mengecek data. Coba lagi.');
      })
      .cekDuplikatSK(noSk);
  }

  // --- FUNGSI UPLOAD REAL ---
  function eksekusiUploadAsli(validUsername) {
      const fileInput = $('#fileSk')[0].files[0];
      
      // Validasi File Dasar
      if (!fileInput) return NotifSultan.alert('warning', 'FILE KOSONG', 'Pilih berkas PDF.');
      if (fileInput.size > 1024 * 1024) return NotifSultan.alert('error', 'GAGAL', 'File max 1 MB.');

      NotifSultan.loading("Mengirim Data...");

      const reader = new FileReader();
      reader.onload = function (e) {
        const payload = {
          namaSd: $('#namaSd').val(),
          tahunAjaran: $('#tahunAjaran').val(),
          semester: $('#semester').val(),
          kriteriaSk: $('#kriteriaSk').val(),
          nomorSk: $('#nomorSk').val(),
          tanggalSk: $('#tanggalSk').val(),
          fileData: e.target.result.split(',')[1],
          username: validUsername // Pakai username yang sudah divalidasi
        };

        google.script.run
          .withSuccessHandler(function (res) {
            Swal.close();
            if (res.success) {
              NotifSultan.alert('success', 'TERKIRIM', res.message).then(() => {
                loadPage('page_sk_dashboard');
              });
            } else {
              NotifSultan.alert('error', 'GAGAL', res.message);
            }
          })
          .withFailureHandler(function(err){
             Swal.close();
             NotifSultan.alert('error', 'SERVER ERROR', err.message);
          })
          .prosesUnggahSK(payload);
      };
      reader.readAsDataURL(fileInput);
  }
</script>
