<div class="content-header pb-0">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-12">
        <h5 class="m-0 font-weight-bold">
          <i class="fas fa-calendar-alt text-maroon mr-2"></i>Rekap Presensi Harian
        </h5>
        <hr class="mt-2 mb-3" style="border-top: 2px solid #800000;">
      </div>
    </div>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12">
        
        <div class="control-bar mb-3 d-flex flex-wrap justify-content-between align-items-center bg-white p-3 shadow-sm rounded">
          
          <div class="d-flex align-items-center flex-wrap" style="gap: 8px;">
            
            <button type="button" class="btn border-tegas btn-square-sultan shadow-sm" onclick="loadFilterOptions(true)" title="Refresh Data">
              <i class="fas fa-sync-alt text-maroon"></i>
            </button>

            <div style="height: 25px; width: 1px; background: #dee2e6; margin: 0 5px;"></div>

            <select id="filterTahun" class="form-control filter-select border-tegas shadow-sm" style="width: 120px;">
              <option value="">- Tahun -</option>
            </select>
            <select id="filterBulan" class="form-control filter-select border-tegas shadow-sm" style="width: 140px;">
              <option value="">- Bulan -</option>
            </select>
            <select id="filterUnit" class="form-control filter-select border-tegas shadow-sm" style="min-width: 200px;">
              <option value="">- Unit Kerja -</option>
            </select>

            <button type="button" class="btn btn-danger font-weight-bold shadow-sm" onclick="cariDataPresensi()">
               <i class="fas fa-search mr-1"></i> TAMPILKAN
            </button>
          </div>

          <div class="mt-2 mt-xl-0 position-relative" style="flex-grow: 1; max-width: 250px;">
            <input type="text" id="customSearch" class="form-control border-tegas shadow-sm" placeholder="Cari Nama..." style="padding-right: 35px;">
            <i class="fas fa-search position-absolute text-muted" style="right: 12px; top: 11px;"></i>
          </div>
        </div>

        <div class="card shadow-sm border-0" id="cardTabel" style="display: none;">
          <div class="card-body p-0">
            
            <div class="table-responsive">
              <table id="tabelPresensi" class="table table-hover table-premium table-sticky-first mb-0" style="width:100%">
                <thead class="bg-light">
                  <tr id="headerRow">
                    </tr>
                </thead>
                <tbody id="bodyRow">
                   </tbody>
              </table>
            </div>

            <div class="card-footer bg-light border-top p-3">
                <div class="d-flex align-items-center flex-wrap" style="gap: 10px; font-size: 13px;">
                    <span class="font-weight-bold text-maroon mr-2">KETERANGAN:</span>
                    
                    <span class="badge badge-danger">TP</span> Tidak Presensi
                    <span class="badge badge-light border">HK</span> Hari Kerja
                    <span class="badge badge-success">H</span> Hadir
                    <span class="badge badge-light border">HA</span> Hari Apel
                    <span class="badge badge-success">APL</span> Apel
                    <span class="badge badge-light border">TAp</span> Tidak Apel
                    <span class="badge badge-light border">HU</span> Hari Upacara
                    <span class="badge badge-success">U</span> Upacara
                    <span class="badge badge-light border">TU</span> Tidak Upacara
                    
                    <div class="vr mx-2"></div> <span class="badge badge-warning">CT/CS/CM</span> Cuti
                    <span class="badge badge-info">DD/DL</span> Dinas
                    <span class="badge badge-danger">TA</span> Terlambat
                    <span class="badge badge-danger">PLA</span> Pulang Awal
                    <span class="badge badge-danger">LA</span> Lupa Absen
                </div>
            </div>

          </div>
        </div>
        </div>
    </div>
  </div>
</section>

<style>
  /* Border Tegas untuk Input/Select */
  .border-tegas { border: 1px solid #ced4da !important; }
  .btn-square-sultan { width: 38px; height: 38px; padding: 0; display: flex; align-items: center; justify-content: center; }
  
  /* Table Premium Style */
  .table-premium thead th {
      background-color: #f8f9fa;
      border-bottom: 2px solid #dee2e6;
      color: #495057;
      font-weight: 600;
      font-size: 13px;
      vertical-align: middle;
      text-transform: uppercase;
      white-space: nowrap;
  }
  .table-premium tbody td {
      vertical-align: middle;
      font-size: 13px;
      padding: 8px 10px;
      border-right: 1px solid #f4f6f9;
  }
  
  /* Sticky First Column Logic */
  .table-sticky-first thead th:first-child,
  .table-sticky-first tbody td:first-child {
      position: sticky;
      left: 0;
      background-color: #fff; /* Warna background kolom beku */
      z-index: 5;
      box-shadow: 2px 0 5px rgba(0,0,0,0.05); /* Bayangan pemisah */
  }
  .table-sticky-first thead th:first-child {
      z-index: 6; /* Header harus lebih atas */
      background-color: #f8f9fa;
  }
</style>

<script>
  $(document).ready(function() {
    // 1. Init Select2 Standard
    $('.select2').select2({ theme: 'bootstrap4' });

    // 2. Load Filter Awal
    loadFilterOptions();

    // 3. Search Manual Listener
    $('#customSearch').on('keyup', function() { 
        if ($.fn.DataTable.isDataTable('#tabelPresensi')) {
            $('#tabelPresensi').DataTable().search(this.value).draw(); 
        }
    });
  });

  // --- A. LOAD FILTER ---
  function loadFilterOptions(isRefresh = false) {
    if(isRefresh) NotifSultan.loading("Menyegarkan Filter...");
    
    google.script.run
      .withSuccessHandler(function(data) {
        if(isRefresh) Swal.close();
        
        if (data.error) {
          NotifSultan.alert('error', 'Gagal', data.error);
          return;
        }

        renderOption('#filterTahun', data.years, 'Tahun');
        renderOption('#filterBulan', data.months, 'Bulan');
        renderOption('#filterUnit', data.units, 'Unit Kerja');

        // Auto Select Hari Ini
        let curYear = new Date().getFullYear();
        let namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        let curMonth = namaBulan[new Date().getMonth()];

        setSelectValue('#filterTahun', curYear);
        setSelectValue('#filterBulan', curMonth);
      })
      .withFailureHandler(function(err) {
        if(isRefresh) Swal.close();
      })
      .getSiabaFilters();
  }

  function renderOption(el, arr, label) {
    let html = `<option value="">- ${label} -</option>`;
    arr.forEach(x => html += `<option value="${x}">${x}</option>`);
    $(el).html(html);
  }

  function setSelectValue(el, val) {
    $(el + ' option').each(function() {
      if ($(this).text().trim().toLowerCase() === String(val).toLowerCase()) $(this).prop('selected', true);
    });
    $(el).trigger('change');
  }

  // --- B. CARI DATA ---
  function cariDataPresensi() {
    const thn = $('#filterTahun').val();
    const bln = $('#filterBulan').val();
    const unit = $('#filterUnit').val();

    if (!thn || !bln || !unit) {
        return NotifSultan.alert('warning', 'Filter Belum Lengkap', 'Silakan pilih Tahun, Bulan, dan Unit Kerja.');
    }

    NotifSultan.loading("Mengambil Data Presensi...");
    $('#cardTabel').hide();

    google.script.run
      .withSuccessHandler(function(data) {
        Swal.close();
        if (data.error) return NotifSultan.alert('error', 'Error Backend', data.error);
        
        if (!data.rows || data.rows.length === 0) {
            return NotifSultan.alert('info', 'Data Tidak Ditemukan', 'Cobalah filter lain.');
        }

        renderTabel(data);
      })
      .withFailureHandler(function(err) {
        Swal.close();
        NotifSultan.alert('error', 'Koneksi Gagal', err.message);
      })
      .getSiabaPresensiHarian(thn, bln, unit);
  }

  // --- C. RENDER TABEL ---
  function renderTabel(data) {
    // 1. Header
    // Kita buat No sebagai kolom beku pertama
    let th = '<th class="text-center" style="min-width:40px">No</th>';
    data.headers.forEach(h => th += `<th class="text-center" style="min-width:60px">${h}</th>`);
    $('#headerRow').html(th);

    // 2. Body
    let tr = '';
    data.rows.forEach((row, i) => {
      tr += '<tr>';
      tr += `<td class="text-center font-weight-bold">${i+1}</td>`;
      
      row.forEach(cell => {
        let val = cell || "-";
        let str = String(val).toUpperCase().trim();
        let display = val;

        // Pewarnaan Teks Cerdas (Tanpa background blok, main font color saja agar bersih)
        if (['TP','TA','LA','PLA'].includes(str)) display = `<span class="text-danger font-weight-bold">${val}</span>`;
        else if (['H','APL','U'].includes(str)) display = `<span class="text-success font-weight-bold">${val}</span>`;
        else if (['DD','DL'].includes(str)) display = `<span class="text-info font-weight-bold">${val}</span>`;
        else if (['CT','CAP','CS','CM'].includes(str)) display = `<span class="text-warning font-weight-bold">${val}</span>`;
        else if (['HK','HA','HU','TU','TAP'].includes(str)) display = `<span class="text-muted small">${val}</span>`;

        tr += `<td class="text-center">${display}</td>`;
      });
      tr += '</tr>';
    });
    $('#bodyRow').html(tr);

    // 3. DataTable Config (Sultan Style)
    if ($.fn.DataTable.isDataTable('#tabelPresensi')) {
      $('#tabelPresensi').DataTable().destroy();
    }

    $('#tabelPresensi').DataTable({
      responsive: false, // False karena mau scroll horizontal
      scrollX: true,
      autoWidth: false,
      ordering: false,   // Matikan sorting kolom (header dinamis)
      pageLength: 25,
      lengthChange: false, // Hilangkan dropdown "Show entries", pakai pagination default
      dom: 't<"d-flex justify-content-between align-items-center mt-3 px-3 pb-3"ip>', // Layout bersih: Table (t), Info (i), Pagination (p)
      language: { 
          url: "//cdn.datatables.net/plug-ins/1.10.24/i18n/Indonesian.json",
          zeroRecords: "Data tidak ditemukan"
      },
      drawCallback: function() {
        // Trik agar header scroll sync
        $(window).trigger('resize');
      }
    });

    $('#cardTabel').fadeIn();
  }
</script>
