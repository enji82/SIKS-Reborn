<div class="content-header pb-0">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-12">
        <h5 class="m-0 font-weight-bold">
          <i class="fas fa-chart-bar text-maroon mr-2"></i>Status Pengiriman Laporan Bulan
        </h5>
        <hr class="style-sultan-solid">
      </div>
    </div>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12">

        <div class="card-sultan mb-3">
          <div class="card-body py-2 px-3 border-left-dark">
            <div class="d-flex align-items-center justify-content-between cursor-pointer" 
                 data-toggle="collapse" data-target="#infoCollapse" aria-expanded="false">
              <div class="d-flex align-items-center text-maroon font-weight-bold">
                <i class="fas fa-info-circle mr-2"></i> Informasi
              </div>
              <i class="fas fa-chevron-down text-muted icon-sm"></i>
            </div>
            <div id="infoCollapse" class="collapse">
              <div class="mt-2 pt-2 border-top small text-muted">
                <ul class="mb-0 pl-3 text-dark mt-2" style="font-size: 14px; line-height: 1.6;">
                    <li>Halaman ini menampilkan rekapitulasi status laporan bulan jenjang PAUD dan SD.</li>
                    <li>Gunakan filter Tahun dan Jenjang untuk menampilkan data.</li>
                </ul>
              </div>
            </div>
          </div>
        </div>

        <div class="card-sultan p-3 mb-3">
            <div class="d-flex-gap align-items-center">
                <button type="button" class="btn border-tegas shadow-sm bg-white" onclick="loadServerData()" title="Muat Ulang Data Server">
                   <i class="fas fa-sync-alt text-maroon"></i>
                </button>

                <select id="filterTahun" class="form-control form-control-sultan input-auto-width" style="min-width: 100px;"></select>
                
                <select id="filterJenjang" class="form-control form-control-sultan input-auto-width" style="min-width: 200px;">
                    <option value="SEMUA">- Semua Jenjang -</option>
                    <option value="SD">SD</option>
                    <option value="TK">TK</option>
                    <option value="KB">KB</option>
                    <option value="SPS">SPS</option>
                    <option value="TPA">TPA</option>
                </select>

                <div class="divider-vertical"></div>

                <button type="button" id="btnCari" class="btn btn-maroon shadow-sm" onclick="filterLocalData()" title="Terapkan Filter">
                    <i class="fas fa-search text-white"></i>
                </button>
            </div>
        </div>

        <div class="card-sultan">
            <div class="card-body p-3">
              <table id="tabelStatus" class="table table-bordered table-hover table-premium table-sultan-compact mb-0 w-100">
                <thead id="headTabelStatus" class="text-center" style="display:none;"></thead>
                <tbody id="bodyTabelStatus">
                    <tr>
                        <td class="text-center p-5" colspan="100%">
                            <div class="sultan-loading-container">
                                <i class="fas fa-spinner fa-spin fa-3x text-maroon mb-3"></i>
                                <h6 class="text-muted font-weight-bold">Mengambil Data Status...</h6>
                            </div>
                        </td>
                    </tr>
                </tbody>
              </table>
            </div>
        </div>

      </div>
    </div>
  </div>
</section>

<script>
    var CACHE_ALL_DATA = [];
    var GLOBAL_HEADERS = [];

    $(document).ready(function() {
        var thn = new Date().getFullYear();
        var $sel = $('#filterTahun').empty();
        for(var i = thn - 2; i <= thn + 1; i++){ 
            $sel.append('<option value="'+i+'">'+i+'</option>'); 
        }
        $sel.val(thn);
        loadServerData();
    });

    function loadServerData() {
        if ($.fn.DataTable.isDataTable('#tabelStatus')) { $('#tabelStatus').DataTable().destroy(); }
        $('#headTabelStatus').hide();
        $('#bodyTabelStatus').html('<tr><td class="text-center p-5" colspan="100%"><div class="sultan-loading-container"><i class="fas fa-spinner fa-spin fa-3x text-maroon mb-3"></i><h6 class="text-muted font-weight-bold">Mengambil Data dari Server...</h6></div></td></tr>');
        $('#btnCari').prop('disabled', true);

        google.script.run
            .withSuccessHandler(function(res) {
                $('#btnCari').prop('disabled', false);
                GLOBAL_HEADERS = res.headers || [];
                CACHE_ALL_DATA = res.rows || [];
                filterLocalData(); 
            })
            .withFailureHandler(function(err) {
                $('#btnCari').prop('disabled', false);
                $('#bodyTabelStatus').html(`<tr><td class="text-center text-danger p-5">Error: ${err.message}</td></tr>`);
            })
            .getRekapLapbulStatus(); 
    }

    function filterLocalData() {
        var reqTahun = $('#filterTahun').val();
        var reqJenjang = $('#filterJenjang').val(); 

        var filteredRows = CACHE_ALL_DATA.filter(function(row) {
            var rowJenjang = String(row[2]).toUpperCase().trim();
            var rowTahun = String(row[3]).trim();

            if (reqTahun && rowTahun !== reqTahun) return false;
            if (reqJenjang && reqJenjang !== "SEMUA") {
                if (rowJenjang !== reqJenjang) return false;
            }
            return true;
        });

        renderTabel(filteredRows);
    }

    function renderTabel(rows) {
        if ($.fn.DataTable.isDataTable('#tabelStatus')) {
            $('#tabelStatus').DataTable().clear().destroy();
        }
        $('#bodyTabelStatus').empty();

        if (!rows || rows.length === 0) {
            $('#headTabelStatus').show();
            $('#headTabelStatus').html('<tr><th>Nama Sekolah</th><th>NPSN</th><th>Jenjang</th><th>Status</th></tr>');
            initDataTableStandard('#tabelStatus', true);
            return;
        }

        // Header
        var htmlHead = '<tr>';
        GLOBAL_HEADERS.forEach(function(h, idx) {
            var stickyClass = (idx === 0) ? 'col-sticky-left' : '';
            var styleAttr = (idx === 0) ? 'style="min-width: 250px;"' : ''; 
            htmlHead += `<th class="text-center align-middle text-nowrap ${stickyClass}" ${styleAttr}>${h}</th>`;
        });
        htmlHead += '</tr>';
        $('#headTabelStatus').html(htmlHead);

        // Body
        var htmlBody = '';
        rows.forEach(function(row) {
            htmlBody += '<tr class="tr-animasi">';
            
            // Kolom Nama (Sticky)
            htmlBody += `<td class="col-sticky-left font-weight-bold align-middle text-nowrap bg-white text-dark border-right">${row[0]}</td>`;
            
            // Kolom NPSN
            htmlBody += `<td class="text-center align-middle">${row[1]}</td>`;
            
            // Kolom Jenjang
            var j = row[2];
            var badgeClass = 'badge-sultan-light-secondary';
            if (j === 'SD') badgeClass = 'badge-sultan-light-info';
            else if (j === 'TK') badgeClass = 'badge-sultan-light-warning';
            else if (j === 'KB') badgeClass = 'badge-sultan-light-success';
            else if (j === 'SPS') badgeClass = 'badge-sultan-light-primary';
            else if (j === 'TPA') badgeClass = 'badge-sultan-light-danger';
            
            htmlBody += `<td class="text-center align-middle"><span class="badge badge-sultan ${badgeClass}">${j}</span></td>`;

            // Kolom Bulan (Index 4 dst)
            for (var i = 4; i < row.length; i++) {
                htmlBody += `<td class="text-center align-middle">${getBadgeSultan(row[i])}</td>`;
            }
            htmlBody += '</tr>';
        });
        
        $('#bodyTabelStatus').html(htmlBody);
        $('#headTabelStatus').show();
        
        setTimeout(function() { initDataTableStandard('#tabelStatus'); }, 10);
    }

    function initDataTableStandard(id, empty){ 
        if ($.fn.DataTable.isDataTable(id)) $(id).DataTable().clear().destroy(); 
        $(id).DataTable({ 
            ordering:false, 
            pageLength:10, 
            autoWidth:false, 
            language:{url:"//cdn.datatables.net/plug-ins/1.10.25/i18n/Indonesian.json", emptyTable: empty?"Data tidak ditemukan":"Data kosong"}, 
            initComplete: function(){ 
                if(!$(id).parent().hasClass('table-scroll-wrapper')) $(id).wrap('<div class="table-scroll-wrapper" style="overflow-x: auto; width:100%"></div>'); 
                setTimeout(()=>$(id).DataTable().columns.adjust(), 300); 
            },
            dom: "<'row mb-2'<'col-sm-12 col-md-6'l><'col-sm-12 col-md-6'f>>" +
                 "<'row'<'col-sm-12'tr>>" +
                 "<'row mt-2'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>"
        }); 
    }

    // --- FUNGSI ICON (MENGGUNAKAN CLASS SULTAN) ---
    function getBadgeSultan(status) {
        if (!status || status === "-" || status === "") {
            return '<i class="fas fa-minus text-black-50 small" style="opacity:0.2"></i>';
        }
        
        var s = String(status).trim();
        var stLower = s.toLowerCase();

        // Menggunakan class 'btn-icon-sultan' yang sudah didefinisikan di template
        // Ini menjamin bentuk bulat (border-radius: 50%) dan shadow yang konsisten.
        var baseClass = "btn-icon-sultan"; 
        var iconHtml = "";

        // 1. REVISI -> btn-icon-sultan-warning
        if (stLower.includes('revisi') || stLower.includes('perbaiki')) {
             iconHtml = `<div class="${baseClass} btn-icon-sultan-warning" data-toggle="tooltip" title="${s}" style="cursor:help;">
                            <i class="fas fa-sync-alt"></i>
                         </div>`;
        }
        // 2. DITOLAK -> btn-icon-sultan-danger
        else if (stLower.includes('tolak') || stLower.includes('x') || stLower.includes('salah')) {
             iconHtml = `<div class="${baseClass} btn-icon-sultan-danger" data-toggle="tooltip" title="${s}" style="cursor:help;">
                            <i class="fas fa-times"></i>
                         </div>`;
        }
        // 3. DISETUJUI -> btn-icon-sultan-success
        else if (stLower.includes('verif') || stLower.includes('setuju') || stLower.includes('ok') || stLower.includes('valid')) {
             iconHtml = `<div class="${baseClass} btn-icon-sultan-success" data-toggle="tooltip" title="${s}" style="cursor:help;">
                            <i class="fas fa-check"></i>
                         </div>`;
        }
        // 4. DIPROSES -> btn-icon-sultan-info
        else if (s.length > 5) {
             iconHtml = `<div class="${baseClass} btn-icon-sultan-info" data-toggle="tooltip" title="${s}" style="cursor:help;">
                            <i class="fas fa-spinner fa-spin"></i>
                         </div>`;
        }
        else {
             return `<span class="text-muted small font-weight-bold">${s}</span>`;
        }

        return iconHtml;
    }
</script>
