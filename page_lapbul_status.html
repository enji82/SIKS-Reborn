<div class="content-header pb-0">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-12">
        <h5 class="m-0 font-weight-bold">
          <i class="fas fa-chart-bar text-maroon mr-2"></i>Status Pengiriman Laporan Bulan
        </h5>
        <hr class="style-sultan-solid">
      </div>
    </div>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12">

        <div class="card-sultan mb-3">
          <div class="card-body py-2 px-3 border-left-dark">
            <div class="d-flex align-items-center justify-content-between cursor-pointer" 
                 data-toggle="collapse" data-target="#infoCollapse" aria-expanded="false">
              <div class="d-flex align-items-center text-maroon font-weight-bold">
                <i class="fas fa-info-circle mr-2"></i> Informasi
              </div>
              <i class="fas fa-chevron-down text-muted icon-sm"></i>
            </div>
            <div id="infoCollapse" class="collapse">
              <div class="mt-2 pt-2 border-top small text-muted">
                <ul class="mb-0 pl-3 text-dark mt-2" style="font-size: 14px; line-height: 1.6;">
                    <li>Halaman ini menampilkan rekapitulasi status laporan bulan jenjang PAUD dan SD.</li>
                    <li>Gunakan filter Tahun dan Jenjang untuk menampilkan data.</li>
                </ul>
              </div>
            </div>
          </div>
        </div>

        <div class="card-sultan p-3 mb-3">
            <div class="d-flex-gap align-items-center">
                <button type="button" class="btn border-tegas shadow-sm bg-white" onclick="loadServerData()" title="Muat Ulang Data Server">
                   <i class="fas fa-sync-alt text-maroon"></i>
                </button>

                <select id="filterTahun" class="form-control form-control-sultan input-auto-width" style="min-width: 100px;"></select>
                
                <select id="filterJenjang" class="form-control form-control-sultan input-auto-width" style="min-width: 200px;">
                    <option value="SEMUA">- Semua Jenjang -</option>
                    <option value="SD">SD</option>
                    <option value="TK">TK</option>
                    <option value="KB">KB</option>
                    <option value="SPS">SPS</option>
                    <option value="TPA">TPA</option>
                </select>

                <div class="divider-vertical"></div>

                <button type="button" id="btnCari" class="btn btn-maroon shadow-sm" onclick="filterLocalData()" title="Terapkan Filter">
                    <i class="fas fa-search text-white"></i>
                </button>
            </div>
        </div>

        <div class="card-sultan">
            <div class="card-body p-3">
                
              <div id="spinnerContainer" class="text-center py-5">
                  <i class="fas fa-spinner fa-spin fa-3x text-maroon mb-3"></i>
                  <h6 class="text-muted font-weight-bold" id="teksLoading">Mempersiapkan Data...</h6>
              </div>

              <div id="tableWrapper" style="display: none;">
                  <table id="tabelStatus" class="table table-bordered table-hover table-premium table-sultan-compact mb-0 w-100">
                  </table>
              </div>

            </div>
        </div>

      </div>
    </div>
  </div>
</section>

<script>
    var CACHE_ALL_DATA = [];
    var GLOBAL_HEADERS = [];

    $(document).ready(function() {
        var thn = new Date().getFullYear();
        var $sel = $('#filterTahun').empty();
        for(var i = thn - 5; i <= thn + 1; i++){ 
            $sel.append('<option value="'+i+'">'+i+'</option>'); 
        }
        $sel.val(thn);
        
        loadServerData();
        
        if(typeof setSidebarActive === 'function') {
          setSidebarActive("Status Laporan"); 
        }
    });

    // =======================================================
    // 1. AMBIL DATA SERVER
    // =======================================================
    function loadServerData() {
        $('#tableWrapper').hide();
        $('#teksLoading').text('Menghubungkan ke Server...');
        $('#spinnerContainer').show();
        $('#btnCari').prop('disabled', true);

        google.script.run
            .withSuccessHandler(function(res) {
                $('#btnCari').prop('disabled', false);
                GLOBAL_HEADERS = res.headers || [];
                CACHE_ALL_DATA = res.rows || [];
                filterLocalData(); 
            })
            .withFailureHandler(function(err) {
                $('#btnCari').prop('disabled', false);
                $('#spinnerContainer').html(`<div class="text-danger text-center"><i class="fas fa-exclamation-triangle fa-2x mb-2"></i><br>Gagal: ${err.message}</div>`);
            })
            .getRekapLapbulStatus(); 
    }

    // =======================================================
    // 2. FILTER DATA LOKAL
    // =======================================================
    function filterLocalData() {
        $('#tableWrapper').hide();
        $('#teksLoading').text('Menyusun Tabel...');
        $('#spinnerContainer').show();

        var reqTahun = $('#filterTahun').val();
        var reqJenjang = $('#filterJenjang').val(); 

        var filteredRows = CACHE_ALL_DATA.filter(function(row) {
            var rowJenjang = String(row[2]).toUpperCase().trim();
            var rowTahun = String(row[3]).trim();
            if (reqTahun && rowTahun !== reqTahun) return false;
            if (reqJenjang && reqJenjang !== "SEMUA" && rowJenjang !== reqJenjang) return false;
            return true;
        });

        // Eksekusi Render
        renderTabelNative(filteredRows);
    }

    // =======================================================
    // 3. RENDER TABEL (NATIVE API DATATABLES - ANTI CRASH)
    // =======================================================
    function renderTabelNative(rows) {
        
        // --- A. SIAPKAN STRUKTUR KOLOM (HEADERS) ---
        var dtCols = [];
        if (GLOBAL_HEADERS.length > 0) {
            GLOBAL_HEADERS.forEach(function(h, idx) {
                if (idx === 0) {
                    // Kolom Nama Sekolah (Index 0) dibuat lengket (Sticky)
                    dtCols.push({ 
                        title: h, 
                        className: "col-sticky-left bg-white border-right text-dark font-weight-bold align-middle text-nowrap"
                    });
                } else {
                    // Kolom NPSN, Jenjang, & Bulan-Bulan
                    dtCols.push({ 
                        title: h, 
                        className: "text-center align-middle text-nowrap" 
                    });
                }
            });
        } else {
            dtCols = [{ title: "Nama Sekolah" }, { title: "Status" }]; // Fallback
        }

        // --- B. SIAPKAN ISI DATA (BODY) ---
        var dtData = [];
        if (rows && rows.length > 0) {
            dtData = rows.map(function(row) {
                var newRow = [];
                
                // 1. Nama Sekolah
                newRow.push(row[0]);
                
                // 2. NPSN
                newRow.push(row[1]);
                
                // 3. Jenjang (Beri Badge)
                var j = row[2];
                var badgeClass = 'badge-sultan-light-secondary';
                if (j === 'SD') badgeClass = 'badge-sultan-light-info';
                else if (j === 'TK') badgeClass = 'badge-sultan-light-warning';
                else if (j === 'KB') badgeClass = 'badge-sultan-light-success';
                else if (j === 'SPS') badgeClass = 'badge-sultan-light-primary';
                else if (j === 'TPA') badgeClass = 'badge-sultan-light-danger';
                
                newRow.push(`<span class="badge badge-sultan ${badgeClass}">${j}</span>`);
                
                // 4. Status per Bulan (Mulai dari row[4] karena row[3] adalah Tahun)
                for (var i = 4; i < row.length; i++) {
                    newRow.push(getBadgeSultan(row[i]));
                }
                
                return newRow;
            });
        }

        // --- C. HANCURKAN DAN BERSIHKAN TABEL LAMA ---
        if ($.fn.DataTable.isDataTable('#tabelStatus')) {
            $('#tabelStatus').DataTable().destroy();
        }
        $('#tabelStatus').empty(); 

        // --- D. BANGUN ULANG MENGGUNAKAN MESIN DATATABLES ---
        $('#tabelStatus').DataTable({
            data: dtData,       // Tembak data array
            columns: dtCols,    // Tembak struktur kolom
            ordering: false, 
            pageLength: 10, 
            autoWidth: false, 
            destroy: true,
            language: {
                url: "//cdn.datatables.net/plug-ins/1.10.25/i18n/Indonesian.json", 
                emptyTable: "Tidak ada data yang sesuai filter."
            }, 
            dom: "<'row mb-2'<'col-sm-12 col-md-6'l><'col-sm-12 col-md-6'f>>" +
                 "<'row'<'col-sm-12 table-responsive'tr>>" + 
                 "<'row mt-2'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>",
            
            initComplete: function() {
                // Aktifkan Tooltip Bootstrap
                $('[data-toggle="tooltip"]').tooltip();
                
                // Sembunyikan Spinner, Tampilkan Tabel dengan Fade In
                $('#spinnerContainer').hide();
                $('#tableWrapper').fadeIn(300);
            }
        }); 
    }

    // =======================================================
    // 4. HELPER ICON STATUS
    // =======================================================
    function getBadgeSultan(status) {
        if (!status || status === "-" || status === "") {
            return '<i class="fas fa-minus text-black-50 small" style="opacity:0.2"></i>';
        }
        
        var s = String(status).trim();
        var stLower = s.toLowerCase();
        var baseClass = "btn-icon-sultan"; 
        var iconHtml = "";

        if (stLower.includes('revisi') || stLower.includes('perbaiki')) {
             iconHtml = `<div class="${baseClass} btn-icon-sultan-warning" data-toggle="tooltip" title="${s}" style="cursor:help;"><i class="fas fa-sync-alt"></i></div>`;
        }
        else if (stLower.includes('tolak') || stLower.includes('x') || stLower.includes('salah')) {
             iconHtml = `<div class="${baseClass} btn-icon-sultan-danger" data-toggle="tooltip" title="${s}" style="cursor:help;"><i class="fas fa-times"></i></div>`;
        }
        else if (stLower.includes('verif') || stLower.includes('setuju') || stLower.includes('ok') || stLower.includes('valid')) {
             iconHtml = `<div class="${baseClass} btn-icon-sultan-success" data-toggle="tooltip" title="${s}" style="cursor:help;"><i class="fas fa-check"></i></div>`;
        }
        else if (s.length > 5) {
             iconHtml = `<div class="${baseClass} btn-icon-sultan-info" data-toggle="tooltip" title="${s}" style="cursor:help;"><i class="fas fa-spinner fa-spin"></i></div>`;
        }
        else {
             return `<span class="text-muted small font-weight-bold">${s}</span>`;
        }

        return iconHtml;
    }
</script>
