<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>

<div class="content-header pb-0">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-12">
        <h5 class="m-0 font-weight-bold">
          <i class="fas fa-tachometer-alt text-maroon mr-2"></i>Dashboard Monitoring SK
        </h5>
        <hr class="style-sultan-solid">
      </div>
    </div>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    
    <div class="card-sultan p-3 mb-4 shadow-sm" style="border-left: 5px solid #800000;">
        <div class="d-flex align-items-center flex-wrap">
            <label class="mb-0 mr-3 font-weight-bold text-dark"><i class="fas fa-filter text-maroon mr-1"></i> FILTER PERIODE:</label>
            
            <select id="dashTahun" class="form-control form-control-sultan input-auto-width mr-2" onchange="loadDashboard()"></select>
            
            <select id="dashSemester" class="form-control form-control-sultan input-auto-width" onchange="loadDashboard()">
                <option value="">- Semua Semester -</option>
                <option value="Semester 1">Semester 1</option>
                <option value="Semester 2">Semester 2</option>
            </select>
            
            <div class="ml-auto">
                <button class="btn btn-sm btn-maroon font-weight-bold px-3 shadow-sm" onclick="loadDashboard()">
                    <i class="fas fa-sync-alt mr-1"></i> Refresh Data
                </button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-3 col-6">
            <div class="small-box bg-white shadow-sm border-bottom-maroon">
                <div class="inner">
                    <h3 class="text-dark count-up" id="valTotal">0</h3>
                    <p class="text-muted font-weight-bold">TOTAL MASUK</p>
                </div>
                <div class="icon">
                    <i class="fas fa-folder-open text-maroon opacity-20"></i>
                </div>
            </div>
        </div>
        
        <div class="col-lg-3 col-6">
            <div class="small-box bg-success shadow-sm">
                <div class="inner">
                    <h3 class="count-up" id="valDisetujui">0</h3>
                    <p class="font-weight-bold">DATA VALID (OK)</p>
                </div>
                <div class="icon"><i class="fas fa-check-circle opacity-30"></i></div>
            </div>
        </div>

        <div class="col-lg-3 col-6">
            <div class="small-box bg-purple shadow-sm">
                <div class="inner">
                    <h3><span class="count-up" id="valProgress">0</span><sup style="font-size: 20px">%</sup></h3>
                    <p class="font-weight-bold">REALISASI</p>
                </div>
                <div class="icon"><i class="fas fa-chart-line opacity-30"></i></div>
            </div>
        </div>

        <div class="col-lg-3 col-6">
            <div class="small-box bg-maroon shadow-sm cursor-pointer hover-zoom" onclick="showModalBelum()">
                <div class="inner">
                    <h3 class="count-up" id="valBelum">0</h3>
                    <p class="font-weight-bold text-warning">BELUM KIRIM <i class="fas fa-exclamation-circle ml-1"></i></p>
                </div>
                <div class="icon"><i class="fas fa-bullhorn opacity-30"></i></div>
            </div>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-4">
            <div class="info-box shadow-sm">
                <span class="info-box-icon bg-warning"><i class="fas fa-spinner"></i></span>
                <div class="info-box-content">
                    <span class="info-box-text">Sedang Diproses</span>
                    <span class="info-box-number count-up" id="valDiproses" style="font-size: 1.5rem;">0</span>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="info-box shadow-sm">
                <span class="info-box-icon bg-info"><i class="fas fa-edit"></i></span>
                <div class="info-box-content">
                    <span class="info-box-text">Perlu Revisi</span>
                    <span class="info-box-number count-up" id="valRevisi" style="font-size: 1.5rem;">0</span>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="info-box shadow-sm">
                <span class="info-box-icon bg-danger"><i class="fas fa-times"></i></span>
                <div class="info-box-content">
                    <span class="info-box-text">Ditolak</span>
                    <span class="info-box-number count-up" id="valDitolak" style="font-size: 1.5rem;">0</span>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        
        <div class="col-lg-4 d-flex">
            <div class="card-sultan shadow-sm w-100 h-100">
                <div class="card-header bg-white border-bottom-0">
                    <h3 class="card-title font-weight-bold text-maroon">
                        <i class="fas fa-chart-pie mr-2"></i> Proporsi Status
                    </h3>
                </div>
                <div class="card-body">
                    <div style="height: 220px; position: relative;">
                        <canvas id="chartStatus"></canvas>
                    </div>
                    <div class="mt-4">
                        <table class="table table-sm table-borderless small mb-0">
                            <tr>
                                <td><i class="fas fa-circle text-success"></i> Disetujui</td>
                                <td class="text-right font-weight-bold" id="txtChartSetuju">0</td>
                            </tr>
                            <tr>
                                <td><i class="fas fa-circle text-warning"></i> Diproses</td>
                                <td class="text-right font-weight-bold" id="txtChartProses">0</td>
                            </tr>
                            <tr>
                                <td><i class="fas fa-circle text-info"></i> Revisi</td>
                                <td class="text-right font-weight-bold" id="txtChartRevisi">0</td>
                            </tr>
                            <tr>
                                <td><i class="fas fa-circle text-danger"></i> Ditolak</td>
                                <td class="text-right font-weight-bold" id="txtChartTolak">0</td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4 d-flex">
            <div class="card-sultan shadow-sm w-100 h-100 border-top-danger" style="border-top: 3px solid #dc3545;">
                <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center py-2">
                    <h3 class="card-title font-weight-bold text-danger" style="font-size: 1rem;">
                        <i class="fas fa-exclamation-triangle mr-1"></i> BELUM KIRIM
                        <span class="badge badge-danger ml-1" id="badgeBelumCount">0</span>
                    </h3>
                    <button class="btn btn-xs btn-outline-danger" onclick="copyBelum()" title="Salin Daftar ke WA">
                        <i class="fas fa-copy"></i> Salin
                    </button>
                </div>
                
                <div class="p-2 bg-light border-bottom">
                    <input type="text" id="cariBelumLangsung" class="form-control form-control-sm border-0" 
                           placeholder="Cari nama sekolah..." onkeyup="filterBelumLangsung()">
                </div>

                <div class="card-body p-0">
                    <div id="containerBelum" style="max-height: 380px; overflow-y: auto;">
                        <table class="table table-sm table-striped table-hover mb-0" style="font-size: 13px;">
                            <tbody id="listBelumBody">
                                <tr><td class="text-center p-4 text-muted"><i class="fas fa-spinner fa-spin"></i> Memuat...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4 d-flex">
            <div class="card-sultan shadow-sm w-100 h-100">
                <div class="card-header bg-white border-bottom-0 d-flex justify-content-between align-items-center">
                    <h3 class="card-title font-weight-bold text-dark">
                        <i class="fas fa-history mr-2 text-maroon"></i> Laporan Masuk
                    </h3>
                    <button class="btn btn-xs btn-light border font-weight-bold text-maroon" onclick="loadPage('page_sk_data')">
                        Semua <i class="fas fa-arrow-right ml-1"></i>
                    </button>
                </div>
                <div class="card-body p-0">
                    <div id="timelineContainer" class="list-group list-group-flush" style="max-height: 420px; overflow-y: auto;">
                        </div>
                </div>
            </div>
        </div>

    </div>

  </div>
</section>

<div class="modal fade" id="modalBelumLapor" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content border-0 shadow-lg modal-content-sultan">
            <div class="modal-header bg-maroon text-white">
                <h5 class="modal-title font-weight-bold"><i class="fas fa-clipboard-list mr-2"></i>Daftar Sekolah Belum Lapor</h5>
                <button type="button" class="close text-white" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body bg-light">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="alert alert-warning mb-0 py-2 px-3 small w-100 shadow-sm">
                        <i class="fas fa-info-circle mr-1"></i> Menampilkan data periode: <b id="lblPeriodeBelum">-</b>
                    </div>
                </div>
                <input type="text" class="form-control form-control-sultan mb-3" id="cariBelum" placeholder="Ketik nama sekolah untuk mencari..." onkeyup="filterListBelum()">
                
                <div class="bg-white border rounded" style="max-height: 350px; overflow-y: auto;">
                    <table class="table table-sm table-hover table-striped mb-0 small">
                        <tbody id="listBelumBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer bg-white">
                <button type="button" class="btn btn-light border font-weight-bold" data-dismiss="modal">Tutup</button>
                <button type="button" class="btn btn-success font-weight-bold shadow-sm" onclick="copyBelum()">
                    <i class="fas fa-copy mr-1"></i> Salin Daftar
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    .border-bottom-maroon { border-bottom: 4px solid #800000 !important; }
    .bg-purple { background-color: #6f42c1 !important; color: #fff; }
    .opacity-20 { opacity: 0.2; }
    .opacity-30 { opacity: 0.3; }
    .hover-zoom:hover { transform: scale(1.02); transition: 0.3s; }
    
    /* CUSTOM INFO BOX */
    .info-box { min-height: 80px; border-radius: 8px; border: 1px solid #f0f0f0; }
    .info-box-icon { border-radius: 8px 0 0 8px; font-size: 1.5rem; width: 70px; }
    .info-box-content { padding: 10px 15px; }
</style>

<script>
    var CHART_INSTANCE = null;
    var LIST_BELUM_CACHE = []; // Simpan data untuk fitur Copy/Search

    $(document).ready(function() {
        initFilterDefault();
        loadDashboard();
    });

    function initFilterDefault() {
        var now = new Date();
        var curMonth = now.getMonth(); 
        var curYear = now.getFullYear();
        
        var htmlTahun = '';
        for (var y = 2021; y <= curYear + 1; y++) {
            var ta = y + "/" + (y + 1);
            htmlTahun += `<option value="${ta}">${ta}</option>`;
        }
        $('#dashTahun').html(htmlTahun);

        var defSemester = (curMonth >= 6) ? "Semester 1" : "Semester 2";
        var defTahun = (curMonth >= 6) ? curYear + "/" + (curYear + 1) : (curYear - 1) + "/" + curYear;

        $('#dashSemester').val(defSemester);
        if ($(`#dashTahun option[value='${defTahun}']`).length > 0) {
            $('#dashTahun').val(defTahun);
        }
    }

    function loadDashboard() {
        var th = $('#dashTahun').val();
        var sm = $('#dashSemester').val();
        
        // Reset UI with Spinner
        $('.count-up').html('<i class="fas fa-circle-notch fa-spin text-muted small"></i>');
        $('#timelineContainer').html('<div class="text-center p-4 text-muted"><i class="fas fa-spinner fa-spin"></i> Memuat...</div>');
        $('#listBelumBody').html('<tr><td class="text-center p-4 text-muted"><i class="fas fa-spinner fa-spin"></i> Memuat daftar...</td></tr>');

        google.script.run.withSuccessHandler(renderDashboard).getDashboardSK(th, sm);
    }

    function renderDashboard(data) {
        if (data.error) { Sultan.notif.gagal(data.error); return; }

        // 1. ANIMATE NUMBERS
        animateValue("valTotal", data.totalMasuk);
        animateValue("valDisetujui", data.disetujui);
        animateValue("valProgress", data.progress);
        animateValue("valBelum", data.belumLaporCount);
        
        // Update Info Box Detail
        animateValue("valDiproses", data.diproses); 
        animateValue("valRevisi", data.revisi);     
        animateValue("valDitolak", data.ditolak);   

        // Update Text Chart Detail
        $('#txtChartSetuju').text(data.disetujui);
        $('#txtChartProses').text(data.diproses);
        $('#txtChartRevisi').text(data.revisi);
        $('#txtChartTolak').text(data.ditolak);

        // 2. RENDER COMPONENTS
        renderChart(data);
        renderTimeline(data.recent);
        
        // 3. RENDER BELUM LAPOR (LANGSUNG TAMPIL)
        LIST_BELUM_CACHE = data.belumLaporList || [];
        $('#badgeBelumCount').text(LIST_BELUM_CACHE.length);
        renderBelumList(LIST_BELUM_CACHE);
    }

    // --- FITUR BARU: RENDER TABEL BELUM LAPOR ---
    function renderBelumList(list) {
        var el = $('#listBelumBody');
        el.empty();

        if (list.length === 0) {
            el.html('<tr><td class="text-center p-5 text-success font-weight-bold bg-white"><i class="fas fa-check-circle fa-3x mb-2"></i><br>Nihil! Semua Sudah Lapor.</td></tr>');
            return;
        }

        var html = "";
        list.forEach(function(nama, i) {
            html += `
            <tr class="animated fadeIn">
                <td class="px-3 py-2 align-middle border-bottom-light">
                    <div class="d-flex align-items-center">
                        <span class="badge badge-light border text-muted mr-2" style="width:25px; text-align:center;">${i+1}</span>
                        <span class="text-dark font-weight-bold sekolah-item">${nama}</span>
                    </div>
                </td>
            </tr>`;
        });
        el.html(html);
    }

    // --- FITUR BARU: CARI LANGSUNG ---
    function filterBelumLangsung() {
        var val = $('#cariBelumLangsung').val().toLowerCase();
        $("#listBelumBody tr").filter(function() { 
            $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1) 
        });
    }

    function renderTimeline(list) {
        var el = $('#timelineContainer');
        el.empty();
        
        if (!list || list.length === 0) {
            el.html('<div class="text-center p-5 text-muted small"><i class="fas fa-inbox fa-3x mb-2 text-light-gray"></i><br>Belum ada data masuk.</div>');
            return;
        }

        list.forEach(function(item, idx) {
            var icon = 'check-circle'; var color = 'success';
            var s = item.status.toLowerCase();
            if(s.includes('revisi')) { icon = 'edit'; color = 'info'; }
            if(s.includes('tolak')) { icon = 'times-circle'; color = 'danger'; }
            if(s.includes('proses')) { icon = 'clock'; color = 'warning'; }

            var html = `
                <div class="list-group-item px-3 py-2 border-0 border-bottom animated fadeIn" style="animation-delay: ${idx * 100}ms">
                    <div class="d-flex align-items-center">
                        <div class="mr-3 text-center" style="width: 40px;">
                            <div class="rounded-circle bg-light d-flex align-items-center justify-content-center mx-auto" style="width: 35px; height: 35px;">
                                <i class="fas fa-${icon} text-${color}"></i>
                            </div>
                        </div>
                        <div style="overflow: hidden; flex: 1;">
                            <h6 class="mb-0 text-truncate font-weight-bold text-dark" style="font-size: 13px;">${item.sekolah}</h6>
                            <small class="text-muted"><i class="far fa-clock mr-1"></i> ${item.waktu} &bull; <span class="text-${color}">${item.status}</span></small>
                        </div>
                    </div>
                </div>`;
            el.append(html);
        });
    }

    function renderChart(data) {
        var ctx = document.getElementById('chartStatus').getContext('2d');
        if (CHART_INSTANCE) CHART_INSTANCE.destroy();

        CHART_INSTANCE = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Disetujui', 'Diproses', 'Revisi', 'Ditolak'],
                datasets: [{
                    data: [data.disetujui, data.diproses, data.revisi, data.ditolak],
                    backgroundColor: ['#28a745', '#ffc107', '#17a2b8', '#dc3545'],
                    borderWidth: 0,
                    hoverOffset: 10
                }]
            },
            options: {
                maintainAspectRatio: false, 
                responsive: true,
                cutout: '70%', 
                plugins: {
                    legend: { display: false } // Legend disembunyikan karena sudah ada tabel detail di bawah chart
                }
            }
        });
    }

    function copyBelum() {
        if(LIST_BELUM_CACHE.length === 0) { Sultan.notif.info("Tidak ada data untuk disalin."); return; }
        
        var th = $('#dashTahun').val();
        var sm = $('#dashSemester').val();
        var txt = `*DAFTAR SEKOLAH BELUM KIRIM SK*\nPeriode: ${th} (${sm})\n\n`;
        
        LIST_BELUM_CACHE.forEach((nama, i) => {
            txt += `${i+1}. ${nama}\n`;
        });
        
        txt += `\n_Mohon segera mengirimkan laporan._`;

        navigator.clipboard.writeText(txt).then(() => Sultan.notif.sukses('Daftar berhasil disalin!'));
    }

    function animateValue(id, endValue, suffix = "") {
        var obj = document.getElementById(id);
        if(!obj) return;
        var start = 0; var end = parseInt(endValue);
        if (isNaN(end)) end = 0; if (end === 0) { obj.innerHTML = "0"; return; }
        var duration = 1000; var range = end - start; var current = start; var stepTime = Math.abs(Math.floor(duration / range));
        if(stepTime < 10) stepTime = 10; var stepVal = Math.ceil(range / (duration / stepTime));
        var timer = setInterval(function() {
            current += stepVal; if (current >= end) { current = end; clearInterval(timer); }
            obj.innerHTML = current + (suffix ? `<small>${suffix}</small>` : '');
        }, stepTime);
    }
</script>
