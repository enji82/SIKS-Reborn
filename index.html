  <script>
  // ============================================
  // 1. UPDATE UI NAVBAR (Data User)
  // ============================================
  function updateNavbarUI(user) {
      if (!user) return;
      var displayName = user.nama_lengkap || user.nama || user.username || "User";
      
      // Setup Foto
      var photoUrl = "https://ui-avatars.com/api/?name=" + encodeURIComponent(displayName) + "&background=random&color=fff";
      if (user.photo && user.photo.trim() !== "") {
          if (user.photo.startsWith("http")) photoUrl = user.photo;
          else photoUrl = "https://drive.google.com/thumbnail?id=" + user.photo + "&sz=s200";
      }
      
      $('#nav-user-name').text(displayName);
      $('#nav-user-photo').attr('src', photoUrl);
      $('#dropdown-user-name-big').text(displayName);
      $('#dropdown-user-role').text(user.role || "Pengguna");
      $('#dropdown-user-photo').attr('src', photoUrl);
      $('.user-panel .info a').text(displayName);
      $('.user-panel .image img').attr('src', photoUrl);
      
      if(user.role !== 'Admin') { $('#menu-setting-admin').hide(); } 
      else { $('#menu-setting-admin').show(); }
  }

  // ============================================
  // 2. FUNGSI LOAD HALAMAN (ROUTING UTAMA)
  // ============================================
  function loadContent(pageName) {
    if(!pageName) return;
    
    // Highlight Menu Sidebar
    $('.nav-link').removeClass('active'); 
    var $activeLink = $('a[data-page="' + pageName + '"]');
    $activeLink.addClass('active');

    // Buka menu induk (Treeview)
    var $parentTree = $activeLink.closest('.nav-treeview');
    if ($parentTree.length > 0) {
        $parentTree.show();
        $parentTree.closest('.nav-item').addClass('menu-open');
        $parentTree.prev('.nav-link').addClass('active');
    }

    // Panggil Server (TANPA SPINNER MANUAL, BIARKAN POPUP BAWAAN)
    google.script.run
      .withSuccessHandler(function(html) {
        $('#app-content').html(html); 
        
        // Update Breadcrumb
        var homeBtn = '<span style="cursor:pointer" class="btn-home-crumb"><i class="fas fa-home mr-1"></i> Beranda</span>';
        var pageTitle = $activeLink.find('p').text() || pageName;
        pageTitle = pageTitle.replace('<i class="right fas fa-angle-left"></i>', '').trim();
        
        if(pageName !== 'home') {
            $('#page-breadcrumb').html(homeBtn + ' <i class="fas fa-chevron-right mx-2 small text-muted"></i> <span class="font-weight-bold text-white">' + pageTitle + '</span>');
        } else {
            $('#page-breadcrumb').html(homeBtn);
        }
      })
      .withFailureHandler(function(err) {
        $('#app-content').html('<div class="alert alert-danger m-3">Gagal memuat halaman: ' + err.message + '</div>');
      })
      .loadPage(pageName);
  }

  // ============================================
  // 3. FUNGSI LOGOUT (SOFT LOGOUT - ANTI BLANK)
  // ============================================
  function handleLogout() {
    Swal.fire({
      title: 'Keluar Aplikasi?', text: "Sesi Anda akan diakhiri.", icon: 'warning',
      showCancelButton: true, confirmButtonColor: '#800000', cancelButtonColor: '#6c757d',
      confirmButtonText: 'Ya, Logout', cancelButtonText: 'Batal'
    }).then((result) => {
      if (result.isConfirmed) {
        // 1. Hapus Sesi Lokal
        localStorage.removeItem("siksUser");
        
        // 2. Efek Transisi (Fade Out Dashboard -> Fade In Login)
        $('#konten-aplikasi').fadeOut(400, function() {
            // Reset Form Login
            $('#username').val('');
            $('#password').val('');
            
            // Kembalikan Tombol Login ke Kondisi Awal (Bukan Hijau)
            $('#tombolLogin').prop('disabled', false)
                .html('<i class="fas fa-sign-in-alt mr-2"></i> MASUK APLIKASI')
                .css('background', ''); 

            // Tampilkan Wrapper Login
            $('#gerbang-login').show();
            $('.login-screen-wrapper').fadeIn(400); 
        });

        // 3. Logout Server (Background Process)
        google.script.run.processLogout();
      }
    });
  }

  // ============================================
  // 4. INISIALISASI (DOCUMENT READY)
  // ============================================
  $(document).ready(function() {
    
    // A. CEK LOGIN
    var userLocal = localStorage.getItem("siksUser");
    var user = userLocal ? JSON.parse(userLocal) : null;

    if (user) {
        // SUDAH LOGIN
        $('#gerbang-login').hide(); 
        $('#konten-aplikasi').show(); 
        updateNavbarUI(user);
        loadContent('home'); 
        
        // Auto Repair (Background)
        if (!user.nama_lengkap || user.nama_lengkap === user.username) {
             google.script.run.withSuccessHandler(function(res){
                if(res.found) {
                    user.nama_lengkap = res.nama_lengkap; user.nama = res.nama_lengkap;
                    user.role = res.role; user.unit = res.unit; 
                    if(res.photo) user.photo = res.photo; 
                    localStorage.setItem("siksUser", JSON.stringify(user));
                    updateNavbarUI(user);
                }
            }).getUserProfileByName(user.username);
        }
    } else {
        // BELUM LOGIN
        $('#konten-aplikasi').hide();
        $('#gerbang-login').show();
    }

    // B. EVENT HANDLER SIDEBAR
    $(document).on('click', '.nav-sidebar .nav-link', function(e) {
        e.preventDefault(); // Wajib untuk mencegah refresh

        var pageName = $(this).data('page'); 

        if (pageName) {
            loadContent(pageName);
            if ($(window).width() < 768) {
                $('body').removeClass('sidebar-open').addClass('sidebar-closed sidebar-collapse');
            }
        } 
    });

    // C. TOMBOL BREADCRUMB HOME
    $(document).on('click', '.btn-home-crumb', function(e) {
        e.preventDefault();
        loadContent('home');
        $('.nav-sidebar .menu-open').removeClass('menu-open');
        $('.nav-sidebar .nav-treeview').slideUp();
    });

  });
</script>

</body>
