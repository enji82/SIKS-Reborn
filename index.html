  <script>
  $(document).ready(function() {
    
    // 1. SETUP TOMBOL BERANDA
    var homeBtn = '<span class="btn-home-crumb" style="cursor:pointer" title="Reset ke Dashboard"><i class="fas fa-home mr-2"></i>Beranda</span>';
    $('#page-breadcrumb').html(homeBtn);

    // 2. LOGIKA KLIK TOMBOL RUMAH (Reset Total)
    $(document).on('click', '.btn-home-crumb', function() {
        var dashLink = $('.nav-sidebar > .nav-item > .nav-link').first();
        if(dashLink.length) dashLink.trigger('click'); 
        
        // Tutup semua menu paksa
        $('.nav-sidebar .menu-open').removeClass('menu-open');
        $('.nav-sidebar .nav-treeview').slideUp(300);
        $('.nav-sidebar .nav-link.active').removeClass('active');
        $('#page-breadcrumb').html(homeBtn);
    });

    // 3. LOGIKA KLIK MENU SIDEBAR (Auto-Collapse & Breadcrumb)
    $(document).on('click', '.nav-sidebar .nav-link', function(e) {
        
        // --- BAGIAN A: FITUR AUTO-COLLAPSE (SULTAN FOCUS) ---
        // Idenya: Saat klik sesuatu, tutup semua tetangga yang tidak sedarah.
        
        var $clickedItem = $(this).closest('.nav-item');
        var $hasChild = $(this).next('.nav-treeview').length > 0;

        // Jika yang diklik adalah MENU AKHIR (Leaf/Link Halaman)
        // Maka: Tutup semua menu lain yang BUKAN orang tua/kakek dari menu ini.
        if (!$hasChild) {
            $('.nav-sidebar .menu-open').not($clickedItem.parents()).each(function(){
                $(this).removeClass('menu-open');
                $(this).children('.nav-treeview').slideUp(300);
            });
        }
        // Jika yang diklik adalah MENU INDUK (Punya Anak)
        // Maka: Tutup saudara-saudaranya (Sibling) yang sedang terbuka.
        else {
           $clickedItem.siblings('.menu-open').each(function(){
                $(this).removeClass('menu-open');
                $(this).children('.nav-treeview').slideUp(300);
           });
        }

        // --- BAGIAN B: BREADCRUMB UPDATE ---
        
        var menuText = $(this).find('p').text().trim();
        if(!menuText) menuText = $(this).text().trim();

        var parent = $(this).closest('.nav-treeview').prev('.nav-link');
        var grandParent = parent.closest('.nav-treeview').prev('.nav-link');
        var sep = '<i class="fas fa-chevron-right mx-2" style="font-size:10px; opacity:0.5;"></i>';
        
        var fullPath = homeBtn;

        if (grandParent.length > 0) {
            fullPath += sep + '<span class="opacity-50">' + grandParent.find('p').text().trim() + '</span>';
        }
        if (parent.length > 0) {
            fullPath += sep + '<span class="opacity-50">' + parent.find('p').text().trim() + '</span>';
        }
        if (menuText) {
            // Jika punya anak, teks biasa. Jika halaman akhir, teks tebal putih.
            var styleClass = $hasChild ? "opacity-50" : "font-weight-bold text-white";
            fullPath += sep + '<span class="' + styleClass + '">' + menuText + '</span>';
        }

        $('#page-breadcrumb').html(fullPath);
    });
  });
</script>
