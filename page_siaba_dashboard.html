    <div class="row mb-4">

                </div>
                <div class="card-body">
                    <div style="height: 180px;" id="wrap-chartGabungan"><canvas id="chartGabungan"></canvas></div>
                    <hr>
                    <div class="mt-2" id="progressContainer"></div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card-sultan mb-3 h-100">
                <div class="card-header bg-white border-bottom-0">
                    <h3 class="card-title font-weight-bold text-maroon"><i class="fas fa-list-alt mr-1"></i> Rincian Status</h3>
                </div>
                <div class="card-body p-3" id="rincianContainer" style="overflow-y: auto; max-height: 400px;"></div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card-sultan mb-3 h-100">
                <div class="card-header bg-white border-bottom-0">
                    <h3 class="card-title font-weight-bold text-purple-sultan"><i class="fas fa-chart-bar mr-1"></i> Tren Kedisiplinan</h3>
                </div>
                <div class="card-body">
                    <div style="height: 330px;" id="wrap-chartBarDisiplin"><canvas id="chartBarDisiplin"></canvas></div>

                </div>
            </div>

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card-sultan mb-3 h-100">
                <div class="card-header bg-white border-bottom-0">
                    <h3 class="card-title font-weight-bold text-maroon"><i class="fas fa-chart-bar mr-1"></i> Tren Cuti</h3>
                </div>
                <div class="card-body">
                    <div style="height: 330px;" id="wrap-chartTrendCuti">
                        <div class="h-100 d-flex align-items-center justify-content-center text-muted"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card-sultan mb-3 h-100">
                <div class="card-header bg-white border-bottom-0">
                    <h3 class="card-title font-weight-bold text-primary"><i class="fas fa-chart-bar mr-1"></i> Tren Dinas</h3>
                </div>
                <div class="card-body">
                    <div style="height: 330px;" id="wrap-chartTrendDinas">
                        <div class="h-100 d-flex align-items-center justify-content-center text-muted"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card-sultan mb-3 h-100">
                <div class="card-header bg-white border-bottom-0">
                    <h3 class="card-title font-weight-bold text-warning"><i class="fas fa-chart-bar mr-1"></i> Tren Lupa</h3>
                </div>
                <div class="card-body">
                    <div style="height: 330px;" id="wrap-chartTrendLupa">
                        <div class="h-100 d-flex align-items-center justify-content-center text-muted"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
                    </div>
                </div>
            </div>

    </div>

    <div class="row mb-4">
        <div class="col-md-4">

                <div class="card-header bg-white border-bottom-0">
                    <h3 class="card-title font-weight-bold text-danger"><i class="fas fa-chart-bar mr-1"></i> Tren Salah</h3>
                </div>
                <div class="card-body">
                    <div style="height: 330px;" id="wrap-chartTrendSalah">
                        <div class="h-100 d-flex align-items-center justify-content-center text-muted"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
                    </div>

        </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>

<script>
// ==========================================
// 1. GLOBAL VARIABLES
// ==========================================
var GLOBAL_STATS = {
    proses: 0, revisi: 0, setuju: 0, tolak: 0,
    done: { cuti: false, dinas: false, lupa: false, salah: false }
};
var pieChartInstance = null;

// ==========================================
// 2. INITIALIZATION (SMART LOADER)
// ==========================================
$(document).ready(function() {
    // Pastikan library Chart sudah termuat
    // Jika belum, beri delay sedikit
    if (typeof Chart === 'undefined') {
        setTimeout(function() {
            startDashboardEngine();
        }, 500); // Tunggu 500ms
    } else {
        startDashboardEngine();
    }
});

function startDashboardEngine() {
    loadDashboardData();
}

function loadDashboardData() {
    showLoadingState(); 
    
    // Panggil 4 Kurir Data (Paralel)
    fetchMetric('cuti', 'totalCuti', 'bulanCuti', 'fa-calendar-alt', 'chartTrendCuti');
    fetchMetric('dinas', 'totalDinas', 'bulanDinas', 'fa-car', 'chartTrendDinas');
    fetchMetric('lupa', 'totalLupa', 'bulanLupa', 'fa-question-circle', 'chartTrendLupa');
    fetchMetric('salah', 'totalSalah', 'bulanSalah', 'fa-times-circle', 'chartTrendSalah');
    
    // Panggil 1 Kurir Data Grafik Disiplin
    loadChartTrend();
    
    // Siapkan wadah Pie Chart
    initPieChart();
}

function showLoadingState() {
    $('#rincianContainer').html('<div class="d-flex align-items-center justify-content-center h-100 text-muted"><div class="text-center"><i class="fas fa-circle-notch fa-spin fa-2x mb-2"></i><br>Sinkronisasi Data...</div></div>');
}

// ==========================================
// 3. CORE FUNCTIONS (PARALLEL)
// ==========================================

function fetchMetric(type, idTotal, idBulan, icon, idChart) {
    google.script.run
        .withSuccessHandler(function(json) {
            var data = JSON.parse(json);
            
            // A. Update Small Box
            $('#' + idTotal).text(data.total).hide().fadeIn();
            $('#' + idBulan).text(data.bulanIni);

            // B. Update List Rincian (Append)
            var html = createSlimVisualRow(capitalize(type), icon, data);
            
            // Cek apakah wadah masih berisi spinner loading? Jika iya, kosongkan dulu
            if($('#rincianContainer').find('.fa-spin').length > 0) {
                $('#rincianContainer').empty();
            }
            $('#rincianContainer').append(html);

            // C. Update Grafik Tren (Card Bawah)
            renderSpecificChart(idChart, data.trend);

            // D. Akumulasi Donut
            GLOBAL_STATS.proses += (data.proses || 0);
            GLOBAL_STATS.revisi += (data.revisi || 0);
            GLOBAL_STATS.setuju += (data.setuju || 0);
            GLOBAL_STATS.tolak  += (data.tolak || 0);
            GLOBAL_STATS.done[type] = true;
            updatePieChart();
        })
        .withFailureHandler(function(e) {
            console.log("Error " + type, e);
            $('#' + idTotal).html('<small class="text-danger">Err</small>');
        })
        .getSiabaMetric(type);
}

function loadChartTrend() {
    google.script.run.withSuccessHandler(function(json) {
        var data = JSON.parse(json);
        renderBarChart(data);
    }).getSiabaChartTrend();
}

// ==========================================
// 4. VISUAL RENDERING (CHART V3)
// ==========================================

function initPieChart() {
    var ctxElement = document.getElementById('chartGabungan');
    if (!ctxElement) return; // Safety Check

    var ctx = ctxElement.getContext('2d');
    
    // Pastikan Chart terdefinisi sebelum membuat instance baru
    if (typeof Chart !== 'undefined') {
        pieChartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Diproses', 'Revisi', 'Disetujui', 'Ditolak'],
                datasets: [{
                    data: [0, 0, 0, 0], 
                    backgroundColor: ['#ffc107', '#17a2b8', '#28a745', '#dc3545'],
                    borderWidth: 2, borderColor: '#ffffff'
                }]
            },
            options: {
                maintainAspectRatio: false, responsive: true, cutout: '70%', 
                plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: {size:10} } } }
            }
        });
    }
}

function updatePieChart() {
    if(!pieChartInstance) return;
    var s = GLOBAL_STATS;
    var total = s.proses + s.revisi + s.setuju + s.tolak;
    
    pieChartInstance.data.datasets[0].data = [s.proses, s.revisi, s.setuju, s.tolak];
    pieChartInstance.update();
    renderProgressBar(s.proses, s.revisi, s.setuju, s.tolak);
}

function renderBarChart(data) {
    $('#wrap-chartBarDisiplin').html('<canvas id="chartBarDisiplin"></canvas>');
    var ctxElement = document.getElementById('chartBarDisiplin');
    if (!ctxElement) return;

    var ctx = ctxElement.getContext('2d');
    if (typeof Chart !== 'undefined') {
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: data.labels, 
                datasets: [
                    { label: 'Terlambat', backgroundColor: '#dc3545', data: data.terlambat },
                    { label: 'Pulang Awal', backgroundColor: '#6f42c1', data: data.pulangAwal }
                ]
            },
            options: {
                maintainAspectRatio: false, responsive: true,
                scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 1 }, grid: { borderDash: [2, 2] } },
                    x: { grid: { display: false } }
                },
                plugins: { legend: { position: 'top', labels: { boxWidth: 10, usePointStyle: true } } }
            }
        });
    }
}

function renderSpecificChart(canvasId, dataset) {
    $('#wrap-' + canvasId).html('<canvas id="' + canvasId + '"></canvas>');
    var ctxElement = document.getElementById(canvasId);
    if (!ctxElement) return;

    var ctx = ctxElement.getContext('2d');
    
    if (typeof Chart !== 'undefined') {
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Ags","Sep","Okt","Nov","Des"],
                datasets: [
                    { label: 'Diproses', backgroundColor: '#ffc107', data: dataset.proses },
                    { label: 'Revisi', backgroundColor: '#17a2b8', data: dataset.revisi },
                    { label: 'Disetujui', backgroundColor: '#28a745', data: dataset.setuju },
                    { label: 'Ditolak', backgroundColor: '#dc3545', data: dataset.tolak }
                ]
            },
            options: {
                maintainAspectRatio: false, responsive: true,
                plugins: { 
                    legend: { position: 'top', labels: { boxWidth: 8, font: {size: 9}, usePointStyle: true } },
                    tooltip: { mode: 'index', intersect: false }
                },
                scales: {
                    x: { stacked: false, grid: { display: false }, ticks: { font: {size: 9} } },
                    y: { stacked: false, beginAtZero: true, ticks: { font: {size: 9} } }
                }
            }
        });
    }
}

// ==========================================
// 5. HELPER UI
// ==========================================

function renderProgressBar(p, r, ok, no) {
    var total = p + r + ok + no;
    function calc(val) { return total > 0 ? Math.round((val / total) * 100) + '%' : '0%'; }
    var html = `
        ${progressItem('Diproses', p, calc(p), 'warning')}
        ${progressItem('Revisi', r, calc(r), 'info')}
        ${progressItem('Disetujui', ok, calc(ok), 'success')}
        ${progressItem('Ditolak', no, calc(no), 'danger')}
    `;
    $('#progressContainer').html(html);
}

function progressItem(lbl, val, pct, color) {
    return `
    <div class="d-flex justify-content-between mb-1 small">
        <span class="text-${color} font-weight-bold">${lbl}</span><span>${val}</span>
    </div>
    <div class="progress progress-xs mb-2"><div class="progress-bar bg-${color}" style="width: ${pct}"></div></div>`;
}

function createSlimVisualRow(label, icon, data) {
    var displayLabel = label;
    if(label === 'Cuti') displayLabel = 'Pengajuan Cuti';
    if(label === 'Dinas') displayLabel = 'Perjalanan Dinas';
    if(label === 'Lupa') displayLabel = 'Lupa Presensi';
    if(label === 'Salah') displayLabel = 'Salah Presensi';

    return `
    <div class="mb-2 pb-2 border-bottom animated fadeIn">
        <div class="d-flex align-items-center mb-1">
            <i class="fas ${icon} text-secondary mr-2" style="font-size: 0.9rem;"></i>
            <span class="font-weight-bold text-dark" style="font-size: 0.9rem;">${displayLabel}</span>
        </div>
        <div class="d-flex justify-content-between">
            ${renderMiniBox(data.proses, 'Diproses', 'warning', '#fff8e1', '#ffe0b2')}
            ${renderMiniBox(data.revisi, 'Revisi', 'info', '#e3f2fd', '#bbdefb')}
            ${renderMiniBox(data.setuju, 'Disetujui', 'success', '#e8f5e9', '#c8e6c9')}
            ${renderMiniBox(data.tolak, 'Ditolak', 'danger', '#ffebee', '#ffcdd2')}
        </div>
    </div>`;
}

function renderMiniBox(val, label, color, bg, border) {
    return `<div class="flex-fill mr-1 rounded text-center position-relative" style="background-color: ${bg}; border: 1px solid ${border}; padding: 2px;">
                <span class="font-weight-bold text-${color}" style="font-size: 1rem;">${val}</span>
                <span class="text-muted d-block" style="font-size: 8px; margin-top: -3px; text-transform:uppercase">${label}</span>
            </div>`;
}

function capitalize(s) { return s && s[0].toUpperCase() + s.slice(1); }
</script>

<style>
    .f-20 { font-size: 1.25rem; }
    .small-box h3, canvas { transition: all 0.3s ease; }
</style>
