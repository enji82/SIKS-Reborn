<div class="content-header pb-0">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-12">
        <h5 class="m-0 font-weight-bold">
          <i class="fas fa-cloud-download-alt text-maroon mr-2"></i>Unduh Rekap Bulanan
        </h5>
        <hr class="mt-2 mb-3" style="border-top: 2px solid #800000;">
      </div>
    </div>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12">
        
        <div class="control-bar mb-3 d-flex flex-wrap justify-content-between align-items-center bg-white p-3 shadow-sm rounded">
          
          <div class="d-flex align-items-center flex-wrap" style="gap: 8px;">
            
            <button type="button" class="btn border-tegas btn-square-sultan shadow-sm" onclick="goHome()" title="Folder Utama">
              <i class="fas fa-home text-maroon"></i>
            </button>

            <button id="btnBack" type="button" class="btn border-tegas btn-square-sultan shadow-sm" onclick="navigateUp()" title="Kembali" style="display:none;">
              <i class="fas fa-level-up-alt text-dark"></i>
            </button>

            <button type="button" class="btn border-tegas btn-square-sultan shadow-sm" onclick="refreshCurrentFolder()" title="Refresh">
              <i class="fas fa-sync-alt text-primary"></i>
            </button>

            <div style="height: 25px; width: 1px; background: #dee2e6; margin: 0 5px;"></div>

            <div class="d-flex align-items-center bg-light px-3 py-2 rounded border-tegas" style="min-width: 200px;">
                <i class="fas fa-folder text-warning mr-2"></i>
                <span id="folderNameLabel" class="font-weight-bold text-dark">Memuat...</span>
            </div>
          </div>

          <div class="mt-2 mt-xl-0 text-muted small font-weight-bold">
             Total Item: <span id="totalItemCount" class="text-maroon">0</span>
          </div>
        </div>

        <div class="card shadow-sm border-0">
          <div class="card-body p-0">
            
            <div id="arsipLoading" class="text-center py-5">
                <div class="spinner-border text-maroon" role="status">
                    <span class="sr-only">Loading...</span>
                </div>
                <p class="mt-2 text-muted small">Mengambil data dari Drive...</p>
            </div>

            <div class="table-responsive" id="arsipTableWrapper" style="display:none;">
              <table id="tabelArsip" class="table table-hover table-premium mb-0" style="width:100%;">
                <thead class="bg-light">
                  <tr>
                    <th style="width: 50px;" class="text-center">No</th>
                    <th>Nama File / Folder</th>
                    <th style="width: 150px;" class="text-center">Ukuran</th>
                    <th style="width: 150px;" class="text-center">Tanggal</th>
                    <th style="width: 120px;" class="text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody id="bodyTabelArsip">
                   </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>

<div class="modal fade" id="modalPreviewArsip" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-xl" role="document" style="height: 90vh;">
    <div class="modal-content h-100 border-0">
      <div class="modal-header py-2 bg-light">
        <h6 class="modal-title font-weight-bold"><i class="fas fa-eye mr-2 text-maroon"></i> Preview File</h6>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body p-0 bg-dark">
        <iframe id="framePreviewArsip" src="" style="width:100%; height:100%; border:none;"></iframe>
      </div>
    </div>
  </div>
</div>

<script>
  var currentFolderId = null; 
  var parentFolderId = null;

  $(document).ready(function() {
      goHome(); // Load Root saat buka halaman
  });

  // --- LOGIKA UTAMA ---
  function loadFolder(folderId) {
      $('#arsipLoading').show(); 
      $('#arsipTableWrapper').hide();
      $('#folderNameLabel').text('Memuat...');
      
      google.script.run
        .withSuccessHandler(renderArsipTable)
        .withFailureHandler(function(err) {
           $('#arsipLoading').hide();
           NotifSultan.alert('error', 'Gagal', err.message);
        })
        .getSiabaUnduhData(folderId);
  }

  function renderArsipTable(data) {
      if (data.error) {
          $('#arsipLoading').hide();
          NotifSultan.alert('error', 'Akses Ditolak', data.error);
          return;
      }

      currentFolderId = data.currentId;
      parentFolderId = data.parentId;
      
      // Update UI Header
      $('#folderNameLabel').text(data.currentName);
      
      // Toggle Button Back
      if (data.isRoot) $('#btnBack').hide();
      else $('#btnBack').show();

      var items = data.items || [];
      var tbody = $('#bodyTabelArsip');
      tbody.empty();

      if (items.length === 0) {
          tbody.append('<tr><td colspan="5" class="text-center py-4 text-muted"><i>Folder ini kosong.</i></td></tr>');
      } else {
          items.forEach(function(item, i) {
              var tr = $('<tr>').css('cursor', 'pointer');
              
              // Ikon Berdasarkan Tipe
              var iconHtml = '<i class="fas fa-file text-secondary mr-2"></i>';
              
              // Variable Tombol Aksi
              var btnAction = '';

              if (item.type === 'folder') {
                  iconHtml = '<i class="fas fa-folder text-warning mr-2 fa-lg"></i>';
                  tr.on('click', function() { loadFolder(item.id); }); // Klik baris -> masuk folder
                  
                  // Tombol Buka Folder
                  btnAction = `<button class="btn btn-sm btn-outline-dark rounded-pill px-3 shadow-sm" style="font-size:12px;">Buka</button>`;
              } else {
                  // Icon File
                  var mime = item.mimeType;
                  if (mime.includes('pdf')) iconHtml = '<i class="fas fa-file-pdf text-danger mr-2 fa-lg"></i>';
                  else if (mime.includes('image')) iconHtml = '<i class="fas fa-file-image text-purple mr-2 fa-lg"></i>';
                  else if (mime.includes('spreadsheet') || mime.includes('excel')) iconHtml = '<i class="fas fa-file-excel text-success mr-2 fa-lg"></i>';
                  else if (mime.includes('document') || mime.includes('word')) iconHtml = '<i class="fas fa-file-word text-primary mr-2 fa-lg"></i>';
                  
                  // Klik baris -> preview file
                  tr.on('click', function() { openPreview(item.url, item.mimeType); });

                  // --- REVISI: TOMBOL UNDUH ---
                  // Kita stopPropagation agar saat klik unduh tidak men-trigger preview (tr.click)
                  // Link download Direct dari Google Drive
                  var downloadUrl = "https://drive.google.com/uc?export=download&id=" + item.id;
                  
                  btnAction = `<a href="${downloadUrl}" target="_blank" 
                                  class="btn btn-sm btn-success rounded-pill px-3 shadow-sm font-weight-bold" 
                                  style="font-size:12px;" 
                                  onclick="event.stopPropagation();">
                                  <i class="fas fa-download mr-1"></i> Unduh
                               </a>`;
              }

              // Render Baris
              tr.append(`<td class="text-center align-middle">${i+1}</td>`);
              tr.append(`<td class="align-middle font-weight-bold text-dark">${iconHtml} ${item.name}</td>`);
              tr.append(`<td class="text-center align-middle small">${item.size}</td>`);
              tr.append(`<td class="text-center align-middle small text-muted">${item.date}</td>`);
              tr.append(`<td class="text-center align-middle">${btnAction}</td>`);

              tbody.append(tr);
          });
      }
      
      $('#totalItemCount').text(items.length);
      $('#arsipLoading').hide();
      $('#arsipTableWrapper').fadeIn(300);
  }

  // --- NAVIGASI ---
  function navigateUp() {
      if (parentFolderId) loadFolder(parentFolderId);
  }

  function goHome() {
      loadFolder(null); // Null = Root
  }

  function refreshCurrentFolder() {
      loadFolder(currentFolderId);
  }

  // --- PREVIEW ---
  function openPreview(url, mimeType) {
    if (mimeType === 'application/vnd.google-apps.folder') return;

    var idMatch = url.match(/[-\w]{25,}/); 
    if(idMatch) {
        var previewUrl = "https://drive.google.com/file/d/" + idMatch[0] + "/preview";
        $('#framePreviewArsip').attr('src', previewUrl);
        $('#modalPreviewArsip').modal('show');
    } else {
        window.open(url, '_blank'); 
    }
  }
</script>

<style>
  #tabelArsip tbody tr:hover {
      background-color: #f1f2f6; /* Hover effect lembut */
  }
  /* Style Sultan & Colors */
  .btn-square-sultan { border-radius: 6px; font-weight: bold; }
  .border-tegas { border: 1px solid #dee2e6; }
  .text-purple { color: #9b59b6; }
  .text-maroon { color: #800000; }
  
  /* Table Compact */
  .table-premium th { font-size: 13px; vertical-align: middle; border-top: none; }
  .table-premium td { font-size: 13px; }
</style>
