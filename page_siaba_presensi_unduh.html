<div class="content-header pb-0">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-12">
        <h5 class="m-0 font-weight-bold">
          <i class="fas fa-cloud-download-alt text-maroon mr-2"></i>Unduh Rekap Bulanan
        </h5>
        <hr class="style-sultan-solid">
      </div>
    </div>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12">
        
        <div class="card-sultan p-3 mb-3">
          <div class="d-flex flex-wrap justify-content-between align-items-center">
            
            <div class="d-flex align-items-center flex-wrap gap-10">
              
              <button type="button" class="btn border-tegas shadow-sm bg-white" onclick="goHome()" title="Folder Utama">
                <i class="fas fa-home text-maroon"></i>
              </button>

              <button id="btnBack" type="button" class="btn border-tegas shadow-sm bg-white" onclick="navigateUp()" title="Kembali" style="display:none;">
                <i class="fas fa-level-up-alt text-dark"></i>
              </button>

              <button type="button" class="btn border-tegas shadow-sm bg-white" onclick="refreshCurrentFolder()" title="Refresh">
                <i class="fas fa-sync-alt text-blue-sultan"></i>
              </button>

              <div class="divider-vertical"></div>

              <div class="d-flex align-items-center bg-abu-terang px-3 py-2 rounded border-tegas" style="min-width: 200px;">
                  <i class="fas fa-folder-open text-gold-sultan mr-2"></i>
                  <span id="folderNameLabel" class="font-weight-bold text-dark small text-uppercase">MEMUAT...</span>
              </div>
            </div>

            <div class="mt-2 mt-xl-0 text-muted small font-weight-bold">
               Total Item: <span id="totalItemCount" class="text-maroon">0</span>
            </div>
          </div>
        </div>

        <div class="card-sultan">
          <div class="card-body p-0">
            
            <div id="arsipLoading" class="text-center py-5">
                <div class="sultan-loading-container">
                    <i class="fas fa-spinner fa-spin fa-3x text-maroon mb-3"></i>
                    <p class="text-muted font-weight-bold">Mengambil data dari Drive...</p>
                </div>
            </div>

            <div class="table-responsive" id="arsipTableWrapper" style="display:none;">
              <table id="tabelArsip" class="table table-hover table-premium mb-0" style="width:100%;">
                <thead>
                  <tr>
                    <th style="width: 50px;" class="text-center">No</th>
                    <th>Nama File / Folder</th>
                    <th style="width: 100px;" class="text-center">Ukuran</th>
                    <th style="width: 150px;" class="text-center">Tanggal</th>
                    <th style="width: 120px;" class="text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody id="bodyTabelArsip">
                   </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>

<div class="modal fade" id="modalPreviewArsip" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-full" role="document"> 
    
    <div class="modal-content modal-content-full-height border-0 shadow-lg"> 
      
      <div class="modal-header bg-maroon py-2">
        <h6 class="modal-title font-weight-bold text-white">
            <i class="fas fa-file-pdf mr-2"></i> Preview Dokumen
        </h6>
        <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
      </div>
      
      <div class="modal-body modal-body-full">
          <iframe id="framePreviewArsip" class="iframe-full" src=""></iframe>
      </div>
      
      <div class="modal-footer justify-content-between bg-light py-2" style="flex-shrink: 0;">
          <button type="button" class="btn border-tegas shadow-sm" data-dismiss="modal">Tutup</button>
          
          <a id="btnDownloadFinal" href="#" target="_blank" class="btn-unduh-preview">
              <i class="fas fa-download mr-2"></i> UNDUH FILE
          </a>
      </div>

    </div>
  </div>
</div>

<script>
  var currentFolderId = null; 
  var parentFolderId = null;

  $(document).ready(function() {
      goHome(); 
  });

  // --- 1. LOGIKA LOAD FOLDER ---
  function loadFolder(folderId) {
      $('#arsipLoading').show(); 
      $('#arsipTableWrapper').hide();
      $('#folderNameLabel').text('MEMUAT...');
      
      google.script.run
        .withSuccessHandler(renderArsipTable)
        .withFailureHandler(function(err) {
           $('#arsipLoading').hide();
           Sultan.notif.gagal('Gagal memuat folder: ' + err.message);
        })
        .getSiabaUnduhData(folderId);
  }

  function renderArsipTable(data) {
      if (data.error) {
          $('#arsipLoading').hide();
          Sultan.notif.gagal(data.error);
          return;
      }

      currentFolderId = data.currentId;
      parentFolderId = data.parentId;
      
      // Update UI Header
      $('#folderNameLabel').text(data.currentName);
      
      // Toggle Button Back
      if (data.isRoot) $('#btnBack').hide();
      else $('#btnBack').show();

      var items = data.items || [];
      var tbody = $('#bodyTabelArsip');
      tbody.empty();

      if (items.length === 0) {
          tbody.append('<tr><td colspan="5" class="text-center py-5 text-muted"><i><i class="fas fa-folder-open fa-3x mb-3"></i><br>Folder ini kosong.</i></td></tr>');
      } else {
          items.forEach(function(item, i) {
              var tr = $('<tr>').css('cursor', 'pointer');
              
              var iconHtml = '<i class="fas fa-file text-secondary mr-2"></i>';
              var btnAction = '';

              // --- LOGIKA FOLDER ---
              if (item.type === 'folder') {
                  iconHtml = '<i class="fas fa-folder text-gold-sultan mr-2 fa-lg"></i>';
                  tr.addClass('font-weight-bold'); // Bold nama folder
                  
                  // Klik Baris -> Masuk Folder
                  tr.on('click', function() { loadFolder(item.id); }); 
                  
                  // Tombol Buka
                  btnAction = `<button class="btn btn-xs btn-outline-primary shadow-sm rounded-pill px-3" onclick="event.stopPropagation(); loadFolder('${item.id}')">Buka</button>`;
              
              } 
              // --- LOGIKA FILE ---
              else {
                  var mime = item.mimeType;
                  // Ikon File
                  if (mime.includes('pdf')) iconHtml = '<i class="fas fa-file-pdf text-danger mr-2 fa-lg"></i>';
                  else if (mime.includes('image')) iconHtml = '<i class="fas fa-file-image text-purple-sultan mr-2 fa-lg"></i>';
                  else if (mime.includes('spreadsheet') || mime.includes('excel')) iconHtml = '<i class="fas fa-file-excel text-green-sultan mr-2 fa-lg"></i>';
                  else if (mime.includes('document') || mime.includes('word')) iconHtml = '<i class="fas fa-file-word text-blue-sultan mr-2 fa-lg"></i>';
                  
                  // Klik Baris -> Preview
                  tr.on('click', function() { openPreview(item.id, item.mimeType); });

                  // Tombol Unduh -> Preview Dulu
                  btnAction = `<button class="btn btn-xs btn-success shadow-sm rounded-pill px-3 font-weight-bold" 
                                       onclick="event.stopPropagation(); openPreview('${item.id}', '${item.mimeType}')">
                                  <i class="fas fa-eye mr-1"></i> Lihat & Unduh
                               </button>`;
              }

              // Render Baris
              tr.append(`<td class="text-center align-middle">${i+1}</td>`);
              tr.append(`<td class="align-middle text-dark">${iconHtml} ${item.name}</td>`);
              tr.append(`<td class="text-center align-middle small text-muted">${item.size}</td>`);
              tr.append(`<td class="text-center align-middle small text-muted">${item.date}</td>`);
              tr.append(`<td class="text-center align-middle">${btnAction}</td>`);

              tbody.append(tr);
          });
      }
      
      $('#totalItemCount').text(items.length);
      $('#arsipLoading').hide();
      $('#arsipTableWrapper').fadeIn(300);
  }

  // --- 2. NAVIGASI ---
  function navigateUp() { if (parentFolderId) loadFolder(parentFolderId); }
  function goHome() { loadFolder(null); }
  function refreshCurrentFolder() { loadFolder(currentFolderId); }

  // --- 3. PREVIEW & DOWNLOAD ---
  function openPreview(fileId, mimeType) {
    if (mimeType === 'application/vnd.google-apps.folder') return;

    // URL Preview Google Drive
    var previewUrl = "https://drive.google.com/file/d/" + fileId + "/preview";
    // URL Download Google Drive
    var downloadUrl = "https://drive.google.com/uc?export=download&id=" + fileId;

    // Set Iframe & Tombol Download
    $('#framePreviewArsip').attr('src', previewUrl);
    $('#btnDownloadFinal').attr('href', downloadUrl);

    // Buka Modal
    $('#modalPreviewArsip').modal('show');
  }
</script>
