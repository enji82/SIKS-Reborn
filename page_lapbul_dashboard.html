<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="content-header pb-0">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-12">
        <h5 class="m-0 font-weight-bold">
          <i class="fas fa-tachometer-alt text-maroon mr-2"></i>Dashboard Laporan Bulan
        </h5>
        <hr class="style-sultan-solid">
      </div>
    </div>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    
    <div class="row justify-content-center mb-3">
        <div class="col-12">
            <div class="card-sultan p-3">
                <div class="d-flex-gap align-items-center justify-content-center flex-wrap">
                    <label class="mb-0 mr-2 font-weight-bold text-maroon">Periode Data:</label>
                    
                    <select id="dashTahun" class="form-control form-control-sultan input-auto-width" style="min-width: 100px;"></select>
                    
                    <select id="dashBulan" class="form-control form-control-sultan input-auto-width" style="min-width: 150px;">
                        <option value="1">Januari</option>
                        <option value="2">Februari</option>
                        <option value="3">Maret</option>
                        <option value="4">April</option>
                        <option value="5">Mei</option>
                        <option value="6">Juni</option>
                        <option value="7">Juli</option>
                        <option value="8">Agustus</option>
                        <option value="9">September</option>
                        <option value="10">Oktober</option>
                        <option value="11">November</option>
                        <option value="12">Desember</option>
                    </select>

                    <button type="button" class="btn btn-maroon shadow-sm ml-2" onclick="loadDashboard()">
                        <i class="fas fa-sync-alt mr-1"></i> TAMPILKAN
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="loadingDash" class="row" style="display:none;">
        <div class="col-12 text-center p-5">
            <div class="sultan-loading-container">
                <i class="fas fa-circle-notch fa-spin fa-3x text-maroon mb-3"></i>
                <h6 class="text-muted font-weight-bold">Menghitung Statistik...</h6>
            </div>
        </div>
    </div>

    <div id="contentDash" class="row" style="display:none;">
        
        <div class="col-lg-3 col-6">
            <div class="card-sultan mb-3 border-left-info shadow-sm h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="font-weight-bold text-info m-0">JENJANG SD</h6>
                        <i class="fas fa-school text-black-50 fa-2x"></i>
                    </div>
                    <h3 class="font-weight-bold text-dark mb-1" id="valSdPersen">0%</h3>
                    <div class="progress mb-2" style="height: 6px;">
                        <div id="progSd" class="progress-bar bg-info" style="width: 0%"></div>
                    </div>
                    <div class="d-flex justify-content-between small text-muted">
                        <span>Sudah: <b id="valSdSudah" class="text-success">0</b></span>
                        <span>Total: <b id="valSdTotal">0</b></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-3 col-6">
            <div class="card-sultan mb-3 border-left-warning shadow-sm h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="font-weight-bold text-warning m-0">JENJANG TK</h6>
                        <i class="fas fa-child text-black-50 fa-2x"></i>
                    </div>
                    <h3 class="font-weight-bold text-dark mb-1" id="valTkPersen">0%</h3>
                    <div class="progress mb-2" style="height: 6px;">
                        <div id="progTk" class="progress-bar bg-warning" style="width: 0%"></div>
                    </div>
                    <div class="d-flex justify-content-between small text-muted">
                        <span>Sudah: <b id="valTkSudah" class="text-success">0</b></span>
                        <span>Total: <b id="valTkTotal">0</b></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-3 col-6">
            <div class="card-sultan mb-3 border-left-success shadow-sm h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="font-weight-bold text-success m-0">JENJANG KB</h6>
                        <i class="fas fa-shapes text-black-50 fa-2x"></i>
                    </div>
                    <h3 class="font-weight-bold text-dark mb-1" id="valKbPersen">0%</h3>
                    <div class="progress mb-2" style="height: 6px;">
                        <div id="progKb" class="progress-bar bg-success" style="width: 0%"></div>
                    </div>
                    <div class="d-flex justify-content-between small text-muted">
                        <span>Sudah: <b id="valKbSudah" class="text-success">0</b></span>
                        <span>Total: <b id="valKbTotal">0</b></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-3 col-6">
            <div class="card-sultan mb-3 border-left-primary shadow-sm h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="font-weight-bold text-primary m-0">JENJANG SPS</h6>
                        <i class="fas fa-home text-black-50 fa-2x"></i>
                    </div>
                    <h3 class="font-weight-bold text-dark mb-1" id="valSpsPersen">0%</h3>
                    <div class="progress mb-2" style="height: 6px;">
                        <div id="progSps" class="progress-bar bg-primary" style="width: 0%"></div>
                    </div>
                    <div class="d-flex justify-content-between small text-muted">
                        <span>Sudah: <b id="valSpsSudah" class="text-success">0</b></span>
                        <span>Total: <b id="valSpsTotal">0</b></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 mt-2">
            <div class="row">
                <div class="col-lg-8">
                    <div class="card-sultan mb-3 h-100">
                        <div class="card-header bg-white border-bottom-0">
                            <h6 class="card-title font-weight-bold text-maroon">
                                <i class="fas fa-chart-bar mr-2"></i>Komparasi Detail Status
                            </h6>
                        </div>
                        <div class="card-body">
                            <div style="height: 350px; width: 100%;">
                                <canvas id="chartLapbul"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card-sultan mb-3 h-100">
                        <div class="card-header bg-white border-bottom-0">
                            <h6 class="card-title font-weight-bold text-maroon">
                                <i class="fas fa-history mr-2"></i>Laporan Masuk
                            </h6>
                        </div>
                        <div class="card-body p-0">
                            <div id="listActivity" class="list-group list-group-flush" style="max-height: 380px; overflow-y: auto;">
                                </div>
                        </div>
                        <div class="card-footer bg-white text-center small text-muted">
                            *Menampilkan 7 data terbaru
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
  </div>
</section>

<script>
    var CHART_INSTANCE = null;

    $(document).ready(function() {
        // Default: Bulan Lalu
        var d = new Date();
        d.setMonth(d.getMonth() - 1); 
        var thn = d.getFullYear(); 
        var bln = d.getMonth() + 1;

        var $sel = $('#dashTahun').empty();
        for(var i = thn - 4; i <= thn + 1; i++){ 
            $sel.append('<option value="'+i+'">'+i+'</option>'); 
        }
        $sel.val(thn);
        $('#dashBulan').val(bln);

        loadDashboard();
    });

    function loadDashboard() {
        var t = $('#dashTahun').val();
        var b = $('#dashBulan').val();

        $('#contentDash').hide();
        $('#loadingDash').show();

        google.script.run
            .withSuccessHandler(renderDashboard)
            .withFailureHandler(function(e){
                $('#loadingDash').hide();
                alert("Gagal memuat: " + e.message);
            })
            .getDashboardLapbul(t, b);
    }

    function renderDashboard(data) {
        $('#loadingDash').hide();
        $('#contentDash').fadeIn();

        // 1. Update Kartu
        updateCard('Sd', data.sd);
        updateCard('Tk', data.tk);
        updateCard('Kb', data.kb);
        updateCard('Sps', data.sps);

        // 2. Render Chart Detail 5 Dataset
        renderChart(data);

        // 3. Render List
        renderActivity(data.recent);
    }

    function updateCard(jenjang, stats) {
        $('#val' + jenjang + 'Persen').text(stats.persen + "%");
        $('#val' + jenjang + 'Sudah').text(stats.sudah);
        $('#val' + jenjang + 'Total').text(stats.total);
        $('#prog' + jenjang).css('width', stats.persen + "%");
    }

    function renderChart(data) {
        var ctx = document.getElementById('chartLapbul').getContext('2d');
        if (CHART_INSTANCE) CHART_INSTANCE.destroy();

        // Siapkan Data Array per Kategori
        var jenjangs = ['SD', 'TK', 'KB', 'SPS'];
        var dDisetujui = [data.sd.disetujui, data.tk.disetujui, data.kb.disetujui, data.sps.disetujui];
        var dDiproses  = [data.sd.diproses, data.tk.diproses, data.kb.diproses, data.sps.diproses];
        var dRevisi    = [data.sd.revisi, data.tk.revisi, data.kb.revisi, data.sps.revisi];
        var dDitolak   = [data.sd.ditolak, data.tk.ditolak, data.kb.ditolak, data.sps.ditolak];
        var dBelum     = [data.sd.belum, data.tk.belum, data.kb.belum, data.sps.belum];

        CHART_INSTANCE = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: jenjangs,
                datasets: [
                    {
                        label: 'Disetujui',
                        data: dDisetujui,
                        backgroundColor: '#28a745', // Hijau
                        borderWidth: 1
                    },
                    {
                        label: 'Diproses',
                        data: dDiproses,
                        backgroundColor: '#17a2b8', // Biru Langit
                        borderWidth: 1
                    },
                    {
                        label: 'Revisi',
                        data: dRevisi,
                        backgroundColor: '#ffc107', // Kuning
                        borderWidth: 1
                    },
                    {
                        label: 'Ditolak',
                        data: dDitolak,
                        backgroundColor: '#dc3545', // Merah
                        borderWidth: 1
                    },
                    {
                        label: 'Belum Lapor',
                        data: dBelum,
                        backgroundColor: '#6c757d', // Abu-abu
                        borderWidth: 1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { stacked: false }, // Ubah ke 'true' jika ingin model tumpuk
                    y: { 
                        stacked: false, 
                        beginAtZero: true,
                        ticks: { stepSize: 1 }
                    }
                },
                plugins: {
                    legend: { position: 'bottom' },
                    tooltip: { mode: 'index', intersect: false }
                }
            }
        });
    }

    function renderActivity(list) {
        var el = $('#listActivity');
        el.empty();
        if (!list || list.length === 0) {
            el.html('<div class="text-center p-4 text-muted small">Belum ada data laporan masuk.</div>');
            return;
        }
        var limitList = list.slice(0, 7);
        limitList.forEach(function(item) {
            var badgeClass = 'bg-secondary';
            if(item.jenjang === 'SD') badgeClass = 'bg-info';
            if(item.jenjang === 'TK') badgeClass = 'bg-warning';
            if(item.jenjang === 'KB') badgeClass = 'bg-success';
            if(item.jenjang === 'SPS') badgeClass = 'bg-primary';

            var html = `
                <div class="list-group-item px-3 py-2 border-bottom-light">
                    <div class="d-flex align-items-center">
                        <div class="d-inline-flex align-items-center justify-content-center rounded-circle text-white shadow-sm mr-3 ${badgeClass}" style="width:35px; height:35px; flex-shrink:0;">
                            <small class="font-weight-bold" style="font-size:10px;">${item.jenjang}</small>
                        </div>
                        <div style="overflow:hidden;">
                            <div class="text-dark font-weight-bold text-truncate" style="font-size:13px;">${item.sekolah}</div>
                            <div class="text-muted small text-truncate"><i class="fas fa-check-circle text-success mr-1"></i>${item.status}</div>
                        </div>
                    </div>
                </div>`;
            el.append(html);
        });
    }
</script>
