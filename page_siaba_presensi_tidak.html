<div class="content-header pb-0">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-12">
        <h5 class="m-0 font-weight-bold">
          <i class="fas fa-user-times text-maroon mr-2"></i>Rekap Tidak Presensi
        </h5>
        <hr class="style-sultan-solid">
      </div>
    </div>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12">

        <div class="card-sultan mb-3">
          <div class="card-body py-2 px-3 border-left-dark">
            <div class="d-flex align-items-center justify-content-between cursor-pointer" 
                 data-toggle="collapse" data-target="#infoCollapse" aria-expanded="false">
              <div class="d-flex align-items-center text-maroon font-weight-bold">
                <i class="fas fa-info-circle mr-2"></i> Informasi
              </div>
              <i class="fas fa-chevron-down text-muted icon-sm"></i>
            </div>
            <div id="infoCollapse" class="collapse">
              <div class="mt-2 pt-2 border-top small text-muted">
                <ul class="mb-2 pl-3 text-justify">
                  <li>Halaman ini menampilkan rekaman ASN yang tidak melakukan presensi (Alpha/Lupa).</li>
                  <li>Data yang ditampilkan diperbarui secara berkala (tidak realtime).</li>
                  <li><strong>Kode:</strong> LAD (Lupa Absen Datang), LAP (Lupa Absen Pulang), LA (Lupa Absen Total).</li>
                </ul>
              </div>
            </div>
          </div>
        </div>

        <div class="card-sultan p-3 mb-3">
            <div class="d-flex-gap align-items-center">
                <button type="button" class="btn border-tegas shadow-sm bg-white" onclick="initFilters(true)" title="Reset Filter">
                   <i class="fas fa-sync-alt text-maroon"></i>
                </button>

                <select id="filterTahun" class="form-control form-control-sultan input-auto-width min-w-100"><option value="">- Tahun -</option></select>
                <select id="filterBulan" class="form-control form-control-sultan input-auto-width min-w-120"><option value="">- Bulan -</option></select>
                <select id="filterUnit" class="form-control form-control-sultan input-auto-width min-w-250" disabled>
                    <option value="">- Tunggu Data -</option>
                </select>

                <div class="divider-vertical"></div>

                <button type="button" id="btnCari" class="btn btn-maroon shadow-sm" onclick="fetchDataTidak()" title="Muat Data">
                    <i class="fas fa-search text-white"></i>
                </button>
            </div>
        </div>

        <div class="card-sultan">
            <div class="card-body p-3">
              <table id="tabelTidak" class="table table-bordered table-hover table-premium table-sultan-compact mb-0 w-100" width="100%">
                <thead id="headTabel" style="display:none;"></thead>
                <tbody id="bodyTabel">
                    <tr>
                        <td class="text-center td-spinner" colspan="100%">
                            <div class="sultan-loading-container">
                                <i class="fas fa-spinner fa-spin fa-3x text-maroon mb-3"></i>
                                <h6 class="text-muted font-weight-bold">Menyiapkan tabel...</h6>
                            </div>
                        </td>
                    </tr>
                </tbody>
              </table>
            </div>
        </div>

      </div>
    </div>
  </div>
</section>

<script>
    var GLOBAL_MASTER_DATA = []; 
    var GLOBAL_HEADERS = [];
    var CACHED_TH = "";
    var CACHED_BL = "";

    $(document).ready(function() {
        initFilters();
    });

    // --- 1. FILTER ---
    function initFilters(isRefresh = false) {
        if(isRefresh) Sultan.notif.loading(); // Use Core

        google.script.run.withSuccessHandler(function(res) {
            if(isRefresh) Sultan.notif.tutup();
            var data = JSON.parse(res);
            
            var elThn = $('#filterTahun').empty().append('<option value="">- Tahun -</option>');
            if(data.years) data.years.forEach(y => elThn.append(`<option value="${y}">${y}</option>`));
            var elBln = $('#filterBulan').empty().append('<option value="">- Bulan -</option>');
            if(data.months) data.months.forEach(m => elBln.append(`<option value="${m}">${m}</option>`));

            var now = new Date();
            var curYear = now.getFullYear().toString();
            var mNames = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
            var curMonth = mNames[now.getMonth()];

            if ($("#filterTahun option[value='"+curYear+"']").length > 0) $('#filterTahun').val(curYear);
            if ($("#filterBulan option[value='"+curMonth+"']").length > 0) $('#filterBulan').val(curMonth);

            loadDropdownUnit();
            
            // Auto Load setelah 0.5 detik
            if ($('#filterTahun').val() && $('#filterBulan').val()) {
                setTimeout(fetchDataTidak, 500);
            }

        }).getSiabaTidakFilters();
    }

    function loadDropdownUnit() {
        google.script.run.withSuccessHandler(function(units) {
            var el = $('#filterUnit');
            el.empty().append('<option value="SEMUA">- Semua Unit Kerja -</option>');
            if (units && units.length > 0) units.forEach(u => el.append(`<option value="${u}">${u}</option>`));
            el.prop('disabled', false);
        }).getUnitOptions(); 
    }

    // --- 2. FETCH DATA ---
    function fetchDataTidak() {
        var th = $('#filterTahun').val();
        var bl = $('#filterBulan').val();
        var unit = $('#filterUnit').val() || "SEMUA";

        if (!th || !bl) return;

        // Cache Check
        if (th === CACHED_TH && bl === CACHED_BL && GLOBAL_MASTER_DATA.length > 0) {
            filterLocalData(unit);
            return; 
        }

        if ($.fn.DataTable.isDataTable('#tabelTidak')) { $('#tabelTidak').DataTable().destroy(); }
        $('#headTabel').hide();

        // UI Feedback
        $('#bodyTabel').html('<tr><td class="text-center td-spinner" colspan="100%"><i class="fas fa-spinner fa-spin fa-3x text-maroon mb-3"></i><h6 class="text-muted font-weight-bold">Mengambil data...</h6></td></tr>');
        
        // Tombol Loading (Icon Only)
        $('#btnCari').prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i>');

        google.script.run
            .withSuccessHandler(function(res) {
                var data = JSON.parse(res);
                if (data.error) {
                    $('#bodyTabel').html(`<tr><td class="text-center text-danger td-spinner font-weight-bold" colspan="100%">${data.error}</td></tr>`);
                } else {
                    GLOBAL_HEADERS = data.headers;
                    GLOBAL_MASTER_DATA = data.rows; 
                    CACHED_TH = th;
                    CACHED_BL = bl;
                    
                    filterLocalData(unit); 
                }
                // Restore Tombol
                $('#btnCari').prop('disabled', false).html('<i class="fas fa-search text-white"></i>');
            })
            .withFailureHandler(function(err) {
                $('#bodyTabel').html(`<tr><td class="text-center text-danger td-spinner" colspan="100%">Error: ${err.message}</td></tr>`);
                $('#btnCari').prop('disabled', false).html('<i class="fas fa-search text-white"></i>');
            })
            .getSiabaTidakData(th, bl, "SEMUA"); 
    }

    // --- 3. FILTER LOCAL ---
    function filterLocalData(unit) {
        var rowsToShow = GLOBAL_MASTER_DATA;
        if (unit && unit !== "SEMUA") {
            var searchUnit = String(unit).trim().toUpperCase();
            rowsToShow = GLOBAL_MASTER_DATA.filter(function(row) {
                var lastIdx = row.length - 1;
                var rowUnit = String(row[lastIdx]).trim().toUpperCase();
                return rowUnit === searchUnit;
            });
        }
        renderTable(rowsToShow);
    }

    // --- 4. RENDER TABLE ---
    function renderTable(rows) {
        if ($.fn.DataTable.isDataTable('#tabelTidak')) { $('#tabelTidak').DataTable().destroy(); }
        var tbody = $('#bodyTabel').empty();
        var thead = $('#headTabel').empty().show();

        if (!rows || rows.length === 0) {
            tbody.html(`<tr><td class="text-center td-spinner text-muted" colspan="100%"><div class="py-5"><i class="fas fa-search fa-3x mb-3 text-gray-300"></i><h6 class="font-weight-bold">Data tidak ditemukan.</h6></div></td></tr>`);
            return;
        }

        // A. HEADER (Dinamis + Rata Tengah)
        var trHead = '<tr>';
        GLOBAL_HEADERS.forEach(function(h, idx) {
            // Kolom 0 Sticky, Sisanya Tengah
            var cls = (idx === 0) ? "col-sticky-left" : "text-center"; 
            trHead += `<th class="${cls}">${h}</th>`;
        });
        trHead += '</tr>';
        thead.html(trHead);

        // B. BODY
        var html = "";
        rows.forEach(function(row, i) {
            var delay = i * 0.05; 
            html += `<tr class="tr-animasi" style="animation-delay: ${delay}s">`;
            
            // Loop kolom (skip unit hidden)
            for (var colIdx = 0; colIdx < row.length - 1; colIdx++) {
                var val = row[colIdx];
                var display = val;
                var styleClass = ""; 

                // 1. Kolom Nama (Sticky)
                if (colIdx === 0) {
                    styleClass += "col-sticky-left font-weight-bold text-dark bg-white ";
                } 
                else {
                    styleClass += "text-center "; // Rata Tengah Standar
                }
                
                // 2. Logika Isi Data
                if (val == 0 || val == "0" || val == "") {
                    display = "-";
                    // Jika bukan kolom sticky, kasih background abu
                    if(colIdx !== 0) styleClass += "bg-abu-terang ";
                } else {
                    // Jika ada angka > 0 -> Background Pink Alert
                    if (!isNaN(val) && val > 0) {
                        styleClass += "bg-pink-alert "; 
                    }
                }

                html += `<td class="${styleClass}">${display}</td>`;
            }
            html += '</tr>';
        });

        tbody.html(html);

        // C. INIT DATATABLES
        $('#tabelTidak').DataTable({
            "ordering": false,
            "pageLength": 10,
            "autoWidth": false,
            "scrollX": false, // Aman karena dibungkus table-responsive
            "language": { "url": "//cdn.datatables.net/plug-ins/1.10.25/i18n/Indonesian.json", "search": "", "searchPlaceholder": "Cari Nama/NIP..." },
            "dom": "<'row mb-2'<'col-sm-12 col-md-6'l><'col-sm-12 col-md-6'f>>" +
                   "<'row'<'col-sm-12'<'table-responsive't>>>" +
                   "<'row mt-3'<'col-sm-12 col-md-5 small text-muted'i><'col-sm-12 col-md-7'p>>"
        });
    }
</script>
