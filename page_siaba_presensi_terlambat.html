<div class="content-header pb-0">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-12">
        <h5 class="m-0 font-weight-bold">
          <i class="fas fa-clock text-maroon mr-2"></i>Rekap Terlambat (TA)
        </h5>
        <hr class="style-sultan-solid">
      </div>
    </div>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12">

        <div class="card-sultan mb-3">
          <div class="card-body py-2 px-3 border-left-dark">
            <div class="d-flex align-items-center justify-content-between cursor-pointer" 
                 data-toggle="collapse" data-target="#infoCollapse" aria-expanded="false">
              <div class="d-flex align-items-center text-maroon font-weight-bold">
                <i class="fas fa-info-circle mr-2"></i> Informasi
              </div>
              <i class="fas fa-chevron-down text-muted icon-sm"></i>
            </div>
            <div id="infoCollapse" class="collapse">
              <div class="mt-2 pt-2 border-top small text-muted">
                <ul class="mb-2 pl-3 text-justify">
                    <li>Data diurutkan berdasarkan <b>Total Menit Terlambat</b> terbanyak.</li>
                    <li>Angka yang ditampilkan adalah jumlah menit dan detik keterlambatan setiap bulan.</li>
                </ul>
              </div>
            </div>
          </div>
        </div>

        <div class="card-sultan p-3 mb-3">
            <div class="d-flex-gap align-items-center">
                <button type="button" class="btn border-tegas shadow-sm bg-white" onclick="initFilters(true)" title="Reset Filter">
                   <i class="fas fa-sync-alt text-maroon"></i>
                </button>

                <select id="filterTahun" class="form-control form-control-sultan input-auto-width min-w-100"><option value="">- Tahun -</option></select>
                <select id="filterUnit" class="form-control form-control-sultan input-auto-width min-w-250" disabled>
                    <option value="">- Tunggu Data -</option>
                </select>

                <div class="divider-vertical"></div>

                <button type="button" id="btnCari" class="btn btn-maroon shadow-sm" onclick="fetchDataTerlambat()" title="Muat Data">
                    <i class="fas fa-search text-white"></i>
                </button>
            </div>
        </div>

        <div class="card-sultan">
            <div class="card-body p-3">
              <table id="tabelTerlambat" class="table table-bordered table-hover table-premium table-sultan-compact table-header-compact mb-0 w-100">
                <thead id="headTabel">
                    <tr id="headerTopRow"></tr>
                    <tr id="headerSubRow"></tr>
                </thead>
                <tbody id="bodyTabel">
                    <tr>
                        <td class="text-center td-spinner" colspan="100%">
                            <div class="sultan-loading-container">
                                <i class="fas fa-spinner fa-spin fa-3x text-maroon mb-3"></i>
                                <h6 class="text-muted font-weight-bold">Menyiapkan tabel...</h6>
                            </div>
                        </td>
                    </tr>
                </tbody>
              </table>
            </div>
        </div>

      </div>
    </div>
  </div>
</section>

<script>
    var GLOBAL_MASTER_DATA = []; 
    var GLOBAL_HEADER_TOP = [];
    var GLOBAL_HEADER_SUB = [];
    var CACHED_TH = "";

    $(document).ready(function() {
        initFilters();
    });

    // --- 1. FILTER ---
    function initFilters(isRefresh = false) {
        if(isRefresh) Sultan.notif.loading(); // Use Core

        google.script.run.withSuccessHandler(function(res) {
            if(isRefresh) Sultan.notif.tutup();
            var data = JSON.parse(res);
            
            if (data.error) {
                console.error(data.error);
                return;
            }

            var elThn = $('#filterTahun').empty().append('<option value="">- Tahun -</option>');
            if (data.years && data.years.length > 0) {
                data.years.forEach(y => elThn.append(`<option value="${y}">${y}</option>`));
            }
            
            var curYear = new Date().getFullYear().toString();
            if ($("#filterTahun option[value='"+curYear+"']").length > 0) {
                $('#filterTahun').val(curYear);
            }

            loadDropdownUnit();
            
            if ($('#filterTahun').val()) {
                setTimeout(fetchDataTerlambat, 500);
            } else {
                $('#bodyTabel').html('<tr><td class="text-center td-spinner text-muted" colspan="100%"><i class="fas fa-calendar-times fa-3x mb-3 text-gray-300"></i><h6 class="font-weight-bold">Silakan pilih Tahun data.</h6></td></tr>');
            }

        }).getSiabaTerlambatFilters();
    }

    function loadDropdownUnit() {
        google.script.run.withSuccessHandler(function(units) {
            var el = $('#filterUnit');
            el.empty().append('<option value="SEMUA">- Semua Unit Kerja -</option>');
            if (units && units.length > 0) units.forEach(u => el.append(`<option value="${u}">${u}</option>`));
            el.prop('disabled', false);
        }).getUnitOptions(); 
    }

    // --- 2. FETCH DATA ---
    function fetchDataTerlambat() {
        var th = $('#filterTahun').val();
        var unit = $('#filterUnit').val() || "SEMUA";

        if (!th) { Sultan.notif.info('Pilih Tahun dulu.'); return; }

        if (th === CACHED_TH && GLOBAL_MASTER_DATA.length > 0) {
            filterLocalData(unit);
            return; 
        }

        if ($.fn.DataTable.isDataTable('#tabelTerlambat')) { $('#tabelTerlambat').DataTable().destroy(); }
        
        // UI Feedback
        $('#bodyTabel').html('<tr><td class="text-center td-spinner" colspan="100%"><i class="fas fa-spinner fa-spin fa-3x text-maroon mb-3"></i><h6 class="text-muted font-weight-bold">Mengambil data...</h6></td></tr>');
        $('#headerTopRow').empty(); 
        $('#headerSubRow').empty();
        $('#btnCari').prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i>');

        google.script.run
            .withSuccessHandler(function(res) {
                var data = JSON.parse(res);
                if (data.error) {
                    $('#bodyTabel').html(`<tr><td class="text-center text-danger td-spinner font-weight-bold" colspan="100%">${data.error}</td></tr>`);
                } else {
                    GLOBAL_HEADER_TOP = data.headerTop;
                    GLOBAL_HEADER_SUB = data.headerSub;
                    GLOBAL_MASTER_DATA = data.rows; 
                    CACHED_TH = th; 
                    
                    filterLocalData(unit); 
                }
                $('#btnCari').prop('disabled', false).html('<i class="fas fa-search text-white"></i>');
            })
            .withFailureHandler(function(err) {
                $('#bodyTabel').html(`<tr><td class="text-center text-danger td-spinner" colspan="100%">Error: ${err.message}</td></tr>`);
                $('#btnCari').prop('disabled', false).html('<i class="fas fa-search text-white"></i>');
            })
            .getSiabaTerlambatData(th, "SEMUA"); 
    }

    // --- 3. FILTER LOCAL ---
    function filterLocalData(unit) {
        var rowsToShow = GLOBAL_MASTER_DATA;
        if (unit && unit !== "SEMUA") {
            var searchUnit = String(unit).trim().toUpperCase();
            rowsToShow = GLOBAL_MASTER_DATA.filter(function(row) {
                var lastIdx = row.length - 1;
                var rowUnit = String(row[lastIdx]).trim().toUpperCase();
                return rowUnit === searchUnit;
            });
        }
        renderTabelBertingkat(rowsToShow);
    }

    // --- 4. RENDER TABLE (Bertingkat / Nested) ---
    function renderTabelBertingkat(rows) {
        if ($.fn.DataTable.isDataTable('#tabelTerlambat')) { $('#tabelTerlambat').DataTable().destroy(); }
        
        var headerTop = GLOBAL_HEADER_TOP; 
        var headerSub = GLOBAL_HEADER_SUB; 

        if (!rows || rows.length === 0) {
            $('#bodyTabel').html(`<tr><td class="text-center td-spinner text-muted" colspan="100%"><div class="py-5"><i class="fas fa-search fa-3x mb-3 text-gray-300"></i><h6 class="font-weight-bold">Data tidak ditemukan.</h6></div></td></tr>`);
            return;
        }

        // A. RENDER HEADER BERTINGKAT (Dynamic)
        if ($('#headerTopRow').children().length === 0) {
            var htmlTop = '';
            var htmlSub = '';

            // 1. Kolom Nama (Sticky)
            htmlTop += `<th rowspan="2" class="col-sticky-left" style="min-width:200px;">${headerTop[0] || 'Nama'}</th>`;
            // 2. Kolom NIP/Jabatan
            htmlTop += `<th rowspan="2" style="min-width:150px;">${headerTop[1] || 'NIP/Info'}</th>`;
            
            // Loop kolom Bulan
            for (let i = 2; i < headerTop.length; i++) {
                let titleTop = headerTop[i];
                let titleSub = headerSub[i];

                if (titleTop !== "" && i < headerTop.length - 1) {
                    htmlTop += `<th colspan="2" class="text-center border-bottom">${titleTop}</th>`;
                    htmlSub += `<th class="text-center small text-muted">${titleSub}</th>`;
                } else if (titleTop === "" && i > 0) {
                    htmlSub += `<th class="text-center small text-muted">${titleSub}</th>`;
                } else {
                    // Kolom TOTAL (Warna Emas/Kuning)
                    htmlTop += `<th rowspan="2" class="text-center bg-soft-warning">${titleTop}</th>`;
                }
            }
            $('#headerTopRow').html(htmlTop);
            $('#headerSubRow').html(htmlSub);
        }

        // B. RENDER BODY
        var html = "";
        rows.forEach(function(row, i) {
            var delay = i * 0.05; 
            html += `<tr class="tr-animasi" style="animation-delay: ${delay}s">`;
            
            // Loop sampai -1 (Skip Unit)
            for (var colIdx = 0; colIdx < row.length - 1; colIdx++) {
                var val = row[colIdx];
                var display = val;
                var styleClass = "text-nowrap "; 

                // 1. NAMA (Sticky)
                if (colIdx === 0) {
                    styleClass += "col-sticky-left font-weight-bold text-dark bg-white ";
                }
                // 2. NIP (Kiri, Kecil)
                else if (colIdx === 1) {
                    styleClass += "text-left small text-muted ";
                }
                // 3. ANGKA (Tengah)
                else {
                    styleClass += "text-center ";
                    if (val === 0 || val == "0" || val == "") {
                        display = "-";
                        styleClass += "bg-abu-terang ";
                    } else {
                        if (!isNaN(val) && parseInt(val) > 0) {
                            styleClass += "text-danger-bold ";
                        }
                    }
                    
                    // Kolom TOTAL (Diberi Background Kuning)
                    if (colIdx === row.length - 2) {
                        styleClass += " bg-soft-warning font-weight-bold text-dark ";
                    }
                }
                html += `<td class="${styleClass}">${display}</td>`;
            }
            html += '</tr>';
        });

        $('#bodyTabel').html(html);

        // C. INIT DATATABLE
        $('#tabelTerlambat').DataTable({
            "ordering": false,
            "pageLength": 10,
            "autoWidth": false,
            "scrollX": false,
            "language": { "url": "//cdn.datatables.net/plug-ins/1.10.25/i18n/Indonesian.json", "search": "", "searchPlaceholder": "Cari Nama/NIP..." },
            "dom": "<'row mb-2'<'col-sm-12 col-md-6'l><'col-sm-12 col-md-6'f>>" +
                   "<'row'<'col-sm-12'<'table-responsive't>>>" +
                   "<'row mt-3'<'col-sm-12 col-md-5 small text-muted'i><'col-sm-12 col-md-7'p>>"
        });
    }
</script>
