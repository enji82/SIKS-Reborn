<script>
// ==========================================================================
// SULTAN CORE LIBRARY (THE BRAIN)
// Load file ini di setiap halaman dengan <?!= include('js_core_sultan'); ?>
// ==========================================================================

const Sultan = {
    // 1. MODUL NOTIFIKASI (TOAST)
    notif: {
        sukses: function(pesan) {
            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: pesan, showConfirmButton: false, timer: 3000 });
        },
        gagal: function(pesan) {
            Swal.fire({ toast: true, position: 'top-end', icon: 'error', title: pesan, showConfirmButton: false, timer: 3000 });
        },
        info: function(pesan) {
            Swal.fire({ toast: true, position: 'top-end', icon: 'info', title: pesan, showConfirmButton: false, timer: 3000 });
        },
        loading: function(judul = 'Memuat...') {
            Swal.fire({ title: judul, allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
        },
        tutup: function() {
            Swal.close();
        }
    },

    // 2. MODUL KONFIRMASI (DIALOG AMAN)
    // Cara Pakai: Sultan.konfirmasi({judul: '...'}, () => { fungsiHapus() });
    konfirmasi: function(opsi, callbackYa) {
        Swal.fire({
            title: opsi.judul || 'Apakah Anda Yakin?',
            text: opsi.teks || "Data yang dihapus tidak dapat dikembalikan!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33', // Merah bahaya
            cancelButtonColor: '#3085d6', // Biru netral
            confirmButtonText: opsi.btnYa || 'Ya, Lanjutkan!',
            cancelButtonText: opsi.btnBatal || 'Batal'
        }).then((result) => {
            if (result.isConfirmed) {
                callbackYa(); // Jalankan fungsi hanya jika user klik YA
            }
        });
    },

    // 3. MODUL HELPER FORMAT
    format: {
        // Mengubah 0/null jadi strip (-)
        strip: function(val) {
            return (!val || val == "0" || val == "") ? "-" : val;
        },
        // Format Rupiah
        rupiah: function(angka) {
            return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", minimumFractionDigits: 0 }).format(angka);
        },
        // Format Tanggal Indo
        tanggal: function(dateStr) {
            if(!dateStr) return "-";
            var d = new Date(dateStr);
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        }
    }
};
</script>
