<div class="login-screen-wrapper">
  <style>
    /* ========================================================= */
    /* PREMIUM LOGIN – REBORN (FIXED NOTIFICATION)               */
    /* ========================================================= */

    :root{
      --maroon-main: #800000;
      --maroon-dark: #4a0404;
      --gold-accent: #FFD700;
      --text-dark: #2b2b2b;
    }

    .login-screen-wrapper{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      /* Background Image Premium */
      background:
        linear-gradient(135deg, rgba(74,4,4,0.92), rgba(20,0,0,0.95)),
        url("https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=1000&auto=format&fit=crop");
      background-size:cover;
      background-position:center;
      z-index:99999;
      font-family:'Segoe UI', 'Inter', sans-serif;
    }

    .login-box{
      width:400px;
      max-width:90%;
      animation: fadeInDown 0.8s ease;
    }

    .card-maroon{
      background:rgba(255,255,255,0.98);
      border-radius:20px;
      overflow:hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,.6);
      border-top: 6px solid var(--gold-accent);
    }

    /* HEADER SULTAN (MAROON & EMAS) */
    .card-header-sultan {
      background: var(--maroon-main);
      padding: 35px 20px 25px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .card-header-sultan h2{
      margin: 10px 0 5px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
      font-size: 28px;
    }

    .login-card-body{
      padding: 30px;
    }

    .input-group{
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
      border: 1px solid #eee;
      overflow: hidden;
      transition: 0.3s;
    }
    
    .input-group:focus-within {
        border-color: var(--maroon-main);
        box-shadow: 0 4px 12px rgba(128,0,0,.15);
    }

    .form-control{
      height: 48px;
      border: none;
      padding-left: 15px;
      font-size: 16px;
      background: #fff;
    }

    .form-control:focus{
      box-shadow: none;
      background: #fff;
    }

    .input-group-text{
      background: #fff;
      border: none;
      color: var(--maroon-main);
      padding: 0 15px;
      font-size: 16px;
      cursor: pointer;
    }

    /* --- NOTIFIKASI ERROR (HIGH CONTRAST) --- */
    #loginNotif{
      background-color: var(--maroon-main); /* Background Merah Maroon */
      color: var(--gold-accent);           /* Teks Kuning Emas */
      border: 1px solid var(--gold-accent);
      border-left: 5px solid var(--gold-accent);
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none; /* Default Sembunyi */
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    #loginNotif i { color: var(--gold-accent); }

    .btn-login{
      height: 50px;
      border-radius: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--maroon-main), var(--maroon-dark));
      border: none;
      box-shadow: 0 8px 20px rgba(128,0,0,.3);
      transition: 0.3s ease;
      font-size: 16px;
    }

    .btn-login:hover{
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(128,0,0,.5);
    }
    
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }

    .login-footer{
      text-align: center;
      font-size: 11px;
      color: #999;
      margin-top: 25px;
    }

    @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-30px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    /* Animasi Getar untuk Error */
    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(3px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }
    .shake-anim { animation: shake 0.5s; animation-iteration-count: 1; }
  </style>

  <div class="login-box">
    <div class="card card-maroon">
      <div class="card-header-sultan">
        <i class="fas fa-shapes fa-3x mb-2 text-white"></i>
        <h2 class="text-white font-weight-bold">SIKS-REBORN</h2>
        <p style="color: var(--gold-accent) !important; font-weight: 500; font-size: 13px; margin: 0;">
            Sistem Informasi Korwil Secang<br>Ruang Edukasi & Layanan Online Terintegrasi
        </p>
      </div>

      <div class="card-body login-card-body">
        
        <div id="loginNotif" class="alert py-2 px-3">
          <div class="d-flex align-items-center">
             <i class="fas fa-exclamation-triangle mr-2"></i>
             <span id="loginNotifMsg">Login Gagal</span>
          </div>
        </div>

        <form id="formLogin" onsubmit="handleLoginV2(event)">
          <div class="form-group mb-3">
              <div class="input-group">
                <input type="text" id="username" name="username" class="form-control" placeholder="Username / NPSN" required autocomplete="off">
                <div class="input-group-append">
                  <span class="input-group-text"><i class="fas fa-user"></i></span>
                </div>
              </div>
          </div>

          <div class="form-group mb-4">
              <div class="input-group">
                <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
                <div class="input-group-append">
                  <span class="input-group-text" onclick="togglePassword()" title="Lihat Password" style="cursor:pointer;">
                    <i class="fas fa-eye" id="iconPass"></i>
                  </span>
                </div>
              </div>
          </div>

          <button type="submit" id="tombolLogin" class="btn btn-login btn-block text-white">
            MASUK
          </button>
        </form>

        <div class="login-footer">
          &copy; 2026 Korwil Disdikbud Kecamatan Secang<br>
          v1.0
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // 1. FITUR TOGGLE PASSWORD
  function togglePassword() {
    var x = document.getElementById("password");
    var icon = document.getElementById("iconPass");
    if (x.type === "password") {
      x.type = "text";
      icon.classList.remove("fa-eye");
      icon.classList.add("fa-eye-slash");
    } else {
      x.type = "password";
      icon.classList.remove("fa-eye-slash");
      icon.classList.add("fa-eye");
    }
  }

  // 2. FUNGSI LOGIN (FIXED)
  function handleLoginV2(e) {
    // Mencegah form reload halaman
    e.preventDefault(); 
    
    // Ambil Elemen
    var u = $('#username').val();
    var p = $('#password').val();
    var btn = $('#tombolLogin');
    var notif = $('#loginNotif');
    var msg = $('#loginNotifMsg');

    // State Loading
    notif.hide(); 
    btn.prop('disabled', true).html('<i class="fas fa-circle-notch fa-spin mr-2"></i> MEMERIKSA...');

    // Panggil Server
    google.script.run
      .withSuccessHandler(function(res) {
        // Cek Respon dari Server
        if (res && res.status === 'success') {
          // --- KONDISI BERHASIL ---
          
          // 1. SIMPAN DATA KE LOCALSTORAGE (INI FIX UTAMANYA!) 
          // Kita simpan objek user (termasuk nama_lengkap) ke browser
          if (res.userData) {
             localStorage.setItem("siksUser", JSON.stringify(res.userData));
          }

          // 2. Ubah Tampilan Tombol
          btn.removeClass('btn-login').addClass('btn-success');
          btn.html('<i class="fas fa-check mr-2"></i> BERHASIL MASUK');
          
          // 3. Redirect setelah 1 detik
          setTimeout(function(){
            google.script.host.editor.focus();
            window.top.location.reload(); 
          }, 1000);

        } else {
          // --- KONDISI GAGAL (Username/Pass Salah) ---
          btn.prop('disabled', false).html('MASUK');
          
          // Tampilkan Pesan Error
          var pesan = (res && res.message) ? res.message : "Gagal Login (Unknown Error)";
          msg.text(pesan);
          notif.slideDown(); // Paksa muncul
          
          // Animasi Getar
          $('.login-box').addClass('shake-anim');
          setTimeout(function(){ $('.login-box').removeClass('shake-anim') }, 500);
        }
      })
      .withFailureHandler(function(err) {
        // --- KONDISI ERROR KONEKSI/SERVER ---
        btn.prop('disabled', false).html('MASUK');
        msg.text("Koneksi Server Terputus: " + err.message);
        notif.slideDown();
      })
      .processLogin({username: u, password: p}); // Kirim sebagai Objek
  }
</script>
