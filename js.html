<script>
/* ============================================================
   BUILDER MENU ADMIN – TRASH SK
   ============================================================ */

function bangunMenuAdmin() {
    var percobaan = 0;

    var interval = setInterval(function () {
        percobaan++;

        var slot = document.getElementById("slotMenuAdmin");
        if (!slot) {
            if (percobaan > 20) clearInterval(interval);
            return;
        }

        clearInterval(interval);

        var raw = localStorage.getItem("siksUser");
        if (!raw || raw === "null") return;

        var user;
        try {
            user = JSON.parse(raw);
        } catch (e) {
            return;
        }

        var isAdmin = (user.role === "Admin" || user.role === "Super Admin");

        if (isAdmin) {
            slot.innerHTML = `
                <a href="#" class="nav-link" data-page="page_sk_trash">
                    <i class="nav-icon fas fa-trash-restore text-danger"></i>
                    <p>Trash SK</p>
                </a>
            `;
            slot.style.display = "block";
        } else {
            slot.innerHTML = "";
            slot.style.display = "none";
        }

    }, 300);
}
</script>
