<script>
/* ============================================================
   BUILDER MENU ADMIN – TRASH SK (FINAL & FIXED)
   Aman untuk sidebar dinamis (GAS SPA)
   ============================================================ */

function bangunMenuAdmin() {

    var percobaan = 0;

    var cekSlot = setInterval(function () {
        percobaan++;

        var slot = document.getElementById("slotMenuAdmin");
        if (!slot) {
            if (percobaan > 20) clearInterval(cekSlot);
            return;
        }

        clearInterval(cekSlot); // slot sudah ada, hentikan interval

        // Ambil sesi login
        var sesi = localStorage.getItem("siksUser");
        var isAdmin = false;

        if (sesi) {
            try {
                var user = JSON.parse(sesi);
                if (user.role === "Admin" || user.role === "Super Admin") {
                    isAdmin = true;
                }
            } catch (e) {
                console.warn("Role user tidak terbaca");
            }
        }

        // TAMPILKAN MENU JIKA ADMIN
        if (isAdmin) {
            slot.innerHTML = `
                <a href="#" class="nav-link" data-page="page_sk_trash">
                    <i class="nav-icon fas fa-trash-restore text-danger"></i>
                    <p>Trash SK</p>
                </a>
            `;
            slot.style.display = "block";
        } else {
            slot.innerHTML = "";
            slot.style.display = "none";
        }

    }, 300);
}
</script>
