<div class="content-header pb-0">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-12">
        <h5 class="m-0 font-weight-bold">
          <i class="fas fa-praying-hands text-maroon mr-2"></i>Jumlah Murid SD Menurut Agama
        </h5>
        <hr class="style-sultan-solid">
      </div>
    </div>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12">

        <div class="card-sultan mb-3">
          <div class="card-body py-2 px-3 border-left-dark">
            <div class="d-flex align-items-center justify-content-between cursor-pointer" 
                 data-toggle="collapse" data-target="#infoCollapse" aria-expanded="false">
              <div class="d-flex align-items-center text-maroon font-weight-bold">
                <i class="fas fa-info-circle mr-2"></i> Informasi
              </div>
              <i class="fas fa-chevron-down text-muted icon-sm"></i>
            </div>
            <div id="infoCollapse" class="collapse">
              <div class="mt-2 pt-2 border-top small text-muted">
                <ul class="mb-0 pl-3">
                  <li class="mb-1">Data bersumber dari Laporan Bulan terakhir.</li>
                  <li class="mb-1">Tabel mencakup 6 Agama: Islam, Kristen, Katolik, Hindu, Buddha, Konghucu.</li>
                  <li>Gunakan <b>Filter Tampilan</b> untuk berpindah antar Kelas atau melihat Rekap Total.</li>
                </ul>
              </div>
            </div>
          </div>
        </div>

        <div class="card-sultan p-3 mb-3">
            <div class="d-flex-gap align-items-center flex-wrap">
                <button type="button" class="btn border-tegas shadow-sm bg-white" onclick="loadMuridSDAgama()" title="Refresh Data">
                   <i class="fas fa-sync-alt text-maroon"></i>
                </button>

                <select id="filterViewKelas" class="form-control form-control-sultan input-auto-width font-weight-bold text-maroon" onchange="updateTableVisibility()" style="min-width: 150px;">
                    <option value="TOT" selected>Rekapitulasi Total</option>
                    <option value="K1">Kelas 1</option>
                    <option value="K2">Kelas 2</option>
                    <option value="K3">Kelas 3</option>
                    <option value="K4">Kelas 4</option>
                    <option value="K5">Kelas 5</option>
                    <option value="K6">Kelas 6</option>
                </select>

                <select id="filterStatus" class="form-control form-control-sultan input-auto-width" onchange="updateFilterUnit()">
                    <option value="SEMUA">- Semua Status -</option>
                </select>

                <select id="filterUnit" class="form-control form-control-sultan input-auto-width max-w-250">
                    <option value="SEMUA">- Semua Unit Kerja -</option>
                </select>

                <div class="divider-vertical"></div>

                <button type="button" id="btnCari" class="btn btn-maroon shadow-sm" onclick="filterTampilan()" title="Terapkan Filter">
                    <i class="fas fa-search text-white"></i>
                </button>
            </div>
        </div>

        <div class="card-sultan w-100 overflow-hidden">
          <div class="card-body p-0 w-100">
            <div class="table-responsive" style="overflow-x: auto; max-height: 70vh; position: relative;">
              <table class="table table-bordered table-hover table-sm text-nowrap mb-0 text-center" style="width:100%; font-size: 0.7rem;">
                
                <thead id="headData" class="font-weight-bold text-dark" style="display:none;">
                  </thead>

                <tbody id="bodyData">
                    <tr><td class="text-center td-spinner" colspan="100%"><div class="sultan-loading-container"><i class="fas fa-spinner fa-spin fa-3x text-maroon mb-3"></i><h6 class="text-muted font-weight-bold">Menyiapkan data...</h6></div></td></tr>
                </tbody>

                <tfoot id="footData" class="bg-light font-weight-bold" style="border-top: 3px solid #800000; display:none;"></tfoot>
              </table>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>

<script>
var RAW_DATA_SD_AGAMA = [];

$(document).ready(function() {
    generateHeaderAgama(); // Generate Header saat Load
    loadMuridSDAgama();
});

// --- GENERATOR HEADER (AGAR RAPI & DINAMIS) ---
function generateHeaderAgama() {
    var h1 = '<tr>'; // Baris 1: Static + Kelas Label
    var h2 = '<tr>'; // Baris 2: Agama Label
    var h3 = '<tr>'; // Baris 3: L/P/Jml

    // 1. Static Columns (Rowspan 3)
    var staticCols = ['Unit Kerja', 'NPSN', 'Status', 'Bln', 'Thn', 'Rombel'];
    staticCols.forEach((c, idx) => {
        var w = (idx===0) ? 'min-width:200px;' : '';
        h1 += `<th rowspan="3" class="align-middle bg-white text-maroon pl-3" 
                style="position:sticky; left:0; z-index:50; ${w} border-right: 2px solid #dee2e6; border-bottom: 2px solid #800000 !important;">${c}</th>`;
    });

    // 2. Data Columns (Kelas 1-6 & Total)
    // Structure: [KodeView, Label, Warna]
    var groups = [
        ['K1', 'KELAS 1', '#e3f2fd'],
        ['K2', 'KELAS 2', '#e8f5e9'],
        ['K3', 'KELAS 3', '#fff3e0'],
        ['K4', 'KELAS 4', '#f3e5f5'],
        ['K5', 'KELAS 5', '#fce4ec'],
        ['K6', 'KELAS 6', '#e0f2f1'],
        ['TOT', 'JUMLAH TOTAL', '#ffecb3']
    ];

    var agamas = ['Islam', 'Kristen', 'Katolik', 'Hindu', 'Buddha', 'Konghucu'];

    groups.forEach((g) => {
        var code = g[0];
        var label = g[1];
        var color = g[2];
        var borderLeft = (code === 'TOT') ? 'border-left: 2px solid #ffecb3;' : '';

        // Row 1: Kelas Label (Colspan 18: 6 Agama x 3 Gender)
        h1 += `<th colspan="18" class="view-${code} align-middle" style="background-color:${color}; border-bottom:1px solid #90caf9; ${borderLeft}">${label}</th>`;

        // Row 2: Agama Labels (Loop 6 Agama)
        agamas.forEach((a, idx) => {
            var bl = (code === 'TOT' && idx === 0) ? 'border-left: 2px solid #ffecb3;' : '';
            h2 += `<th colspan="3" class="view-${code} align-middle" style="background-color:${color}; border-bottom:1px solid #ccc; ${bl}">${a}</th>`;
            
            // Row 3: L/P/Jml (Loop 3 Gender)
            h3 += `<th class="view-${code}" style="background-color:${color}; border-bottom:2px solid #800000 !important; ${bl}">L</th>`;
            h3 += `<th class="view-${code}" style="background-color:${color}; border-bottom:2px solid #800000 !important;">P</th>`;
            h3 += `<th class="view-${code}" style="background-color:${color}; border-bottom:2px solid #800000 !important; font-weight:bold;">Jml</th>`;
        });
    });

    h1 += '</tr>';
    h2 += '</tr>';
    h3 += '</tr>';

    $('#headData').html(h1 + h2 + h3);
}

function loadMuridSDAgama() {
    $('#headData').hide(); $('#footData').hide();
    $('#bodyData').html('<tr><td class="text-center td-spinner" colspan="100%"><div class="sultan-loading-container"><i class="fas fa-spinner fa-spin fa-3x text-maroon mb-3"></i><h6 class="text-muted font-weight-bold">Mengambil data server...</h6></div></td></tr>');
    $('#btnCari').prop('disabled', true);

    google.script.run
        .withSuccessHandler(function(data) {
            $('#btnCari').prop('disabled', false);
            RAW_DATA_SD_AGAMA = data || [];
            populateFilterFromData();
            filterTampilan(); 
        })
        .withFailureHandler(function(err) {
            $('#btnCari').prop('disabled', false);
            $('#bodyData').html(`<tr><td class="text-center text-danger p-5 font-weight-bold" colspan="100%"><i class="fas fa-exclamation-triangle mr-2"></i>Error: ${err.message}</td></tr>`);
        })
        .getDataMuridSDAgama();
}

function populateFilterFromData() {
    var uniqueStatus = new Set();
    RAW_DATA_SD_AGAMA.forEach(row => {
        var s = row[2] ? String(row[2]).trim() : ""; 
        if(s) uniqueStatus.add(s);
    });
    var sortedStatus = Array.from(uniqueStatus).sort();
    var sHtml = '<option value="SEMUA">- Semua Status -</option>';
    sortedStatus.forEach(s => sHtml += `<option value="${s}">${s}</option>`);
    $('#filterStatus').html(sHtml);
    updateFilterUnit();
}

function updateFilterUnit() {
    var selectedStatus = $('#filterStatus').val();
    var uniqueUnit = new Set();
    RAW_DATA_SD_AGAMA.forEach(row => {
        var rUnit = row[0]; var rStatus = row[2]; 
        if (selectedStatus === "SEMUA" || rStatus === selectedStatus) {
            if(rUnit) uniqueUnit.add(rUnit);
        }
    });
    var sortedUnit = Array.from(uniqueUnit).sort();
    var uHtml = '<option value="SEMUA">- Semua Unit Kerja -</option>';
    sortedUnit.forEach(u => uHtml += `<option value="${u}">${u}</option>`);
    $('#filterUnit').html(uHtml);
}

function filterTampilan() {
    var fStatus = $('#filterStatus').val();
    var fUnit = $('#filterUnit').val();
    var filteredData = RAW_DATA_SD_AGAMA.filter(row => {
        var passStatus = (fStatus === "SEMUA" || row[2] === fStatus);
        var passUnit = (fUnit === "SEMUA" || row[0] === fUnit);
        return passStatus && passUnit;
    });
    renderTable(filteredData);
    
    // Default View: TOT (Rekapitulasi)
    updateTableVisibility(); 
}

function updateTableVisibility() {
    var mode = $('#filterViewKelas').val(); // K1, K2... TOT
    
    // 1. Sembunyikan Semua Kolom View
    $('[class*="view-"]').hide();
    
    // 2. Tampilkan yang dipilih
    $('.view-' + mode).show();
    
    // 3. Pastikan Static Cols selalu muncul (sudah default, tapi just in case)
    // Tidak perlu code khusus karena static cols tidak punya class view-xxx
}

// --- COLOR HELPER (PASTEL) ---
function getColColor(i) {
    if (i >= 6 && i <= 23) return "#e3f2fd"; // K1
    if (i >= 24 && i <= 41) return "#e8f5e9"; // K2
    if (i >= 42 && i <= 59) return "#fff3e0"; // K3
    if (i >= 60 && i <= 77) return "#f3e5f5"; // K4
    if (i >= 78 && i <= 95) return "#fce4ec"; // K5
    if (i >= 96 && i <= 113) return "#e0f2f1"; // K6
    if (i >= 114) return "#ffecb3"; // TOT
    return "#ffffff";
}

function renderTable(data) {
    var tbody = $('#bodyData');
    var tfoot = $('#footData');
    
    tbody.empty(); tfoot.empty();

    if (data.length === 0) {
        $('#headData').show();
        tbody.html('<tr><td class="text-center p-5 text-muted" colspan="100%">Data tidak ditemukan.</td></tr>');
        return;
    }

    var $tbl = $('#bodyData').parent('table');
    $tbl.css({ 'border-right': 'none', 'border-left': 'none', 'border-top': 'none', 'border-bottom': 'none' });

    // 132 Columns
    var colTotals = new Array(132).fill(0); 

    var html = "";
    data.forEach(function(row) {
        html += '<tr class="tr-animasi">';
        // STATIC (0-5)
        html += `<td class="font-weight-bold bg-white text-dark text-left pl-3 align-middle" 
                     style="position:sticky; left:0; z-index:40; border-right: 2px solid #dee2e6;">${row[0] || '-'}</td>`;
        html += `<td class="text-center align-middle">${row[1] || '-'}</td>`;
        html += `<td class="text-center align-middle font-weight-bold text-maroon">${row[2] || '-'}</td>`;
        html += `<td class="text-center align-middle">${row[3] || '-'}</td>`;
        html += `<td class="text-center align-middle">${row[4] || '-'}</td>`;
        html += `<td class="text-center align-middle font-weight-bold">${row[5] || '0'}</td>`;

        // LOOP DATA (6 s.d 131)
        for (var i = 6; i <= 131; i++) {
            var val = parseInt(row[i]) || 0;
            colTotals[i] += val; 
            var display = (val === 0) ? '<span class="text-black-50" style="opacity:0.2">-</span>' : val;
            var weight = (val > 0) ? 'font-weight-bold text-dark' : '';
            var bgColor = getColColor(i);
            
            // Assign View Class
            var viewClass = "";
            if (i >= 6 && i <= 23) viewClass = "view-K1";
            else if (i >= 24 && i <= 41) viewClass = "view-K2";
            else if (i >= 42 && i <= 59) viewClass = "view-K3";
            else if (i >= 60 && i <= 77) viewClass = "view-K4";
            else if (i >= 78 && i <= 95) viewClass = "view-K5";
            else if (i >= 96 && i <= 113) viewClass = "view-K6";
            else if (i >= 114) viewClass = "view-TOT";

            var style = `background-color: ${bgColor};`;
            if (i === 114) style += 'border-left: 2px solid #ffecb3;'; 

            html += `<td class="${viewClass} text-center align-middle ${weight}" style="${style}">${display}</td>`;
        }
        html += '</tr>';
    });

    tbody.html(html);

    // --- FOOTER ---
    var footHtml = '<tr>';
    footHtml += `<td class="bg-light text-maroon text-right font-weight-bold pr-3 align-middle" style="position:sticky; left:0; z-index:40; border-right: 2px solid #dee2e6;">TOTAL</td>`;
    footHtml += `<td class="bg-light"></td><td class="bg-light"></td><td class="bg-light"></td><td class="bg-light"></td><td class="bg-light"></td>`;

    for (var i = 6; i <= 131; i++) {
        var val = colTotals[i];
        var bgColor = getColColor(i);
        
        var viewClass = "";
        if (i >= 6 && i <= 23) viewClass = "view-K1";
        else if (i >= 24 && i <= 41) viewClass = "view-K2";
        else if (i >= 42 && i <= 59) viewClass = "view-K3";
        else if (i >= 60 && i <= 77) viewClass = "view-K4";
        else if (i >= 78 && i <= 95) viewClass = "view-K5";
        else if (i >= 96 && i <= 113) viewClass = "view-K6";
        else if (i >= 114) viewClass = "view-TOT";

        var style = `background-color: ${bgColor};`;
        if (i === 114) style += 'border-left: 2px solid #ffecb3;'; 

        footHtml += `<td class="${viewClass} text-center align-middle font-weight-bold text-maroon" style="${style}">${val}</td>`;
    }
    footHtml += '</tr>';
    tfoot.html(footHtml);

    $('#headData').show(); tfoot.show();
    updateTableVisibility();
}
</script>
