<div class="content-header pb-0">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-12">
        <h5 class="m-0 font-weight-bold">
          <i class="fas fa-calendar-alt text-maroon mr-2"></i>Rekap Presensi Harian
        </h5>
        <hr class="style-sultan-solid">
      </div>
    </div>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12">

        <div class="card-sultan mb-3">
          <div class="card-body py-2 px-3 border-left-dark">
            
            <div class="d-flex align-items-center justify-content-between" data-toggle="collapse" data-target="#infoCollapse" aria-expanded="false" style="cursor:pointer;">
              <div class="d-flex align-items-center text-maroon font-weight-bold">
                <i class="fas fa-info-circle mr-2"></i> Informasi
              </div>
              <i class="fas fa-chevron-down text-muted" style="font-size: 12px;"></i>
            </div>

            <div id="infoCollapse" class="collapse">
              <div class="mt-2 pt-2 border-top">
                <ul class="mb-0 pl-3 text-muted" style="font-size: 13px;">
                  <li class="mb-1">Halaman ini menampilkan rekaman presensi harian ASN pada aplikasi Siaba.</li>
                  <li>Data yang ditampilkan tidak up to date, tetapi diperbarui pada jangka waktu tertentu.</li>
                </ul>
              </div>
            </div>

          </div>
        </div>

        <div class="card-sultan p-3 mb-3">
            <div class="d-flex-gap align-items-center">
                <button type="button" class="btn border-tegas shadow-sm bg-white" onclick="initFilters(true)" title="Reset Filter">
                   <i class="fas fa-sync-alt text-maroon"></i>
                </button>
                <select id="filterTahun" class="form-control form-control-sultan input-auto-width" style="min-width: 100px;"></select>
                <select id="filterBulan" class="form-control form-control-sultan input-auto-width" style="min-width: 120px;">
                    <option value="">- Bulan -</option>
                </select>
                <select id="filterUnit" class="form-control form-control-sultan input-auto-width" style="min-width: 250px;" disabled>
                    <option value="">- Tunggu Data -</option>
                </select>
                <div class="border-left mx-2" style="height: 25px; border-color: #ccc;"></div>
                <button type="button" id="btnCari" class="btn btn-maroon shadow-sm" onclick="fetchDataPresensi()" title="Muat Data">
                    <i class="fas fa-search text-white"></i>
                </button>
            </div>
        </div>

        <div class="card-sultan">
            <div class="card-body p-3">
              
              <table id="tabelPresensi" class="table table-bordered table-hover table-premium table-sultan-compact table-sticky mb-0 w-100">
                <thead id="headTabel">
                    </thead>
                <tbody id="bodyTabel">
                    <tr>
                        <td class="text-center p-5" colspan="100%">
                            <i class="fas fa-spinner fa-spin fa-3x text-maroon mb-3"></i>
                            <h6 class="text-muted font-weight-bold">Sedang memuat data...</h6>
                        </td>
                    </tr>
                </tbody>
              </table>

            </div>
        </div>

      </div>
    </div>
  </div>
</section>

<style>
    /* 1. KOLOM 2 S.D TERAKHIR: RATA TENGAH */
    #tabelPresensi th:not(:first-child),
    #tabelPresensi td:not(:first-child) {
        text-align: center !important;
        vertical-align: middle !important;
    }

    /* 2. KOLOM PERTAMA (NAMA): STICKY & RATA KIRI */
    #tabelPresensi .col-sticky-left {
        text-align: left !important;
        padding-left: 15px !important;
        position: sticky !important;
        left: 0;
        border-right: 2px solid #dee2e6 !important;
        z-index: 5;
    }

    /* 3. SETTING WARNA BACKGROUND (HEADER & BODY) */
    /* Header: Abu Gelap */
    #tabelPresensi thead .col-sticky-left { 
        background-color: #343a40 !important; 
        color: #ffffff !important;
        z-index: 6; 
    }
    /* Body Normal: Putih */
    #tabelPresensi tbody .col-sticky-left { 
        background-color: #ffffff !important; 
    }

    /* --- [FIX HOVER: DISAMAKAN WARNANYA] --- */
    /* Tentukan satu warna hover (misal #e2e6ea) dan terapkan ke KEDUANYA */
    
    /* A. Hover untuk Baris Biasa */
    #tabelPresensi.table-hover tbody tr:hover {
        background-color: #e2e6ea !important;
    }
    /* B. Hover untuk Baris Biasa (memastikan sel ikut berubah) */
    #tabelPresensi.table-hover tbody tr:hover td {
        background-color: #e2e6ea !important;
    }
    /* C. Hover untuk Kolom Sticky (Menimpa warna putih) */
    #tabelPresensi.table-hover tbody tr:hover .col-sticky-left {
        background-color: #e2e6ea !important; 
    }

    /* 5. UTILITY WARNA & ANIMASI */
    .bg-pink-alert { background-color: #ffe6e6 !important; color: #dc3545 !important; font-weight: bold; }
    .bg-grey-soft  { background-color: #f8f9fa !important; color: #adb5bd !important; }
    .text-green-soft { color: #28a745 !important; font-weight: bold; }
    .text-blue-soft  { color: #17a2b8 !important; font-weight: bold; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .tr-animasi { animation: fadeInUp 0.5s ease-out forwards; opacity: 0; }
</style>

<script>
    var GLOBAL_MASTER_DATA = []; 
    var GLOBAL_HEADERS = [];
    var CACHED_TH = "";
    var CACHED_BL = "";

    $(document).ready(function() {
        initFilters();
    });

    function initFilters(isRefresh = false) {
        if(isRefresh) Swal.fire({title: 'Memuat...', didOpen: () => { Swal.showLoading() }});

        google.script.run.withSuccessHandler(function(res) {
            if(isRefresh) Swal.close();
            var data = JSON.parse(res);
            
            var elThn = $('#filterTahun').empty().append('<option value="">- Tahun -</option>');
            data.years.forEach(y => elThn.append(`<option value="${y}">${y}</option>`));
            
            var elBln = $('#filterBulan').empty().append('<option value="">- Bulan -</option>');
            data.months.forEach(m => elBln.append(`<option value="${m}">${m}</option>`));

            var now = new Date();
            var curYear = now.getFullYear().toString();
            var mNames = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
            var curMonth = mNames[now.getMonth()];

            if ($("#filterTahun option[value='"+curYear+"']").length > 0) $('#filterTahun').val(curYear);
            if ($("#filterBulan option[value='"+curMonth+"']").length > 0) $('#filterBulan').val(curMonth);

            loadDropdownUnit();
            setTimeout(fetchDataPresensi, 500);

        }).getSiabaFilters();
    }

    function loadDropdownUnit() {
        google.script.run.withSuccessHandler(function(units) {
            var el = $('#filterUnit');
            el.empty().append('<option value="SEMUA">- Semua Unit Kerja -</option>');
            units.forEach(u => el.append(`<option value="${u}">${u}</option>`));
            el.prop('disabled', false);
        }).getUnitOptions();
    }

    function fetchDataPresensi() {
        var th = $('#filterTahun').val();
        var bl = $('#filterBulan').val();
        var unit = $('#filterUnit').val() || "SEMUA";

        if (!th || !bl) return;

        // CEK CACHE
        if (th === CACHED_TH && bl === CACHED_BL && GLOBAL_MASTER_DATA.length > 0) {
            filterLocalData(unit);
            return; 
        }

        // REQUEST BARU
        $('#btnCari').prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i>');
        if ($.fn.DataTable.isDataTable('#tabelPresensi')) { $('#tabelPresensi').DataTable().destroy(); }
        
        // KONSISTENSI SPINNER
        $('#bodyTabel').html('<tr><td class="text-center p-5" colspan="100%"><i class="fas fa-spinner fa-spin fa-3x text-maroon mb-3"></i><h6 class="text-muted font-weight-bold">Mengambil data...</h6></td></tr>');
        $('#headTabel').empty(); 

        google.script.run
            .withSuccessHandler(function(res) {
                var data = JSON.parse(res);
                if (data.error) {
                    $('#bodyTabel').html(`<tr><td class="text-center text-danger p-5 font-weight-bold" colspan="100%">${data.error}</td></tr>`);
                } else {
                    GLOBAL_HEADERS = data.headers;
                    GLOBAL_MASTER_DATA = data.rows; 
                    CACHED_TH = th;
                    CACHED_BL = bl;
                    filterLocalData(unit);
                }
                $('#btnCari').prop('disabled', false).html('<i class="fas fa-search"></i>');
            })
            .withFailureHandler(function(err) {
                $('#bodyTabel').html(`<tr><td class="text-center text-danger p-5" colspan="100%">Error: ${err.message}</td></tr>`);
                $('#btnCari').prop('disabled', false).html('<i class="fas fa-search"></i>');
            })
            .getSiabaPresensiHarian(th, bl, "SEMUA");
    }

    function filterLocalData(unit) {
        var dataToShow = GLOBAL_MASTER_DATA;
        if (unit && unit !== "SEMUA") {
            var searchUnit = String(unit).trim().toLowerCase();
            dataToShow = GLOBAL_MASTER_DATA.filter(function(row) {
                var lastIdx = row.length - 1;
                var rowUnit = String(row[lastIdx]).trim().toLowerCase();
                return rowUnit === searchUnit;
            });
        }
        renderTable(dataToShow);
    }

    function renderTable(rows) {
        if ($.fn.DataTable.isDataTable('#tabelPresensi')) { $('#tabelPresensi').DataTable().destroy(); }
        var tbody = $('#bodyTabel').empty();
        var thead = $('#headTabel').empty();

        if (!rows || rows.length === 0) {
            tbody.html('<tr><td class="text-center p-5 text-muted" colspan="100%"><i class="fas fa-search fa-3x mb-3 text-gray-300"></i><br>Data tidak ditemukan.</td></tr>');
            return;
        }

        // RENDER HEADER (FIX: TAMBAHKAN CLASS 'th-main')
        var trHead = '<tr>';
        GLOBAL_HEADERS.forEach(function(h, idx) {
            var style = (idx === 0) ? 'style="min-width: 250px;"' : '';
            // Tambahkan 'th-main' agar style global masuk, dan 'col-sticky-left' untuk sticky
            var cls = (idx === 0) ? "th-main col-sticky-left" : "th-main"; 
            trHead += `<th class="${cls}" ${style}>${h}</th>`;
        });
        trHead += '</tr>';
        thead.html(trHead);

        // RENDER BODY
        var html = "";
        rows.forEach(function(row, i) {
            var delay = i * 0.05; 
            html += `<tr class="tr-animasi" style="animation-delay: ${delay}s">`;
            
            for (var colIdx = 0; colIdx < row.length - 1; colIdx++) {
                var val = row[colIdx];
                var display = val;
                var styleClass = "text-nowrap "; 

                // Kolom Sticky
                if (colIdx === 0) styleClass += "col-sticky-left font-weight-bold text-dark ";

                if (val == 0 || val == "0" || val == "") display = "-";

                // Coloring
                if (colIdx === 2 && parseInt(val) > 0) styleClass += "bg-pink-alert "; 
                if (colIdx >= 22) {
                    var strVal = String(val).toUpperCase().trim();
                    if (val === "" || val === null) styleClass += "bg-pink-alert ";
                    else if (display === "-") styleClass += "bg-grey-soft ";
                    else if (['CT','CS','CM','CAP','CB'].includes(strVal)) styleClass += "text-green-soft ";
                    else if (['DD','DL'].includes(strVal)) styleClass += "text-blue-soft ";
                    else if (['TA','PLA','LA'].includes(strVal)) styleClass += "text-danger font-weight-bold ";
                }

                html += `<td class="${styleClass}">${display}</td>`;
            }
            html += '</tr>';
        });

        tbody.html(html);

        $('#tabelPresensi').DataTable({
            "ordering": false,
            "pageLength": 10,
            "autoWidth": false,
            "language": { "url": "//cdn.datatables.net/plug-ins/1.10.25/i18n/Indonesian.json" },
            "dom": "<'row mb-2'<'col-sm-12 col-md-6'l><'col-sm-12 col-md-6'f>>" +
                   "<'row'<'col-sm-12'<'table-responsive't>>>" +
                   "<'row mt-3'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>"
        });
    }
</script>
