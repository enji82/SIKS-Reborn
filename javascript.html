<script>
/* =============================================================
   1. GLOBAL HELPER: NOTIFIKASI SULTAN & KODE LAMA
   ============================================================= */
const NotifSultan = {
  config: { warnaMaroon: '#800000', warnaHitam: '#343a40', warnaSukses: '#28a745', warnaGagal: '#dc3545', warnaWarning: '#ffc107' },
  toast: (tipe, pesan) => {
    Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true, background: '#fff', color: '#343a40' })
    .fire({ icon: tipe, title: `<span style="font-weight:600">${pesan}</span>` });
  },
  alert: (tipe, judul, pesan) => {
    let btnColor = tipe === 'success' ? NotifSultan.config.warnaMaroon : NotifSultan.config.warnaHitam;
    return Swal.fire({ icon: tipe, title: `<h5 class="font-weight-bold" style="margin-top:10px">${judul}</h5>`, html: `<div class="text-muted">${pesan}</div>`, width: '350px', confirmButtonColor: btnColor, padding: '1.2rem', customClass: { popup: 'card-outline card-' + (tipe === 'error' ? 'danger' : 'success') } });
  },
  loading: (pesan) => {
    Swal.fire({ width: '300px', title: '', html: `<div class="text-center p-3"><div class="spinner-border text-maroon" style="width: 3rem; height: 3rem;"></div><p class="mt-3 mb-0 font-weight-bold text-secondary">${pesan || 'Memproses...'}</p></div>`, showConfirmButton: false, allowOutsideClick: false });
  },
  konfirmasi: (judul, pesan, btnText) => {
    return Swal.fire({ icon: 'question', title: `<h5 class="font-weight-bold">${judul}</h5>`, text: pesan, width: '350px', showCancelButton: true, confirmButtonColor: '#d33', cancelButtonColor: '#3085d6', confirmButtonText: btnText || 'Ya', reverseButtons: true });
  }
};

// Jembatan fungsi lama agar form/halaman lain tidak eror
function toast(pesan, tipe) { NotifSultan.toast(tipe, pesan); }
function tampilkanNotif(pesan, tipe) { NotifSultan.toast(tipe, pesan); }
const Notif = {
  sukses: (p) => NotifSultan.alert('success', 'Berhasil', p),
  gagal: (p) => NotifSultan.alert('error', 'Gagal', p),
  konfirmasi: (p, cb) => { NotifSultan.konfirmasi('Konfirmasi', p).then((res) => { if(res.isConfirmed) cb(); }); }
};

/* =============================================================
   2. SISTEM MANAJEMEN SESI
   ============================================================= */
function getSesiUser() {
    var raw = localStorage.getItem("siksUser");
    if (!raw || raw === "null" || raw === "undefined") return null;
    try { 
        var parsed = JSON.parse(raw); 
        if (typeof parsed === 'string') parsed = JSON.parse(parsed); 
        return parsed;
    } catch (e) { return null; }
}

/* =============================================================
   3. CORE APP SCRIPT (INISIALISASI)
   ============================================================= */
$(document).ready(function() {
  console.log("SIKS-REBORN: Engine Started.");

  // === 🛠️ FIX MODAL Z-INDEX BUG 🛠️ ===
  // Memindahkan modal ke body sesaat sebelum terbuka agar tidak tertutup bayangan hitam
  $(document).on('show.bs.modal', '.modal', function () {
      $(this).appendTo('body');
  });
  // ===================================
  
  // 1. Jalankan Inisialisasi
  inisialisasiAplikasi();

  // 2. Handler Klik Menu Sidebar
  $(document).on('click', '.nav-sidebar .nav-link', function(e) {
      var pageName = $(this).data('page'); 
      if (pageName) {
          e.preventDefault(); 
          loadContent(pageName); 
          if ($(window).width() < 768) {
              $('body').removeClass('sidebar-open').addClass('sidebar-closed sidebar-collapse');
          }
      }
  });

  // 3. Handler Klik Beranda di Breadcrumb
  $(document).on('click', '.btn-home-crumb', function(e) {
      e.preventDefault();
      loadContent('home');
  });
});

function inisialisasiAplikasi() {
  var preloader = $('.preloader');
  
  try {
      var user = getSesiUser();

      if (!user) {
        $('#konten-aplikasi').hide();
        $('#gerbang-login').show(); 
        if (preloader.length) preloader.fadeOut('fast');
        return;
      }

      $('#gerbang-login').hide(); 
      $('#konten-aplikasi').show();

      updateUI(user);
      tampilkanMenuAdmin(user);
      
      loadContent('home'); 

      if (preloader.length) preloader.fadeOut('fast');

      // Self-Healing Nama User 
      var isInvalidName = !user.nama_lengkap || user.nama_lengkap === "User Web" || user.nama_lengkap === user.username;
      if (isInvalidName && user.username) {
          google.script.run.withSuccessHandler(function(res){
              if(res.found && res.nama_lengkap) {
                  user.nama_lengkap = res.nama_lengkap; user.nama = res.nama_lengkap; 
                  user.role = res.role; user.unit = res.unit;
                  localStorage.setItem("siksUser", JSON.stringify(user));
                  updateUI(user);
              }
          }).getUserProfileByName(user.username);
      }

  } catch(fatalError) {
      console.error("Init Error:", fatalError);
      $('#gerbang-login').hide(); $('#konten-aplikasi').show();
      loadContent('home');
      if (preloader.length) preloader.fadeOut('fast');
  }
}

/* =============================================================
   4. FUNGSI LOGIN & LOGOUT
   ============================================================= */
function handleLoginV2(event) {
  event.preventDefault();
  var btn = document.getElementById("tombolLogin");
  var form = document.getElementById("formLogin");
  
  btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Memproses...';
  btn.disabled = true;

  google.script.run
    .withSuccessHandler(function(response) {
      if (response.status === "success") {
        var userBersih = response.userData ? response.userData : response;
        localStorage.setItem("siksUser", JSON.stringify(userBersih));
        NotifSultan.toast('success', 'Login Berhasil!');
        setTimeout(function() { window.location.reload(); }, 500); 
      } else {
        btn.innerText = "MASUK"; btn.disabled = false;
        NotifSultan.alert('error', 'Login Gagal', response.message || "Username/Password salah.");
      }
    })
    .withFailureHandler(function(err) {
      btn.innerText = "MASUK"; btn.disabled = false;
      NotifSultan.alert('error', 'Koneksi Gagal', err.message);
    })
    .processLogin(form);
}

function handleLogout() {
  NotifSultan.konfirmasi('Keluar Aplikasi?', 'Sesi Anda akan diakhiri.', 'Ya, Logout')
  .then((result) => {
    if (result.isConfirmed) {
        
        // 1. Tampilkan Spinner
        NotifSultan.loading("Sedang keluar...");
        
        // 2. Hapus Sesi User dari Browser
        localStorage.removeItem("siksUser");
        
        // 3. Jeda sedikit agar proses hapus storage selesai
        setTimeout(function() {
             // 4. Reload Iframe (Cara paling aman di Google Apps Script)
             // Dengan cara ini, kita tidak melanggar keamanan window.top
             window.location.reload(); 
        }, 800);
    }
  });
}

/* =============================================================
   5. MESIN ROUTING
   ============================================================= */
function loadContent(pageName) {
  if(!pageName) return;
  const area = $('#app-content'); 

  // === 🛠️ TUKANG SAPU MODAL 🛠️ ===
  // Membersihkan modal tertinggal saat pindah menu agar tidak error/dobel
  $('body > .modal').remove();
  $('.modal-backdrop').remove();
  $('body').removeClass('modal-open').css('padding-right', '');
  // ==================================
  
  if (typeof NProgress !== 'undefined') {
      NProgress.configure({ showSpinner: false, speed: 500 });
      NProgress.start();
  }
  area.css({'transition': 'opacity 0.3s ease', 'opacity': '0.3'}); 

  google.script.run
    .withSuccessHandler(function(html) {
      if (typeof NProgress !== 'undefined') NProgress.done();
      area.css('opacity', '1');
      var animatedHtml = '<div class="sultan-page-transition">' + html + '</div>';
      area.html(animatedHtml);
      
      highlightSidebar(pageName);
      updateBreadcrumb(pageName);
    })
    .withFailureHandler(function(err){
      if (typeof NProgress !== 'undefined') NProgress.done();
      area.css('opacity', '1');
      NotifSultan.alert('error', 'Gagal Memuat', err.message);
    })
    .loadPage(pageName); 
}

/* =============================================================
   6. MANAJEMEN UI (Sidebar & Breadcrumb)
   ============================================================= */
function updateUI(u) {
  if (!u) return; 
  var name = u.nama_lengkap || u.fullName || u.nama || u.username || "User";
  var photo = u.photo || u.foto || "";
  var role = u.role || "User";
  var f = photo ? 'https://drive.google.com/thumbnail?id=' + photo + '&sz=w200' : 'https://ui-avatars.com/api/?name=' + encodeURIComponent(name) + '&background=random';
  
  $('#nav-user-photo, #dropdown-user-photo').attr('src', f);
  $('#nav-user-name, #dropdown-user-name-big, .user-panel .info a').text(name);
  $('#dropdown-user-role').text(role);
  $('.user-capsule span, .user-menu .nav-link span, .dropdown-user .dropdown-toggle span').text(name);

  if($('#uniUserLogin').length) $('#uniUserLogin').val(name);
}

function tampilkanMenuAdmin(user) {
  if (!user) return;
  var daftarMenuAdmin = ["menuTrashSK", "menu-setting-admin", "menu-monitoring-admin"];
  var isAdmin = (user.role || "").toString().toLowerCase().includes("admin");
  daftarMenuAdmin.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) {
      if (isAdmin) { el.classList.remove("d-none"); el.style.display = "block"; } 
      else { el.classList.add("d-none"); }
    }
  });
}

function updateBreadcrumb(pageName) {
    var $activeLink = $('a[data-page="' + pageName + '"]');
    var homeHtml = '<span style="cursor:pointer" class="btn-home-crumb"><i class="fas fa-home mr-1"></i> Beranda</span>';
    var separator = ' <i class="fas fa-angle-right mx-2 text-white-50" style="font-size: 0.8em;"></i> ';
    var breadHtml = homeHtml;

    if (pageName !== 'home' && $activeLink.length > 0) {
        var currentTitle = $activeLink.find('p').clone().children().remove().end().text().trim(); 
        var $parentTree = $activeLink.closest('.nav-treeview');
        
        if ($parentTree.length > 0) {
            var $parentLi = $parentTree.closest('.nav-item');
            var $parentLink = $parentLi.children('.nav-link');
            if ($parentLink.length > 0) {
                var parentTitle = $parentLink.find('p').clone().children().remove().end().text().trim();
                var $grandParentTree = $parentLi.closest('.nav-treeview');
                if ($grandParentTree.length > 0) {
                     var $grandParentLink = $grandParentTree.closest('.nav-item').children('.nav-link');
                     if ($grandParentLink.length > 0) {
                         breadHtml += separator + '<span class="text-white-50">' + $grandParentLink.find('p').clone().children().remove().end().text().trim() + '</span>';
                     }
                }
                breadHtml += separator + '<span class="text-white-50">' + parentTitle + '</span>';
            }
        }
        breadHtml += separator + '<span class="font-weight-bold text-white">' + (currentTitle || pageName) + '</span>';
    }
    $('#page-breadcrumb').html(breadHtml);
}

const MENU_MAPPING = {
    'home': 'Beranda', 'sk_dashboard': 'Dashboard SK', 'sk_data': 'Data SK', 'sk_status': 'Status Pengiriman',
    'lapbul_dashboard': 'Dashboard Laporan Bulan', 'lapbul_kelola': 'Kelola Data', 'lapbul_status': 'Status Laporan',
    'lapbul_format': 'Format Laporan',
    'siaba_dashboard': 'Dashboard Siaba', 'siaba_presensi_harian': 'Harian', 'siaba_presensi_apel': 'Apel dan Upacara',
    'siaba_presensi_tidak': 'Tidak Presensi', 'siaba_presensi_terlambat': 'Terlambat', 'siaba_presensi_pulang': 'Pulang Awal',
    'siaba_presensi_unduh': 'Unduh Rekap Bulanan', 'siaba_presensi_lupa': 'Lupa Presensi', 'siaba_presensi_salah': 'Salah Presensi',
    'siaba_perjalanan_dinas': 'Perjalanan Dinas', 'siaba_cuti_data': 'Pengajuan', 'siaba_cuti_sisa': 'Sisa Cuti Tahunan',
    'siaba_cuti_rekap': 'Rekap Cuti', 'siaba_cuti_unggah': 'Unggah Surat Cuti', 'siaba_cuti_informasi': 'Informasi',
    'siaba_format_panduan': 'Format dan Panduan', 'tata_naskah_dinas': 'Tata Naskah Dinas', 
    'ptk_dashboard': 'Dashboard PTK', 'ptk_kelola_paud': 'Daftar Nama PTK PAUD',
    'ptk_keadaan_paud': 'Keadaan PTK PAUD', 'ptk_kelola_sdn': 'Daftar Nama PTK SDN', 'ptk_keadaan_sdn': 'Keadaan PTK SDN',
    'ptk_kebutuhan_sdn': 'Kebutuhan Guru SDN', 'ptk_kelola_sds': 'Daftar Nama PTK SDS', 'ptk_keadaan_sds': 'Keadaan PTK SDS',
    'ptk_kebutuhan_sds': 'Kebutuhan Guru SDS', 'murid_dashboard': 'Dashboard Murid', 'murid_paud_rombel': 'PAUD Menurut Rombel',
    'murid_paud_jenis_kelamin': 'PAUD Menurut Jenis Kelamin', 'murid_sd_kelas': 'SD Menurut Kelas', 'murid_sd_rombel': 'SD Menurut Rombel',
    'murid_sd_agama': 'SD Menurut Agama', 'setting': 'Pengaturan', 'monitoring': 'Monitoring Aktivitas'
};

function highlightSidebar(pageName) {
    var textMenu = MENU_MAPPING[pageName] || pageName.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
    if (textMenu) activekanMenuBerdasarkanTeks(textMenu);
}

function activekanMenuBerdasarkanTeks(namaMenu) {
    $('.nav-sidebar .nav-link').removeClass('active');
    var target = $('.nav-sidebar .nav-link').filter(function() { return $(this).text().trim() === namaMenu; });

    if (target.length > 0) {
        $('.nav-sidebar li.menu-open').not(target.parents('li')).removeClass('menu-open').children('.nav-treeview').slideUp(300);
        target.addClass('active');
        target.parents('.nav-item').each(function() {
            $(this).children('.nav-link').addClass('active');
            if (!$(this).hasClass('menu-open')) {
                $(this).addClass('menu-open');
                $(this).children('.nav-treeview').slideDown(300);
            }
        });
    }
}

/* =============================================================
   7. FUNGSI LEGACY (UPLOAD DLL)
   ============================================================= */
function isiDropdownSK() {
    renderDropdown("namaSD", "NamaSD"); renderDropdown("tahunAjaran", "TahunAjaran");
    renderDropdown("semester", "Semester"); renderDropdown("kriteriaSK", "KriteriaSK");
}

function handleFormSubmit(event) {
  event.preventDefault();
  const btn = $('#submitBtn'); const fileInput = document.getElementById('fileUpload');
  if(!fileInput) return; const file = fileInput.files[0]; const user = getSesiUser();
  if (file && file.size > 1024 * 1024) { NotifSultan.toast('error', "Ukuran file maksimal 1 MB!"); return; }

  btn.html('<i class="fas fa-spinner fa-spin"></i> Mengirim...').attr('disabled', true);
  const reader = new FileReader();
  reader.onload = function(e) {
    const formData = {
      namaSD: $('#namaSD').val(), tahunAjaran: $('#tahunAjaran').val(), semester: $('#semester').val(),
      nomorSK: $('#nomorSK').val(), tanggalSK: $('#tanggalSK').val(), kriteriaSK: $('#kriteriaSK').val(),
      userInput: user ? user.nama_lengkap || user.nama : "User Web",
      fileData: { data: e.target.result.split(',')[1], mimeType: file.type, name: file.name }
    };
    google.script.run
      .withSuccessHandler(function(res) {
        NotifSultan.alert('success', 'Terkirim', res);
        $('#manualUploadForm')[0].reset(); $('.custom-file-label').html("Pilih file PDF...");
        btn.html('<i class="fas fa-paper-plane mr-2"></i> Kirim Dokumen').attr('disabled', false);
      }).processManualForm(formData);
  };
  reader.readAsDataURL(file);
}

function renderBadgeSultan(text) {
    if (!text) return '-'; var str = text.toString().toLowerCase(); var color = 'secondary', icon = '';
    if (str === 'ok' || str === 'disetujui' || str === 'aktif') { color = 'success'; icon = '<i class="fas fa-check mr-1"></i>'; } 
    else if (str === 'diproses' || str === 'menunggu') { color = 'warning text-white'; icon = '<i class="fas fa-clock mr-1"></i>'; } 
    else if (str === 'revisi') { color = 'info'; icon = '<i class="fas fa-sync mr-1"></i>'; } 
    else if (str === 'ditolak' || str === 'nonaktif') { color = 'danger'; icon = '<i class="fas fa-times mr-1"></i>'; }
    else if (str.includes('datang')) { color = 'primary'; icon = '<i class="fas fa-sign-in-alt mr-1"></i>'; } 
    else if (str.includes('pulang')) { color = 'dark'; icon = '<i class="fas fa-sign-out-alt mr-1"></i>'; }
    return `<span class="badge badge-pill badge-${color} shadow-sm px-3 py-1">${icon}${text}</span>`;
}

function initTabelSultan(selectorId) {
    var $tbl = $(selectorId); if ($tbl.length === 0) return;
    if ($.fn.DataTable.isDataTable(selectorId)) $tbl.DataTable().destroy();
    $tbl.DataTable({
        responsive: false, autoWidth: false, paging: true, lengthChange: true, searching: true, ordering: false, info: true, pageLength: 10,
        dom:  "<'row'<'col-sm-12 col-md-6'l><'col-sm-12 col-md-6'f>><'row'<'col-sm-12'tr>><'row'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>",
        language: { emptyTable: "Tidak ada data", info: "Hal _START_ s/d _END_ dari _TOTAL_", infoEmpty: "0 data", search: "Cari:", zeroRecords: "Tidak ditemukan", paginate: { first: "<<", last: ">>", next: ">", previous: "<" } }
    });
    $(selectorId).wrap('<div style="overflow-x: auto; width: 100%; border-top: 1px solid #dee2e6;"></div>');
}
</script>
